// Aceita Polygon, MultiPolygon e LINHAS fechadas (ou quase fechadas), porque
// Calçada e Rua costumam ser desenhadas com a ferramenta Linha do Giraffe.
// Cada parte de uma MultiLineString vira um polígono independente.
function feicoesParaPoligonos(list,unir){
  const out=[];
  const abertas=[];              // trechos de borda que não fecham sozinhos
  const idsUsados=[];
  for(const f of(list||[])){
    if(!f?.geometry) continue;
    const i=fid(f);
    if(i!==null&&i!==undefined) idsUsados.push(String(i));
    const g=f.geometry;
    if(g.type==='Polygon'||g.type==='MultiPolygon'){
      out.push({geom:g,gap:0,origem:g.type,unida:false});
      continue;
    }
    for(const part of linhasOf(g)){
      const cs=(part||[]).map(c=>[Number(c[0]),Number(c[1])])
        .filter(c=>isFinite(c[0])&&isFinite(c[1]));
      if(cs.length<2) continue;
      const a=cs[0],b=cs[cs.length-1];
      let gap=0;
      try{gap=turf.distance(turf.point(a),turf.point(b),{units:'meters'});}catch(_){}
      if(gap<=0.5){
        // já é um anel fechado
        const ring=gap>1e-4?[...cs,[a[0],a[1]]]:[...cs];
        if(ring.length>=4) out.push({geom:{type:'Polygon',coordinates:[ring]},gap,origem:g.type,unida:false});
      }else{
        abertas.push(cs);
      }
    }
  }
  // Duas ou mais bordas abertas: a intenção quase sempre é a FAIXA entre elas
  // (calçada e rua são desenhadas como duas linhas paralelas).
  if(unir&&abertas.length>=2){
    const anel=encadearLinhas(abertas);
    if(anel) out.push({geom:{type:'Polygon',coordinates:[anel]},gap:0,
      origem:'faixa',unida:true,nLinhas:abertas.length});
  }else{
    for(const cs of abertas){
      const a=cs[0];
      const ring=[...cs,[a[0],a[1]]];
      let gap=0;
      try{gap=turf.distance(turf.point(a),turf.point(cs[cs.length-1]),{units:'meters'});}catch(_){}
      if(ring.length>=4) out.push({geom:{type:'Polygon',coordinates:[ring]},gap,
        origem:'linha',unida:false});
    }
  }
  let descartados=0;
  const validos=out.filter(o=>{
    let a=0;
    try{a=turf.area({type:'Feature',properties:{},geometry:o.geom});}catch(_){}
    if(a>0.5) return true;
    // Área nula quase sempre significa anel cruzado: os laços se anulam.
    descartados++;
    return false;
  });
  for(const o of validos){
    o.sliver=razaoSliver(o.geom);
    o.kinks=o.geom.type==='Polygon'?contarKinks(o.geom.coordinates[0]):0;
  }
  validos.idsUsados=idsUsados;
  validos.descartados=descartados;
  return validos;
}


function buildTinIndex(feats){
  const tris=[];
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const f of feats||[]){
    const r=f?.geometry?.coordinates?.[0];
    if(!r||r.length<3) continue;
    const t={
      ax:r[0][0],ay:r[0][1],az:r[0][2]||0,
      bx:r[1][0],by:r[1][1],bz:r[1][2]||0,
      cx:r[2][0],cy:r[2][1],cz:r[2][2]||0,
    };
    // Triângulo PLANO: os três vértices na mesma curva de nível. A Delaunay
    // sobre pontos de curvas produz muitos deles nas reentrâncias e curvas
    // fechadas — em terreno real chegam a 40% dos triângulos. Interpolar
    // dentro de um deles devolve a cota da curva, não um valor entre curvas:
    // é o que grudava trechos inteiros de rua e calçada na cota mínima.
    t.plano=(t.az===t.bz&&t.bz===t.cz);
    t.minX=Math.min(t.ax,t.bx,t.cx);t.maxX=Math.max(t.ax,t.bx,t.cx);
    t.minY=Math.min(t.ay,t.by,t.cy);t.maxY=Math.max(t.ay,t.by,t.cy);
    tris.push(t);
    if(t.minX<minX)minX=t.minX; if(t.maxX>maxX)maxX=t.maxX;
    if(t.minY<minY)minY=t.minY; if(t.maxY>maxY)maxY=t.maxY;
  }
  if(!tris.length) return null;
  const nPlanos=tris.reduce((n,t)=>n+(t.plano?1:0),0);
  const cell=Math.max((maxX-minX)/72,(maxY-minY)/72,2e-6);
  const grid=new Map();
  tris.forEach((t,ti)=>{
    const i0=Math.floor((t.minX-minX)/cell),i1=Math.floor((t.maxX-minX)/cell);
    const j0=Math.floor((t.minY-minY)/cell),j1=Math.floor((t.maxY-minY)/cell);
    for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){
      const k=i+':'+j;
      let a=grid.get(k);
      if(!a){a=[];grid.set(k,a);}
      a.push(ti);
    }
  });
  return{tris,grid,cell,minX,minY,maxX,maxY,nPlanos};
}

// Retorna {z, modo} — 'exato' = interpolação baricêntrica dentro de um
// triângulo; 'vizinho' = vértice mais próximo dentro do limiar; null = fora
// da cobertura útil. O modo alimenta o diagnóstico de cobertura do TIN.
function zFromTinEx(idx,lng,lat,maxGap){
  if(_MODO_COTA==='prop'){
    const zp=zProporcional(_INTERP,lng,lat);
    if(zp!==null&&isFinite(zp)) return{z:zp,modo:'proporcao'};
  }
  if(!idx) return{z:null,modo:null};
  const{tris,grid,cell,minX,minY}=idx;
  const i=Math.floor((lng-minX)/cell),j=Math.floor((lat-minY)/cell);
  const cand=grid.get(i+':'+j);
  let zPlano=null;
  if(cand){
    for(const ti of cand){
      const t=tris[ti];
      const det=(t.by-t.cy)*(t.ax-t.cx)+(t.cx-t.bx)*(t.ay-t.cy);
      if(Math.abs(det)<1e-14) continue;
      const w1=((t.by-t.cy)*(lng-t.cx)+(t.cx-t.bx)*(lat-t.cy))/det;
      const w2=((t.cy-t.ay)*(lng-t.cx)+(t.ax-t.cx)*(lat-t.cy))/det;
      const w3=1-w1-w2;
      if(w1>=-1e-3&&w2>=-1e-3&&w3>=-1e-3){
        // Triângulo plano não descreve relevo: guarda o valor e segue
        // procurando um triângulo que ligue curvas de cotas diferentes.
        if(t.plano&&_CORRIGIR_PLANOS){if(zPlano===null) zPlano=t.az;continue;}
        return{z:w1*t.az+w2*t.bz+w3*t.cz,modo:'exato'};
      }
    }
  }
  if(zPlano!==null){
    const zp=zProporcional(_INTERP,lng,lat);
    if(zp!==null&&isFinite(zp)) return{z:zp,modo:'plano-corrigido'};
    return{z:zPlano,modo:'plano'};
  }
  // Fora de qualquer triângulo — típico da faixa entre curvas quase paralelas,
  // onde o maxEdge apagou os triângulos de ligação. Aqui entra a proporção
  // pela distância às duas curvas mais próximas, em vez do vizinho em degraus.
  const zp=zProporcional(_INTERP,lng,lat);
  if(zp!==null&&isFinite(zp)) return{z:zp,modo:'proporcao'};
  const R=Math.max(1,Math.ceil(maxGap/cell));
  let bestZ=null,bestD=Infinity;
  for(let di=-R;di<=R;di++)for(let dj=-R;dj<=R;dj++){
    const a=grid.get((i+di)+':'+(j+dj));
    if(!a) continue;
    for(const ti of a){
      const t=tris[ti];
      const vs=[[t.ax,t.ay,t.az],[t.bx,t.by,t.bz],[t.cx,t.cy,t.cz]];
      for(const v of vs){
        const d=Math.hypot(lng-v[0],lat-v[1]);
        if(d<bestD){bestD=d;bestZ=v[2];}
      }
    }
  }
  return bestD<=maxGap?{z:bestZ,modo:'vizinho'}:{z:null,modo:null};
}

// Retorna Z interpolado ou null quando fora da cobertura útil do TIN.
function zFromTin(idx,lng,lat,maxGap){
  return zFromTinEx(idx,lng,lat,maxGap).z;
}

// ══════════════════════════════════════════════════════════════
//  Interpolação proporcional entre curvas de nível
//
//  Quando a rua corre QUASE PARALELA às curvas, boa parte dos seus vértices
//  fica na faixa entre duas curvas sem tocar nenhuma. O TIN de Delaunay nem
//  sempre cobre essa faixa: o filtro maxEdge descarta os triângulos longos
//  que ligariam uma curva à outra sempre que o espaçamento entre curvas for
//  grande em relação ao espaçamento AO LONGO delas — exatamente a geometria
//  de curvas paralelas. Sem triângulo, a interpolação baricêntrica falha e o
//  vértice caía no vizinho mais próximo, que é uma função em degraus: todos
//  os pontos da faixa recebiam a cota da curva de baixo.
//
//  Aqui a cota é calculada como o próprio desenho manda: distância até a
//  curva mais próxima (z1, d1) e até a curva mais próxima de cota DIFERENTE
//  (z2, d2), com proporção linear entre as duas.
//
//      z = z1 + (z2 − z1) · d1 / (d1 + d2)
//
//  Sobre a curva → d1 = 0 → z = z1. No meio do vão → 0,5. Não depende de
//  triangulação nenhuma.
// ══════════════════════════════════════════════════════════════
let _INTERP=null;
let _MODO_COTA='auto';   // 'auto' = TIN baricêntrico com proporção no fallback
                         // 'prop' = sempre proporção de distância entre curvas
let _CORRIGIR_PLANOS=true;   // ignora triângulos de cota única na interpolação
function criarInterpolador(cPts){
  if(!cPts||!cPts.length) return null;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of cPts){
    if(p.lng<minX)minX=p.lng; if(p.lng>maxX)maxX=p.lng;
    if(p.lat<minY)minY=p.lat; if(p.lat>maxY)maxY=p.lat;
  }
  const cell=Math.max((maxX-minX)/120,(maxY-minY)/120,2e-6);
  const grid=new Map();
  cPts.forEach((p,i)=>{
    const k=Math.floor((p.lng-minX)/cell)+':'+Math.floor((p.lat-minY)/cell);
    let a=grid.get(k);
    if(!a){a=[];grid.set(k,a);}
    a.push(i);
  });
  const cotas=new Set(cPts.map(p=>p.z));
  return{pts:cPts,grid,cell,minX,minY,maxX,maxY,ncotas:cotas.size};
}
function zProporcional(ip,lng,lat){
  if(!ip) return null;
  const{pts,grid,cell,minX,minY,maxX,maxY}=ip;
  const i0=Math.floor((lng-minX)/cell),j0=Math.floor((lat-minY)/cell);
  // O raio precisa cobrir a extensão dos dados MAIS a distância do ponto até
  // eles — senão um ponto afastado nunca alcança a grade e volta null.
  const foraX=Math.max(0,minX-lng,lng-maxX);
  const foraY=Math.max(0,minY-lat,lat-maxY);
  const alcance=Math.max(maxX-minX,maxY-minY)+Math.max(foraX,foraY);
  const Rmax=Math.min(3000,Math.ceil(alcance/cell)+2);
  const porCota=new Map();          // cota → menor distância encontrada
  const visitar=(ci,cj)=>{
    const a=grid.get(ci+':'+cj);
    if(!a) return;
    for(const k of a){
      const p=pts[k];
      const d=Math.hypot(lng-p.lng,lat-p.lat);
      const cur=porCota.get(p.z);
      if(cur===undefined||d<cur) porCota.set(p.z,d);
    }
  };
  // percorre só o perímetro do anel — O(R) em vez de O(R²)
  const varrer=(R)=>{
    if(R===0){visitar(i0,j0);return;}
    for(let d=-R;d<=R;d++){visitar(i0+d,j0-R);visitar(i0+d,j0+R);}
    for(let d=-R+1;d<=R-1;d++){visitar(i0-R,j0+d);visitar(i0+R,j0+d);}
  };
  for(let R=0;R<=Rmax;R++){
    varrer(R);
    if(porCota.size>=2){
      const arr=[...porCota.entries()].sort((a,b)=>a[1]-b[1]);
      // só conclui quando o anel varrido já garante que não há nada mais
      // próximo lá fora — senão a segunda cota poderia estar errada
      if(arr[1][1]<=R*cell){
        const[z1,d1]=arr[0],[z2,d2]=arr[1];
        const s=d1+d2;
        return s<=0?z1:z1+(z2-z1)*(d1/s);
      }
    }
  }
  if(!porCota.size) return null;
  const arr=[...porCota.entries()].sort((a,b)=>a[1]-b[1]);
  if(arr.length===1) return arr[0][0];
  const[z1,d1]=arr[0],[z2,d2]=arr[1];
  const s=d1+d2;
  return s<=0?z1:z1+(z2-z1)*(d1/s);
}

// Atribui cotas percorrendo TODOS os cruzamentos na ordem em que a linha de
// corte os encontra, tratando a sequência como parênteses aninhados.
//
// Um morro tem curvas fechadas: a linha de corte entra e sai de cada uma.
// A sequência vira A B C C B A — sobe até o topo e desce pelo mesmo caminho.
// Contando só a primeira interceptação de cada curva (o que se fazia antes),
// a descida some e as curvas do morro seguinte continuam somando a partir do
// topo do anterior, empilhando altura que não existe.
//
// Aqui a profundidade da pilha É a cota: cada curva nova recebe a cota do
// nível em que aparece, e reencontrar uma curva já empilhada significa sair
// dela — desempilha e volta ao nível de fora. Dois morros iguais lado a lado
// recebem as mesmas cotas, em vez de o segundo começar onde o primeiro parou.
//
// Terreno em rampa, sem curvas fechadas, cai no caso trivial: a pilha só
// cresce e as cotas ficam 0, +1, +2… exatamente como antes.
//
// Ressalva: uma depressão fechada é geometricamente idêntica a um morro para
// este algoritmo — ambas dão cotas crescentes para dentro. Nesse caso, ajuste
// as cotas na tabela.
function cotasPorAninhamento(cruzamentos,datum,passo,fechadas){
  const cotas=new Map(),ordem=[],pilha=[];
  let profMax=0,reencOpen=0,reencFech=0;
  const ehFechada=k=>!fechadas||fechadas.get(k)===true;
  for(const c of cruzamentos){
    const k=c.key;
    const iP=pilha.lastIndexOf(k);
    if(iP>=0){
      // Reencontro. Só uma curva FECHADA separa o plano: cruzá-la de novo
      // significa mesmo ter saído dela, e o nível volta ao de fora.
      //
      // Uma curva ABERTA não separa o plano. Numa encosta, uma reta de corte
      // cruza a mesma curva sinuosa duas vezes com o terreno seguindo a subir.
      // Desempilhar nesse caso rebaixa tudo o que vem depois — e quando a
      // pilha esvazia, a curva seguinte volta à cota do datum no meio da
      // encosta. Era a origem das curvas cotadas em zero em terreno alto.
      if(ehFechada(k)){pilha.length=iP;reencFech++;}
      else reencOpen++;
    }else{
      if(!cotas.has(k)){
        cotas.set(k,Number((datum+pilha.length*passo).toFixed(3)));
        ordem.push(k);
      }
      pilha.push(k);
      if(pilha.length>profMax) profMax=pilha.length;
    }
  }
  return{cotas,ordem,profMax,reencOpen,reencFech};
}

// Uma curva é fechada quando suas pontas coincidem (dentro da tolerância).
function curvaFechada(feat,tolM){
  const partes=linhasOf(feat?.geometry);
  if(!partes.length) return false;
  for(const p of partes){
    if(!p||p.length<3) continue;
    const a=p[0],b=p[p.length-1];
    let d=0;
    try{d=turf.distance(turf.point([a[0],a[1]]),turf.point([b[0],b[1]]),{units:'meters'});}
    catch(_){return false;}
    if(d<=(tolM===undefined?1:tolM)) return true;
  }
  return false;
}

// Refino adaptativo de uma aresta do contorno.
//
// O adensamento uniforme trata igual um trecho plano e um trecho que atravessa
// várias curvas de nível. Para acertar a divisa entre calçada e rua onde a
// linha é contínua, seria preciso baixar o passo no desenho inteiro — e o
// número de triângulos explode.
//
// Aqui a subdivisão é por erro: mede-se a cota no meio do trecho e compara-se
// com a média das pontas. Se a diferença passa da tolerância, o ponto entra e
// as duas metades são reavaliadas. Trecho plano não ganha ponto nenhum;
// trecho que cruza o relevo ganha exatamente os pontos necessários.
function subdividirAresta(a,za,b,zb,zAt,minDeg,tolZ,prof){
  if(prof>=9) return[];
  const d=Math.hypot(b[0]-a[0],b[1]-a[1]);
  if(d<=minDeg) return[];
  const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const zm=zAt(m[0],m[1]);
  if(zm===null||!isFinite(zm)) return[];
  if(Math.abs(zm-(za+zb)/2)<=tolZ) return[];
  return[
    ...subdividirAresta(a,za,m,zm,zAt,minDeg,tolZ,prof+1),
    [m[0],m[1],zm],
    ...subdividirAresta(m,zm,b,zb,zAt,minDeg,tolZ,prof+1),
  ];
}

// Recostura as partes de uma MultiLineString cujas pontas se encostam.
// Um "join" no Giraffe sobre linhas contíguas pode gerar uma MultiLineString
// com trechos que, na prática, formam uma polilinha só. Separar parte a parte
// desfaria esse trabalho; aqui as partes contíguas voltam a ser um único
// caminho e apenas os trechos realmente soltos viram linhas separadas.
function unirTrechosContiguos(partes,tolM){
  const rest=(partes||[])
    .map(p=>(p||[]).map(c=>[Number(c[0]),Number(c[1])]).filter(c=>isFinite(c[0])&&isFinite(c[1])))
    .filter(p=>p.length>=2);
  if(rest.length<2) return rest;
  const latRef=rest[0][0][1];
  const kLng=Math.cos((isFinite(latRef)?latRef:-23.5)*DEG);
  const dist=(p,q)=>Math.hypot((p[0]-q[0])*kLng,p[1]-q[1])*M_PER_DEG_LAT;
  const tol=tolM===undefined?0.10:tolM;
  const runs=[];
  while(rest.length){
    let cur=rest.shift();
    let mudou=true;
    while(mudou){
      mudou=false;
      for(let i=0;i<rest.length;i++){
        const o=rest[i];
        const a=cur[0],b=cur[cur.length-1];
        const oa=o[0],ob=o[o.length-1];
        if(dist(b,oa)<=tol){cur=cur.concat(o.slice(1));}
        else if(dist(b,ob)<=tol){cur=cur.concat(o.slice().reverse().slice(1));}
        else if(dist(a,ob)<=tol){cur=o.slice(0,-1).concat(cur);}
        else if(dist(a,oa)<=tol){cur=o.slice().reverse().slice(0,-1).concat(cur);}
        else continue;
        rest.splice(i,1);mudou=true;break;
      }
    }
    runs.push(cur);
  }
  return runs;
}

// Densifica uma linha ABERTA inserindo vértices a cada stepDeg.
// densifyRing fecha o anel no fim; curvas de nível não podem ser fechadas.
// Sem isto, uma curva desenhada como reta de 2 vértices entrega só 2 pontos ao
// Delaunay e a triangulação atravessa a curva em vez de acompanhá-la.
function densificarLinha(coords,stepDeg){
  if(!coords||coords.length<2) return(coords||[]).map(c=>[Number(c[0]),Number(c[1])]);
  const out=[];
  for(let i=0;i<coords.length-1;i++){
    const p1=coords[i],p2=coords[i+1];
    out.push([Number(p1[0]),Number(p1[1])]);
    const d=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    if(d>stepDeg){
      const n=Math.min(2000,Math.ceil(d/stepDeg));
      for(let j=1;j<n;j++){
        const t=j/n;
        out.push([p1[0]+t*(p2[0]-p1[0]),p1[1]+t*(p2[1]-p1[1])]);
      }
    }
  }
  const u=coords[coords.length-1];
  out.push([Number(u[0]),Number(u[1])]);
  return out.filter(c=>isFinite(c[0])&&isFinite(c[1]));
}

// Distância típica entre curvas VIZINHAS de cotas diferentes. É o número que o
// filtro maxEdge do TIN precisa respeitar: se o limiar ficar abaixo dele, todos
// os triângulos que ligam uma curva à outra são descartados e o TIN vira fitas
// soltas sobre cada curva — o que piora justamente quando se densifica mais.
function estimarEspacamentoEntreCurvas(cPts,amostra){
  if(!cPts||cPts.length<2) return 0;
  const n=cPts.length;
  const passo=Math.max(1,Math.floor(n/(amostra||200)));
  const ds=[];
  for(let i=0;i<n;i+=passo){
    const a=cPts[i];
    let melhor=Infinity;
    for(let j=0;j<n;j++){
      const b=cPts[j];
      if(b.z===a.z) continue;
      const d=Math.hypot(a.lng-b.lng,a.lat-b.lat);
      if(d<melhor) melhor=d;
    }
    if(isFinite(melhor)) ds.push(melhor);
  }
  if(!ds.length) return 0;
  ds.sort((x,y)=>x-y);
  return ds[ds.length>>1];
}

// ══════════════════════════════════════════════════════════════
//  Camadas do desenho e visibilidade
//
//  As feições de rawSections carregam a camada em properties.layerId (ou
//  variantes). O SDK não documenta uma chave de leitura da visibilidade, então
//  aqui há duas vias: sondagem automática de várias fontes possíveis e, como
//  garantia, uma lista manual de camadas que o usuário liga e desliga.
// ══════════════════════════════════════════════════════════════
function camadaDe(f){
  const p=f?.properties||{};
  const v=p.layerId??p.layer??p.layer_id??p.layerName??p.layer_name;
  return v===undefined||v===null||v===''?'(sem camada)':String(v);
}
function extrairVisibilidade(obj,out,vistos,prof){
  if(!obj||prof>5) return;
  if(typeof obj!=='object') return;
  if(vistos.has(obj)) return;
  vistos.add(obj);
  if(Array.isArray(obj)){
    for(const x of obj) extrairVisibilidade(x,out,vistos,prof+1);
    return;
  }
  const nome=obj.layerId??obj.id??obj.name??obj.layer_name??null;
  let vis=obj.visible;
  if(vis===undefined) vis=obj.isVisible;
  if(vis===undefined&&typeof obj.hidden==='boolean') vis=!obj.hidden;
  if(vis===undefined&&typeof obj.on==='boolean') vis=obj.on;
  if(nome!==null&&nome!==undefined&&typeof vis==='boolean') out.set(String(nome),vis);
  for(const k of Object.keys(obj)){
    const v=obj[k];
    if(v&&typeof v==='object') extrairVisibilidade(v,out,vistos,prof+1);
  }
}

// Réplica fiel do getZFromTIN do app de referência.
// Duas diferenças que importam em relação ao zFromTin usado no drape:
//   1. NUNCA devolve null — se o ponto cair fora de todos os triângulos, usa
//      o vértice mais próximo do TIN sem nenhum limite de distância;
//   2. clampa em zero (Math.max(0, ...)), como a referência.
// É a função usada na etapa de PATCH, onde devolver null viraria cota 0 e
// derrubaria o triângulo para o chão.
function getZFromTIN(idx,lng,lat){
  if(_MODO_COTA==='prop'){
    const zp=zProporcional(_INTERP,lng,lat);
    if(zp!==null&&isFinite(zp)) return Math.max(0,zp);
  }
  if(!idx) return 0;
  const{tris,grid,cell,minX,minY}=idx;
  const i=Math.floor((lng-minX)/cell),j=Math.floor((lat-minY)/cell);
  const cand=grid.get(i+':'+j);
  let zPlano=null;
  if(cand){
    for(const ti of cand){
      const t=tris[ti];
      const det=(t.by-t.cy)*(t.ax-t.cx)+(t.cx-t.bx)*(t.ay-t.cy);
      if(Math.abs(det)<1e-14) continue;
      const w1=((t.by-t.cy)*(lng-t.cx)+(t.cx-t.bx)*(lat-t.cy))/det;
      const w2=((t.cy-t.ay)*(lng-t.cx)+(t.ax-t.cx)*(lat-t.cy))/det;
      const w3=1-w1-w2;
      if(w1>=-1e-3&&w2>=-1e-3&&w3>=-1e-3){
        if(t.plano&&_CORRIGIR_PLANOS){if(zPlano===null) zPlano=t.az;continue;}
        return Math.max(0,w1*t.az+w2*t.bz+w3*t.cz);
      }
    }
  }
  if(zPlano!==null){
    const zp=zProporcional(_INTERP,lng,lat);
    if(zp!==null&&isFinite(zp)) return Math.max(0,zp);
    return Math.max(0,zPlano);
  }
  // Fora de qualquer triângulo: proporção pela distância às curvas.
  const zp=zProporcional(_INTERP,lng,lat);
  if(zp!==null&&isFinite(zp)) return Math.max(0,zp);
  // Último recurso: vértice mais próximo do TIN (comportamento da referência).
  let bestZ=0,bestD=Infinity;
  for(const t of tris){
    const vs=[[t.ax,t.ay,t.az],[t.bx,t.by,t.bz],[t.cx,t.cy,t.cz]];
    for(const v of vs){
      const d=Math.hypot(lng-v[0],lat-v[1]);
      if(d<bestD){bestD=d;bestZ=v[2]||0;}
    }
  }
  return Math.max(0,bestZ);
}

// ══════════════════════════════════════════════════════════════
//  Delaunator (carregamento tardio)
// ══════════════════════════════════════════════════════════════
let _DEL=null;
async function getDelaunator(){
  if(!_DEL) _DEL=(await import('https://esm.sh/delaunator@5.0.0')).default;
  return _DEL;
}

// TIN global sobre todos os pontos cotados das curvas.
async function buildTIN(pts,arestaMin){
  const Delaunator=await getDelaunator();
  if(pts.length<4) throw new Error('Pontos insuficientes para o TIN: '+pts.length);
  const SNAP=5e-6,seen=new Set(),cl=[];
  for(const p of pts){
    const k=Math.round(p.lng/SNAP)+','+Math.round(p.lat/SNAP);
    if(seen.has(k)) continue;
    seen.add(k);cl.push(p);
  }
  if(cl.length<4) throw new Error('Pontos deduplicados insuficientes');
  const d=new Delaunator(cl.flatMap(p=>[p.lng,p.lat]));
  // Limiar adaptativo de aresta. A mediana sozinha é enganosa: ao densificar
  // AO LONGO das curvas ela despenca e passa a descartar exatamente os
  // triângulos que ligam uma curva à outra. Por isso o limiar nunca fica
  // abaixo do espaçamento medido entre curvas vizinhas (arestaMin).
  const samp=[];
  for(let i=0;i<Math.min(d.triangles.length,1200);i+=3){
    const A=cl[d.triangles[i]],B=cl[d.triangles[i+1]];
    samp.push(Math.hypot(A.lng-B.lng,A.lat-B.lat));
  }
  samp.sort((a,b)=>a-b);
  const maxEdge=Math.max((samp[samp.length>>1]||0.001)*7,arestaMin||0,3e-4);
  const feats=[];
  for(let i=0;i<d.triangles.length;i+=3){
    const A=cl[d.triangles[i]],B=cl[d.triangles[i+1]],C=cl[d.triangles[i+2]];
    const e=Math.max(
      Math.hypot(A.lng-B.lng,A.lat-B.lat),
      Math.hypot(B.lng-C.lng,B.lat-C.lat),
      Math.hypot(C.lng-A.lng,C.lat-A.lat));
    if(e>maxEdge) continue;
    feats.push({type:'Feature',
      properties:{avgH:(A.z+B.z+C.z)/3,ha:A.z,hb:B.z,hc:C.z},
      geometry:{type:'Polygon',coordinates:[[
        [A.lng,A.lat,A.z],[B.lng,B.lat,B.z],[C.lng,C.lat,C.z],[A.lng,A.lat,A.z]]]}});
  }
  return{type:'FeatureCollection',features:feats};
}

// Drape + triangulação de um polígono contra o TIN global.
// `curvasSeg` = segmentos de curva já cotados, com bbox pré-calculada. Onde o
// contorno da rua/calçada cruza uma curva de nível a altura é CONHECIDA com
// exatidão (é a cota daquela curva). Inserir esses cruzamentos como nós força
// a triangulação a quebrar exatamente ali, em vez de interpolar por cima.
async function drapePolygon(geomFeat,tinIdx,stepDeg,cPts,maxGap,curvasSeg,opts){
  const Delaunator=await getDelaunator();
  if(!geomFeat?.geometry) return[];
  const polys=geomFeat.geometry.type==='Polygon'?[geomFeat.geometry.coordinates]
    :geomFeat.geometry.type==='MultiPolygon'?geomFeat.geometry.coordinates:[];
  const out=[];
  let nCruz=0,nExato=0,nViz=0,nFora=0,nProp=0,nAdapt=0,nPlano=0,nPlanoC=0;
  const adapt=opts?.adapt!==false;
  const minDeg=(opts?.minM??0.5)/M_PER_DEG_LAT;
  const tolZ=opts?.tolZ??0.05;
  const zq=(x,y)=>{const r=zFromTinEx(tinIdx,x,y,maxGap);return r.z;};
  for(const pc of polys){
    if(!pc.length||!pc[0]||pc[0].length<4) continue;
    const poly2D={type:'Feature',properties:{},
      geometry:{type:'Polygon',coordinates:pc.map(r=>r.map(p=>[p[0],p[1]]))}};
    const SNAP=5e-7,seen=new Set(),pts=[],orig=[];
    // A origem de cada vértice é registrada e exportada no GeoJSON. Quando um
    // ponto sai com a cota errada, a letra diz qual caminho o produziu, em vez
    // de deixar a dedução para depois.
    //   X = cruzamento do contorno com uma curva (cota exata da curva)
    //   B = vértice do contorno adensado (cota do TIN)
    //   R = refino adaptativo (cota do TIN)
    //   C = ponto de curva dentro do polígono (cota exata da curva)
    const add=(lng,lat,z,src)=>{
      const k=Math.round(lng/SNAP)+','+Math.round(lat/SNAP);
      if(seen.has(k)) return false;
      seen.add(k);pts.push([lng,lat,Math.max(0,z)]);orig.push(src||'?');return true;
    };
    // A0) Cruzamentos contorno × curva de nível — cota exata, inseridos
    //     ANTES do adensamento para terem prioridade na deduplicação.
    if(curvasSeg&&curvasSeg.length){
      for(let ri=0;ri<pc.length;ri++){
        const anel=pc[ri].map(p=>[p[0],p[1]]);
        if(anel.length<2) continue;
        const bbA=bboxDe(anel);
        let rl;
        try{rl=turf.lineString(anel);}catch(_){continue;}
        for(const cv of curvasSeg){
          if(!bboxCruza(bbA,cv.bb)) continue;
          let inter;
          try{inter=turf.lineIntersect(rl,cv.line);}catch(_){continue;}
          for(const ip of inter.features||[]){
            const c=ip.geometry?.coordinates;
            if(!c||!isFinite(c[0])||!isFinite(c[1])) continue;
            if(add(c[0],c[1],cv.cota,'X')) nCruz++;
          }
        }
      }
    }
    // A) Anéis (externo + buracos) adensados, Z pelo TIN
    for(let ri=0;ri<pc.length;ri++){
      const dr=densifyRing(pc[ri],stepDeg);
      let ant=null,zAnt=null;
      for(const c of dr.slice(0,-1)){
        const r=zFromTinEx(tinIdx,c[0],c[1],maxGap);
        if(r.z===null||!isFinite(r.z)){nFora++;ant=null;zAnt=null;continue;}
        if(r.modo==='exato') nExato++;
        else if(r.modo==='proporcao') nProp++;
        else if(r.modo==='plano-corrigido') nPlanoC++;
        else if(r.modo==='plano') nPlano++;
        else nViz++;
        if(adapt&&ant!==null){
          for(const m of subdividirAresta(ant,zAnt,c,r.z,zq,minDeg,tolZ,0)){
            if(add(m[0],m[1],m[2],'R')) nAdapt++;
          }
        }
        add(c[0],c[1],r.z,'B');
        ant=c;zAnt=r.z;
      }
    }
    // B) Pontos de curva dentro do polígono — cota exata (fonte de verdade)
    for(const cp of cPts){
      try{
        if(turf.booleanPointInPolygon(turf.point([cp.lng,cp.lat]),poly2D)) add(cp.lng,cp.lat,cp.z,'C');
      }catch(_){}
    }
    if(pts.length<3) continue;
    const d=new Delaunator(pts.flatMap(p=>[p[0],p[1]]));
    for(let i=0;i<d.triangles.length;i+=3){
      const A=pts[d.triangles[i]],B=pts[d.triangles[i+1]],C=pts[d.triangles[i+2]];
      const area=(B[0]-A[0])*(C[1]-A[1])-(C[0]-A[0])*(B[1]-A[1]);
      if(Math.abs(area)<1e-14) continue;
      const cx=(A[0]+B[0]+C[0])/3,cy=(A[1]+B[1]+C[1])/3;
      try{if(!turf.booleanPointInPolygon(turf.point([cx,cy]),poly2D)) continue;}
      catch(_){continue;}
      out.push({type:'Feature',
        properties:{avgH:(A[2]+B[2]+C[2])/3,ha:A[2],hb:B[2],hc:C[2],
          kv_src:orig[d.triangles[i]]+orig[d.triangles[i+1]]+orig[d.triangles[i+2]]},
        geometry:{type:'Polygon',coordinates:[[
          [A[0],A[1],A[2]],[B[0],B[1],B[2]],[C[0],C[1],C[2]],[A[0],A[1],A[2]]]]}});
    }
  }
  return{tris:out,nCruz,nExato,nViz,nFora,nProp,nAdapt,nPlano,nPlanoC};
}

// bbox rápida de uma lista de coordenadas + teste de sobreposição
function bboxDe(coords){
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  for(const p of coords){
    if(p[0]<a)a=p[0]; if(p[1]<b)b=p[1];
    if(p[0]>c)c=p[0]; if(p[1]>d)d=p[1];
  }
  return[a,b,c,d];
}
function bboxCruza(x,y){
  return!(x[2]<y[0]||y[2]<x[0]||x[3]<y[1]||y[3]<x[1]);
}

// ══════════════════════════════════════════════════════════════
//  Malha única conforme
//
//  Triangular cada uso do solo em separado cria uma junção NÃO CONFORME:
//  na divisa entre Calçada e Rua os dois polígonos descrevem a mesma linha,
//  mas o adensamento de cada anel começa de um vértice diferente, então os
//  nós dos dois lados não coincidem. Cada malha interpola a divisa com
//  segmentos distintos e aparecem degraus e fendas — sempre exatamente no
//  cruzamento entre as camadas, que é onde o gradiente é maior.
//
//  Aqui os pontos de TODOS os contornos entram num único conjunto, a
//  triangulação de Delaunay roda UMA vez e cada triângulo é atribuído a uma
//  camada pelo centróide. Como a malha é uma só, a divisa é compartilhada
//  vértice a vértice: sem fenda, sem sobreposição, e cada triângulo pertence
//  a exatamente um uso do solo.
// ══════════════════════════════════════════════════════════════
function bboxGeom(g){
  const cs=[];
  const walk=(a,d)=>{if(d===0){cs.push(a);return;}for(const x of a)walk(x,d-1);};
  const D={Polygon:2,MultiPolygon:3};
  walk(g.coordinates,D[g.type]??2);
  return bboxDe(cs);
}
async function drapeConforme(finais,chaves,tinIdx,stepDeg,cPts,maxGap,curvasSeg,limite,opts){
  const Delaunator=await getDelaunator();
  const SNAP=5e-7,seen=new Set(),pts=[];
  let nCruz=0,nExato=0,nViz=0,nFora=0,nProp=0,nAdapt=0,nPlano=0,nPlanoC=0;
  const adapt=opts?.adapt!==false;
  const minDeg=(opts?.minM??0.5)/M_PER_DEG_LAT;
  const tolZ=opts?.tolZ??0.05;
  const zq=(x,y)=>{const r=zFromTinEx(tinIdx,x,y,maxGap);return r.z;};
  const add=(lng,lat,z)=>{
    const k=Math.round(lng/SNAP)+','+Math.round(lat/SNAP);
    if(seen.has(k)) return false;
    seen.add(k);pts.push([lng,lat,Math.max(0,z)]);return true;     // clamp da referência
  };
  // Todos os anéis de todas as camadas, num conjunto só
  const aneis=[];
  for(const k of chaves){
    const g=finais[k];
    if(!g?.geometry) continue;
    const polys=g.geometry.type==='Polygon'?[g.geometry.coordinates]
      :g.geometry.type==='MultiPolygon'?g.geometry.coordinates:[];
    for(const pc of polys)
      for(const r of pc)
        if(r&&r.length>=4) aneis.push(r.map(p=>[Number(p[0]),Number(p[1])]));
  }
  // A0) Cruzamentos anel × curva de nível — cota exata, prioridade máxima
  if(curvasSeg&&curvasSeg.length){
    for(const anel of aneis){
      const bbA=bboxDe(anel);
      let rl;
      try{rl=turf.lineString(anel);}catch(_){continue;}
      for(const cv of curvasSeg){
        if(!bboxCruza(bbA,cv.bb)) continue;
        let inter;
        try{inter=turf.lineIntersect(rl,cv.line);}catch(_){continue;}
        for(const ip of inter.features||[]){
          const c=ip.geometry?.coordinates;
          if(c&&isFinite(c[0])&&isFinite(c[1])&&add(c[0],c[1],cv.cota)) nCruz++;
        }
      }
    }
  }
  // A) Anéis adensados
  for(const anel of aneis){
    let ant=null,zAnt=null;
    for(const c of densifyRing(anel,stepDeg).slice(0,-1)){
      const r=zFromTinEx(tinIdx,c[0],c[1],maxGap);
      if(r.z===null||!isFinite(r.z)){nFora++;ant=null;zAnt=null;continue;}
      if(r.modo==='exato') nExato++;
      else if(r.modo==='proporcao') nProp++;
      else if(r.modo==='plano-corrigido') nPlanoC++;
      else if(r.modo==='plano') nPlano++;
      else nViz++;
      if(adapt&&ant!==null){
        for(const m of subdividirAresta(ant,zAnt,c,r.z,zq,minDeg,tolZ,0)){
          if(add(m[0],m[1],m[2])) nAdapt++;
        }
      }
      add(c[0],c[1],r.z);
      ant=c;zAnt=r.z;
    }
  }
  // B) Pontos de curva dentro do limite — cota exata
  for(const cp of cPts){
    try{
      if(turf.booleanPointInPolygon(turf.point([cp.lng,cp.lat]),limite)) add(cp.lng,cp.lat,cp.z);
    }catch(_){}
  }
  const res={};
  for(const k of chaves) res[k]={type:'FeatureCollection',features:[]};
  if(pts.length<3) return{res,nCruz,nExato,nViz,nFora,nProp,nAdapt,nPlano,nPlanoC,npts:pts.length};

  const bbs={};
  for(const k of chaves){
    try{bbs[k]=finais[k]?.geometry?bboxGeom(finais[k].geometry):null;}catch(_){bbs[k]=null;}
  }
  const d=new Delaunator(pts.flatMap(p=>[p[0],p[1]]));
  for(let i=0;i<d.triangles.length;i+=3){
    const A=pts[d.triangles[i]],B=pts[d.triangles[i+1]],C=pts[d.triangles[i+2]];
    const area=(B[0]-A[0])*(C[1]-A[1])-(C[0]-A[0])*(B[1]-A[1]);
    if(Math.abs(area)<1e-14) continue;
    const cx=(A[0]+B[0]+C[0])/3,cy=(A[1]+B[1]+C[1])/3;
    let dest=null;
    for(const k of chaves){
      const bb=bbs[k];
      if(bb&&(cx<bb[0]||cx>bb[2]||cy<bb[1]||cy>bb[3])) continue;
      try{
        if(turf.booleanPointInPolygon(turf.point([cx,cy]),finais[k])){dest=k;break;}
      }catch(_){}
    }
    if(!dest) continue;
    res[dest].features.push({type:'Feature',
      properties:{avgH:(A[2]+B[2]+C[2])/3,ha:A[2],hb:B[2],hc:C[2]},
      geometry:{type:'Polygon',coordinates:[[
        [A[0],A[1],A[2]],[B[0],B[1],B[2]],[C[0],C[1],C[2]],[A[0],A[1],A[2]]]]}});
  }
  return{res,nCruz,nExato,nViz,nFora,nProp,nAdapt,nPlano,nPlanoC,npts:pts.length};
}


function hexToRGB(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');
  if(!m) return[0.6,0.6,0.6];
  const n=parseInt(m[1],16);
  const s=v=>{const c=v/255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
  return[s((n>>16)&255),s((n>>8)&255),s(n&255)];
}

function buildGLB(layers,origin){
  const[olng,olat]=origin;
  const mLng=M_PER_DEG_LAT*Math.cos(olat*DEG);
  const bufferViews=[],accessors=[],materials=[],primitives=[],bins=[];
  let byteOffset=0;
  const pushBin=(typed,target)=>{
    const bytes=new Uint8Array(typed.buffer,typed.byteOffset,typed.byteLength);
    const pad=(4-(bytes.byteLength%4))%4;
    bufferViews.push({buffer:0,byteOffset,byteLength:bytes.byteLength,target});
    bins.push(bytes);
    if(pad) bins.push(new Uint8Array(pad));
    byteOffset+=bytes.byteLength+pad;
    return bufferViews.length-1;
  };
  for(const L of layers){
    const pos=[],idx=[];
    let vi=0;
    for(const f of L.features||[]){
      const r=f?.geometry?.coordinates?.[0];
      if(!r||r.length<3) continue;
      for(let i=0;i<3;i++){
        const c=r[i];
        pos.push((c[0]-olng)*mLng,(c[2]||0),-(c[1]-olat)*M_PER_DEG_LAT);
      }
      idx.push(vi,vi+1,vi+2);vi+=3;
    }
    if(!pos.length) continue;
    const pa=new Float32Array(pos),ia=new Uint32Array(idx);
    let mn=[Infinity,Infinity,Infinity],mx=[-Infinity,-Infinity,-Infinity];
    for(let i=0;i<pa.length;i+=3)for(let k=0;k<3;k++){
      const v=pa[i+k];
      if(v<mn[k])mn[k]=v;
      if(v>mx[k])mx[k]=v;
    }
    const bvP=pushBin(pa,34962),bvI=pushBin(ia,34963);
    accessors.push({bufferView:bvP,componentType:5126,count:pa.length/3,type:'VEC3',min:mn,max:mx});
    const accP=accessors.length-1;
    accessors.push({bufferView:bvI,componentType:5125,count:ia.length,type:'SCALAR'});
    const accI=accessors.length-1;
    const rgb=hexToRGB(L.cor);
    materials.push({name:L.name,doubleSided:true,
      pbrMetallicRoughness:{baseColorFactor:[rgb[0],rgb[1],rgb[2],1],metallicFactor:0,roughnessFactor:0.92}});
    primitives.push({attributes:{POSITION:accP},indices:accI,material:materials.length-1,mode:4});
  }
  if(!primitives.length) throw new Error('Nenhum triângulo para exportar');
  const json={
    asset:{version:'2.0',generator:'KV Terreno Guiado '+VERSION},
    scene:0,scenes:[{nodes:[0]}],
    nodes:[{mesh:0,name:'KV_Terreno'}],
    meshes:[{name:'TIN_Uso_do_Solo',primitives}],
    materials,accessors,bufferViews,
    buffers:[{byteLength:byteOffset}],
  };
  const enc=new TextEncoder().encode(JSON.stringify(json));
  const jPad=(4-(enc.byteLength%4))%4;
  const jLen=enc.byteLength+jPad;
  const total=12+8+jLen+8+byteOffset;
  const out=new Uint8Array(total);
  const dv=new DataView(out.buffer);
  let o=0;
  dv.setUint32(o,0x46546C67,true);o+=4;   // 'glTF'
  dv.setUint32(o,2,true);o+=4;
  dv.setUint32(o,total,true);o+=4;
  dv.setUint32(o,jLen,true);o+=4;
  dv.setUint32(o,0x4E4F534A,true);o+=4;   // 'JSON'
  out.set(enc,o);o+=enc.byteLength;
  for(let i=0;i<jPad;i++) out[o++]=0x20;
  dv.setUint32(o,byteOffset,true);o+=4;
  dv.setUint32(o,0x004E4942,true);o+=4;   // 'BIN'
  for(const b of bins){out.set(b,o);o+=b.byteLength;}
  return out;
}

function saveBlob(data,name,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
}

// ══════════════════════════════════════════════════════════════
//  App
// ══════════════════════════════════════════════════════════════
function AppLevantamento(){
  const[tab,setTab]=useState(0);
  const[logs,setLogs]=useState([]);
  const[busy,setBusy]=useState('');
  const[pct,setPct]=useState(0);
  const logEl=useRef(null);
  const lg=useCallback((t,m)=>{
    const ts=new Date().toLocaleTimeString('pt-BR',{hour12:false});
    setLogs(p=>[...p,{t,m:String(m),ts}].slice(-400));
  },[]);
  useEffect(()=>{if(logEl.current) logEl.current.scrollTop=logEl.current.scrollHeight;},[logs]);

  // ── Etapa 1: linha de corte ──────────────────────────────────
  // Em Giraffe a ferramenta "polilinha" fecha um polígono; a geometria
  // correta para a guia é a LINHA (LineString). O caminho principal é o
  // usuário desenhar a linha com a ferramenta nativa e selecioná-la aqui.
  const[cap,setCap]=useState(false);
  const capRef=useRef(false);
  useEffect(()=>{capRef.current=cap;},[cap]);
  const[capEv,setCapEv]=useState(0);           // eventos mapSelectCoord recebidos
  const[guia,setGuia]=useState([]);            // [[lng,lat],...]
  const[guiaSrc,setGuiaSrc]=useState('');      // origem da guia (diagnóstico)
  const[avancado,setAvancado]=useState(false);
  const[hits,setHits]=useState([]);            // curvas interceptadas ordenadas
  const[datum,setDatum]=useState(0);
  const[passo,setPasso]=useState(1);
  const[inverter,setInverter]=useState(false);
  const[tolProp,setTolProp]=useState(1.0);     // tolerância de continuidade (m)
  const[suspeitas,setSuspeitas]=useState([]);  // curvas com cota incoerente
  const[excluirSuspeitas,setExcluirSuspeitas]=useState(true);
  const[aplicado,setAplicado]=useState(false);
  const lastSelRef=useRef([]);
  const linhasRef=useRef([]);                  // todas as linhas do desenho
  const cruzRef=useRef(null);                  // sequência de cruzamentos da guia
  const[camadas,setCamadas]=useState([]);      // [{id,n,on}] camadas com linhas
  const camadasRef=useRef([]);
  useEffect(()=>{camadasRef.current=camadas;},[camadas]);

  // Sonda as fontes possíveis de visibilidade e monta a lista de camadas.
  const doLerCamadas=async(silencioso)=>{
    let rs=[];
    try{rs=normSections(giraffeState.get('rawSections'));}catch(_){}
    if(!rs.length){try{rs=normSections(await rpc.invoke('getRawSections',[]));}catch(_){}}
    const linhas=rs.filter(f=>['LineString','MultiLineString'].includes(f?.geometry?.type));
    const cont=new Map();
    for(const f of linhas){
      const c=camadaDe(f);
      cont.set(c,(cont.get(c)||0)+1);
    }
    // Sondagem: chaves de estado e RPCs que podem trazer visibilidade
    const vis=new Map();
    const fontes=[];
    for(const k of['projectLayers','layers','layerTree','projectLayerGroups','layerGroups','views']){
      try{
        const v=giraffeState.get(k);
        if(v){fontes.push('state:'+k);extrairVisibilidade(v,vis,new WeakSet(),0);}
      }catch(_){}
    }
    for(const fn of['getProjectLayers','getLayers','getLayerTree']){
      try{
        const v=await rpc.invoke(fn,[]);
        if(v){fontes.push('rpc:'+fn);extrairVisibilidade(v,vis,new WeakSet(),0);}
      }catch(_){}
    }
    const anterior=new Map(camadasRef.current.map(c=>[c.id,c.on]));
    const lista=[...cont.entries()].sort((a,b)=>b[1]-a[1]).map(([id,n])=>{
      let on;
      if(anterior.has(id)) on=anterior.get(id);          // respeita escolha do usuário
      else if(vis.has(id)) on=vis.get(id);               // visibilidade detectada
      else on=true;
      return{id,n,on,detectado:vis.has(id)};
    });
    setCamadas(lista);
    if(!silencioso){
      lg('ok',lista.length+' camada(s) com linhas: '
        +lista.map(c=>c.id+' ('+c.n+')').join(' · '));
      if(fontes.length) lg('info','Fontes de visibilidade consultadas: '+fontes.join(', ')
        +' · '+vis.size+' entradas com estado booleano.');
      const det=lista.filter(c=>c.detectado);
      if(det.length) lg('ok',det.length+' camada(s) com visibilidade detectada automaticamente: '
        +det.map(c=>c.id+'='+(c.on?'visível':'oculta')).join(' · '));
      else lg('warn','O SDK não expôs visibilidade de camadas nesta instalação. '
        +'Desmarque manualmente as camadas ocultas na lista abaixo.');
    }
    return lista;
  };

  // Extrai uma sequência de coordenadas de uma lista de feições.
  // Aceita LineString, MultiLineString e — com aviso — o anel externo de
  // um Polygon (caso o usuário tenha usado a ferramenta polilinha fechada).
  const coordsDeFeicoes=(list)=>{
    const fs=(list||[]).filter(f=>f&&f.geometry);
    const ln=fs.find(f=>['LineString','MultiLineString'].includes(f.geometry.type));
    if(ln){
      const parts=linhasOf(ln.geometry);
      const cs=parts.flat().map(c=>[Number(c[0]),Number(c[1])]);
      return{coords:cs,tipo:ln.geometry.type,fechado:false};
    }
    const pg=fs.find(isPoly);
    if(pg){
      const ring=pg.geometry.type==='Polygon'
        ?pg.geometry.coordinates[0]
        :pg.geometry.coordinates[0][0];
      return{coords:(ring||[]).map(c=>[Number(c[0]),Number(c[1])]),
        tipo:pg.geometry.type,fechado:true};
    }
    return null;
  };

  const aceitarGuia=(r,origem)=>{
    if(!r||!r.coords||r.coords.length<2) throw new Error('Geometria sem vértices suficientes');
    const cs=r.coords.filter(c=>isFinite(c[0])&&isFinite(c[1]));
    if(cs.length<2) throw new Error('Coordenadas inválidas');
    if(r.fechado) lg('warn','Selecionado um POLÍGONO — usando o anel externo como linha. Prefira a ferramenta Linha do Giraffe.');
    setGuia(cs);setGuiaSrc(origem);setHits([]);setAplicado(false);setCap(false);
    let comp=0;
    try{comp=turf.length(turf.lineString(cs),{units:'meters'});}catch(_){}
    lg('ok','Linha de corte definida ('+origem+'): '+cs.length+' vértices · '+comp.toFixed(1)+' m');
  };

  // A) Escolher a linha clicando nela no mapa — caminho principal
  const pickLinha=async()=>{
    setBusy('pick-linha');
    lg('info','Clique sobre a linha de corte no mapa...');
    try{
      const ss=await rpc.invoke('pickRawSections',[]);
      if(!ss?.length) throw new Error('Nada selecionado');
      const r=coordsDeFeicoes(ss);
      if(!r) throw new Error('O elemento escolhido não é uma linha nem um polígono');
      aceitarGuia(r,'pickRawSections');
    }catch(e){lg('err','Seleção da linha: '+e.message);}
    finally{setBusy('');}
  };

  // B) Usar o que já está selecionado no Giraffe
  const usarSelecao=async()=>{
    setBusy('sel-linha');
    try{
      let ss=[];
      try{ss=await rpc.invoke('getSelectedFeatures',[]);}catch(_){}
      if(!ss?.length){
        try{ss=normSections(giraffeState.get('selectedFeatures'));}catch(_){}
      }
      if(!ss?.length) ss=lastSelRef.current||[];
      if(!ss?.length) throw new Error('Nenhuma feição selecionada no Giraffe');
      const r=coordsDeFeicoes(ss);
      if(!r) throw new Error('A seleção atual não contém linha nem polígono');
      aceitarGuia(r,'seleção atual');
    }catch(e){lg('err','Seleção atual: '+e.message);}
    finally{setBusy('');}
  };

  // Sonda a seleção enquanto a aba Guia está aberta (selectedFeatures
  // costuma vir vazio no instante do clique — guardamos o último válido).
  useEffect(()=>{
    if(tab!==0) return;
    let vivo=true;
    const id=setInterval(async()=>{
      if(!vivo) return;
      let ss=null;
      try{ss=await rpc.invoke('getSelectedFeatures',[]);}catch(_){}
      if(!ss?.length){try{ss=normSections(giraffeState.get('selectedFeatures'));}catch(_){}}
      if(ss?.length) lastSelRef.current=ss;
    },400);
    return()=>{vivo=false;clearInterval(id);};
  },[tab]);

  // C) Ativar a ferramenta Linha nativa do Giraffe
  const ativarFerramentaLinha=async()=>{
    setBusy('tool');
    try{
      await rpc.invoke('setDrawTool',['line']);
      lg('ok','setDrawTool("line") enviado. Se a barra do Giraffe não mudar, ative a ferramenta Linha manualmente.');
    }catch(e){
      lg('warn','setDrawTool indisponível ('+e.message+'). Use a ferramenta Linha na barra do Giraffe.');
    }finally{setBusy('');}
  };

  // D) Listener de clique no mapa — modo avançado, pode não disparar
  //    dependendo da versão/host do Giraffe. O contador serve de diagnóstico.
  useEffect(()=>{
    const handler=()=>{
      if(!capRef.current) return;
      let c=null;
      try{c=giraffeState.get('mapSelectCoord');}catch(_){return;}
      if(!Array.isArray(c)||c.length<2) return;
      const p=[Number(c[0]),Number(c[1])];
      if(!isFinite(p[0])||!isFinite(p[1])) return;
      setCapEv(n=>n+1);
      setGuia(prev=>{
        const last=prev[prev.length-1];
        if(last&&Math.abs(last[0]-p[0])<1e-10&&Math.abs(last[1]-p[1])<1e-10) return prev;
        return[...prev,p];
      });
      setGuiaSrc('cliques no mapa');
    };
    try{giraffeState.addListener(['mapSelectCoord'],handler);}
    catch(e){lg('warn','mapSelectCoord indisponível: '+e.message);}
    return()=>{try{giraffeState.removeListener&&giraffeState.removeListener(['mapSelectCoord'],handler);}catch(_){}};
  },[lg]);

  // Preview da guia no mapa
  useEffect(()=>{
    (async()=>{
      try{await rpc.invoke('removeTempLayer',[GUIDE_ID]);}catch(_){}
      try{await rpc.invoke('removeTempLayer',[GUIDE_PTS_ID]);}catch(_){}
      if(guia.length<1) return;
      const ptsFC={type:'FeatureCollection',features:guia.map((c,i)=>({
        type:'Feature',properties:{n:i+1},geometry:{type:'Point',coordinates:c}}))};
      try{
        await rpc.invoke('addTempLayerGeoJSON',[GUIDE_PTS_ID,ptsFC,
          {type:'circle',paint:{'circle-radius':5,'circle-color':'#00ACCD',
            'circle-stroke-width':1.5,'circle-stroke-color':'#ffffff'}}]);
      }catch(_){}
      if(guia.length<2) return;
      const fc={type:'FeatureCollection',features:[
        {type:'Feature',properties:{},geometry:{type:'LineString',coordinates:guia}}]};
      try{
        await rpc.invoke('addTempLayerGeoJSON',[GUIDE_ID,fc,
          {type:'line',paint:{'line-color':'#00ACCD','line-width':2.5,'line-dasharray':[2,1.5]}}]);
      }catch(_){}
    })();
  },[guia]);

  const addPontoDraw=async()=>{
    try{
      const r=await rpc.invoke('drawPoint',[]);
      let c=null;
      if(Array.isArray(r)&&r.length>=2) c=[Number(r[0]),Number(r[1])];
      else if(r?.geometry?.coordinates) c=[Number(r.geometry.coordinates[0]),Number(r.geometry.coordinates[1])];
      else if(r&&isFinite(r.lng)&&isFinite(r.lat)) c=[Number(r.lng),Number(r.lat)];
      if(!c||!isFinite(c[0])||!isFinite(c[1])) throw new Error('Retorno inválido de drawPoint');
      setGuia(p=>[...p,c]);setGuiaSrc('drawPoint');
      lg('ok','Ponto '+(guia.length+1)+': '+c[0].toFixed(6)+', '+c[1].toFixed(6));
    }catch(e){lg('err','drawPoint: '+e.message);}
  };

  // Detecção de curvas interceptadas
  const doDetectar=async()=>{
    if(guia.length<2){lg('err','A linha de corte precisa de ao menos 2 vértices.');return;}
    setBusy('detect');setPct(0);
    try{
      let rs=[];
      try{rs=normSections(giraffeState.get('rawSections'));}catch(_){}
      if(!rs.length){
        try{rs=normSections(await rpc.invoke('getRawSections',[]));}catch(_){}
      }
      lg('info',rs.length+' feições lidas do desenho.');
      const todasLinhas=rs.filter(f=>['LineString','MultiLineString'].includes(f?.geometry?.type));
      if(!todasLinhas.length) throw new Error('Nenhuma linha no desenho do Giraffe.');
      // Camadas desligadas (ocultas no Giraffe) ficam de fora.
      let camList=camadasRef.current;
      if(!camList.length) camList=await doLerCamadas(true);
      const off=new Set(camList.filter(c=>!c.on).map(c=>c.id));
      const visiveis=off.size?todasLinhas.filter(f=>!off.has(camadaDe(f))):todasLinhas;
      const nOcultas=todasLinhas.length-visiveis.length;
      // Bordas já usadas como Terreno/Calçada/Rua não são curvas de nível.
      const pid=perimIdsRef.current;
      const linhas=visiveis.filter(f=>{
        const i=fid(f);
        return !(i!==null&&i!==undefined&&pid.has(String(i)));
      });
      const excl=visiveis.length-linhas.length;
      linhasRef.current=linhas;
      lg('info',todasLinhas.length+' linhas no desenho'
        +(nOcultas?(' · '+nOcultas+' em camada(s) desligada(s): '+[...off].join(', ')):'')
        +(excl?(' · '+excl+' excluída(s) por já serem contorno de uso do solo'):'')
        +' · '+linhas.length+' candidatas a curva de nível.');
      if(!linhas.length) throw new Error('Nenhuma linha restou após filtrar camadas ocultas e contornos de uso do solo.');
      const guiaLine=turf.lineString(guia);
      const p0=turf.point(guia[0]);
      // Todos os cruzamentos, não só o primeiro de cada curva: entrar e sair
      // de uma curva fechada são dois eventos distintos e ambos importam.
      const cruz=[];
      const porChave=new Map();
      for(let i=0;i<linhas.length;i++){
        const f=linhas[i];
        const key='k'+i;
        let n=0;
        for(const part of linhasOf(f.geometry)){
          if(!part||part.length<2) continue;
          let cl;
          try{cl=turf.lineString(part.map(c=>[c[0],c[1]]));}catch(_){continue;}
          let inter;
          try{inter=turf.lineIntersect(guiaLine,cl);}catch(_){continue;}
          for(const ip of inter.features||[]){
            let d;
            try{d=turf.length(turf.lineSlice(p0,ip,guiaLine),{units:'meters'});}
            catch(_){d=turf.distance(p0,ip,{units:'meters'});}
            if(!isFinite(d)) continue;
            cruz.push({key,dist:d});
            n++;
          }
        }
        if(n>0) porChave.set(key,{id:fid(f),feat:f,nInter:n});
        setPct(Math.round((i+1)/linhas.length*100));
      }
      if(!cruz.length) throw new Error('A linha de corte não interceptou nenhuma curva.');
      cruz.sort((a,b)=>a.dist-b.dist);
      const seq=inverter?[...cruz].reverse():cruz;
      const fechadas=new Map();
      for(const[k,info]of porChave) fechadas.set(k,curvaFechada(info.feat,1));
      const nFech=[...fechadas.values()].filter(Boolean).length;
      cruzRef.current={seq,porChave,fechadas};
      const at=cotasPorAninhamento(seq,datum,passo,fechadas);
      lg('info',nFech+' curva(s) fechada(s) e '+(fechadas.size-nFech)+' aberta(s).'
        +(at.reencFech?(' '+at.reencFech+' saída(s) de curva fechada.'):'')
        +(at.reencOpen?(' '+at.reencOpen+' recruzamento(s) de curva aberta ignorado(s) — '
          +'numa encosta a reta volta a cruzar a mesma curva sem ter descido.'):''));
      const primeiraDist=new Map();
      for(const c of seq) if(!primeiraDist.has(c.key)) primeiraDist.set(c.key,c.dist);
      const lista=at.ordem.map((k,i)=>{
        const info=porChave.get(k)||{};
        return{id:info.id,feat:info.feat,nInter:info.nInter||0,
          dist:primeiraDist.get(k)??0,ord:i+1,cota:at.cotas.get(k),chave:k};
      });
      const repetidas=lista.filter(x=>x.nInter>1).length;
      lg('info',cruz.length+' cruzamento(s) em '+lista.length+' curva(s)'
        +(repetidas?(' · '+repetidas+' curva(s) atravessada(s) mais de uma vez'):'')
        +' · profundidade máxima '+at.profMax+'.');
      if(repetidas) lg('ok','Curvas fechadas detectadas (morros): a linha entra e sai de cada uma. '
        +'As cotas seguem o aninhamento, então a descida não é somada como se fosse subida.');
      // Propaga as cotas para os trechos de curva que a guia não atravessou.
      // Sem isso o TIN nasce cheio de buracos e a interpolação vira ruído.
      const pr=propagarCotas(lista,linhas,tolProp);
      const total=[...lista,...pr.novos];
      setHits(total);setAplicado(false);
      const semId=total.filter(x=>!x.id).length;
      lg('ok',lista.length+' curvas interceptadas · cotas '+lista[0].cota+' → '+lista[lista.length-1].cota+' m');
      if(pr.novos.length) lg('ok','+'+pr.novos.length+' trechos herdaram cota por continuidade (tolerância '+tolProp+' m, '+pr.iter+' passadas).');
      if(pr.restantes) lg('warn',pr.restantes+' linha(s) do desenho continuam SEM cota e ficarão de fora do TIN. Aumente a tolerância ou estenda a linha de corte.');
      if(semId) lg('warn',semId+' curva(s) sem id — não poderão ser atualizadas no Giraffe.');
      const sus=validarCotas(total,passo,2.5);
      setSuspeitas(sus);
      if(sus.length){
        lg('err','⚠ '+sus.length+' curva(s) com cota INCOERENTE com o desenho:');
        for(const x of sus.slice(0,8))
          lg('err','   '+(x.id?String(x.id).slice(0,8):'sem id')+' · cota '+x.cota
            +' m → vizinhas ~'+(x.sugerida===null?'?':x.sugerida)+' m · '
            +x.mediana.toFixed(1)+' degraus.');
        if(sus.length>8) lg('err','   … e mais '+(sus.length-8)+'.');
        lg('warn','Onde essas curvas cruzam a rua ou a calçada elas injetam a cota errada '
          +'e abrem uma vala. Corrija a cota na tabela ou deixe a exclusão ligada.');
      }else lg('ok','Cotas coerentes: cada curva tem a vizinha a ~1 degrau.');
      const tiposMulti=total.filter(x=>x.feat?.geometry?.type==='MultiLineString').length;
      if(tiposMulti) lg('info',tiposMulti+' curva(s) são MultiLineString. Contam para o TIN e '
        +'também serão enviadas ao Giraffe, em chamadas separadas para isolar o resultado.');
    }catch(e){lg('err','Detecção: '+e.message);}
    finally{setBusy('');setPct(0);}
  };

  // Recalcula cotas quando datum/passo/inverter mudam
  const recotar=(d,p,inv)=>{
    const cr=cruzRef.current;
    if(!cr||!cr.seq?.length) return;
    // Recalcula a partir da SEQUÊNCIA DE CRUZAMENTOS original, não da lista de
    // curvas: inverter o sentido tem de reprocessar o aninhamento inteiro.
    const base=inv?[...cr.seq].reverse():cr.seq;
    const at=cotasPorAninhamento(base,d,p,cr.fechadas);
    const primeiraDist=new Map();
    for(const c of base) if(!primeiraDist.has(c.key)) primeiraDist.set(c.key,c.dist);
    const lista=at.ordem.map((k,i)=>{
      const info=cr.porChave.get(k)||{};
      return{id:info.id,feat:info.feat,nInter:info.nInter||0,
        dist:primeiraDist.get(k)??0,ord:i+1,cota:at.cotas.get(k),chave:k};
    });
    const pr=propagarCotas(lista,linhasRef.current||[],tolProp);
    setHits([...lista,...pr.novos]);
    setAplicado(false);
  };

  const setCota=(ord,v)=>{
    setHits(prev=>{
      const base=prev.filter(x=>!x.herdada)
        .map(x=>x.ord===ord?{...x,cota:v===''?0:Number(v)}:x);
      const pr=propagarCotas(base,linhasRef.current||[],tolProp);
      return[...base,...pr.novos];
    });
    setAplicado(false);
  };

  // Relatório não-destrutivo: lista as curvas incoerentes com o id, a cota
  // gravada e a cota das vizinhas, para conferir no desenho antes de mexer.
  const doConferirCotas=()=>{
    if(!hits.length){lg('err','Não há curvas cotadas para conferir.');return;}
    const sus=validarCotas(hits,passo,2.5);
    setSuspeitas(sus);
    if(!sus.length){
      lg('ok','Conferência: as '+hits.length+' curvas estão coerentes entre si. '
        +'Se ainda há buracos, a causa não é a cota das curvas.');
      return;
    }
    lg('err','Conferência: '+sus.length+' de '+hits.length+' curva(s) incoerentes.');
    lg('info','id · cota gravada → cota das vizinhas · distância em degraus');
    for(const x of sus)
      lg('warn','  '+(x.id?String(x.id).slice(0,8):'sem id')
        +' · '+x.cota+' m → vizinhas ~'+(x.sugerida===null?'?':x.sugerida)+' m'
        +' · '+x.mediana.toFixed(1)+' degraus');
    lg('info','Procure esses ids no Giraffe. Se a curva estiver CERTA no desenho, '
      +'é a minha verificação que erra — me avise. Se estiver errada, use o botão de correção.');
  };

  // Corrige as suspeitas usando a cota das curvas vizinhas.
  const doCorrigirSuspeitas=()=>{
    if(!suspeitas.length) return;
    const mapa=new Map(suspeitas.filter(x=>x.sugerida!==null).map(x=>[x.i,x.sugerida]));
    if(!mapa.size){lg('err','Nenhuma sugestão disponível.');return;}
    setHits(prev=>prev.map((x,i)=>mapa.has(i)?{...x,cota:mapa.get(i)}:x));
    setSuspeitas([]);setAplicado(false);
    lg('ok',mapa.size+' cota(s) ajustada(s) pela vizinhança. Confira na tabela e '
      +'clique em Aplicar elevação para gravar no desenho.');
  };

  // Repropaga manualmente com a tolerância atual
  const doPropagar=()=>{
    const base=hits.filter(x=>!x.herdada);
    if(!base.length){lg('err','Detecte as curvas interceptadas primeiro.');return;}
    const pr=propagarCotas(base,linhasRef.current||[],tolProp);
    setHits([...base,...pr.novos]);setAplicado(false);
    lg(pr.novos.length?'ok':'warn',pr.novos.length+' trecho(s) herdaram cota (tolerância '
      +tolProp+' m) · '+pr.restantes+' ainda sem cota.');
  };

  // Aplica elevação via updateRawSections
  // updateRawSections aceita apenas Point, LineString e Polygon. Uma única
  // curva MultiLineString no lote derruba as 15 atualizações de uma vez com
  // "geometry type must be Point, LineString or Polygon". Por isso o envio é
  // filtrado por tipo e degrada em etapas: lote → lote com geometria → uma a
  // uma, para isolar e nomear a feição problemática em vez de perder tudo.
  const TIPOS_ACEITOS=['Point','LineString','Polygon'];
  const payloadCota=(x,comGeom)=>{
    const p={properties:{
      id:x.id,
      baseHeight:x.cota,
      _baseHeight:x.cota,
      // Curvas vindas de DXF (AcDb3dPolyline) carregam também baseElevation;
      // sem ele algumas feições ignoravam a nova cota.
      baseElevation:x.cota,
      _baseElevation:x.cota,
      height:0,
      kv_cota:x.cota,
      kv_ordem:x.ord,
    }};
    if(comGeom&&x.feat?.geometry){p.type='Feature';p.geometry=x.feat.geometry;}
    return p;
  };

  const doAplicar=async()=>{
    const comId=hits.filter(x=>x.id);
    if(!comId.length){lg('err','Nenhuma curva com id para atualizar.');return;}
    // Tipos fora da lista branca do Giraffe não são descartados: vão em
    // envio individual, para não poderem derrubar o lote e para que o
    // resultado real de cada um apareça no log em vez de ser presumido.
    const enviaveis=comId.filter(x=>TIPOS_ACEITOS.includes(x.feat?.geometry?.type));
    const suspeitas=comId.filter(x=>!TIPOS_ACEITOS.includes(x.feat?.geometry?.type));
    if(suspeitas.length){
      const tipos=[...new Set(suspeitas.map(x=>x.feat?.geometry?.type||'sem geometria'))];
      lg('info',suspeitas.length+' curva(s) do tipo '+tipos.join(' / ')
        +' — o Giraffe já recusou esse tipo antes, então vão uma a uma para não '
        +'derrubar o lote. O log dirá se passaram.');
    }
    if(!enviaveis.length&&!suspeitas.length){
      lg('err','Nenhuma curva para atualizar.');
      setAplicado(true);
      await previewCurvas(hits);
      return;
    }
    setBusy('aplicar');setPct(0);
    const tentar=async(itens,comGeom)=>{
      await rpc.invoke('updateRawSections',[itens.map(x=>payloadCota(x,comGeom))]);
    };
    try{
      lg('info','Enviando '+enviaveis.length+' atualizações via updateRawSections...');
      let ok=0;
      if(!enviaveis.length){/* nada em lote; só as suspeitas abaixo */}
      else try{
        await tentar(enviaveis,false);
        ok=enviaveis.length;
      }catch(e1){
        lg('warn','Lote recusado ('+e1.message+'). Repetindo com a geometria incluída...');
        try{
          await tentar(enviaveis,true);
          ok=enviaveis.length;
          lg('ok','Aceito com a geometria no payload.');
        }catch(e2){
          lg('warn','Também recusado ('+e2.message+'). Enviando uma a uma para isolar...');
          const falhas=[];
          for(let i=0;i<enviaveis.length;i++){
            const x=enviaveis[i];
            let feito=false,ultimo='';
            for(const comG of[false,true]){
              try{await tentar([x],comG);feito=true;break;}
              catch(e3){ultimo=e3.message;}
            }
            if(feito) ok++; else falhas.push({x,msg:ultimo});
            setPct(Math.round((i+1)/enviaveis.length*100));
          }
          for(const f of falhas.slice(0,5))
            lg('err','Falhou · id '+String(f.x.id).slice(0,8)+' · '
              +(f.x.feat?.geometry?.type||'?')+' · '+f.msg);
          if(falhas.length>5) lg('err','… e mais '+(falhas.length-5)+' falha(s).');
        }
      }
      // Suspeitas, uma a uma — com e sem geometria no payload.
      let okSusp=0;
      for(let i=0;i<suspeitas.length;i++){
        const x=suspeitas[i];
        let feito=false,ultimo='';
        for(const comG of[false,true]){
          try{await tentar([x],comG);feito=true;break;}
          catch(e4){ultimo=e4.message;}
        }
        if(feito){
          okSusp++;
          lg('ok','  '+(x.feat?.geometry?.type||'?')+' id '+String(x.id).slice(0,8)+' ACEITO.');
        }else{
          lg('warn','  '+(x.feat?.geometry?.type||'?')+' id '+String(x.id).slice(0,8)
            +' recusado: '+ultimo);
        }
      }
      if(suspeitas.length) lg(okSusp?'ok':'warn',okSusp+' de '+suspeitas.length
        +' curva(s) de tipo não-padrão foram aceitas pelo Giraffe.');
      const total=ok+okSusp;
      setPct(100);
      if(total){
        setAplicado(true);
        lg('ok','✓ '+total+' de '+comId.length+' curvas reposicionadas em 3D.');
      }else{
        lg('err','Nenhuma curva foi reposicionada.');
      }
      await previewCurvas(hits);
      if(total) await verificarCotas(comId);
    }catch(e){lg('err','updateRawSections: '+e.message);}
    finally{setBusy('');}
  };

  // Relê o desenho depois do envio e confere, curva por curva, se a cota
  // realmente entrou. "Aplicou sem erro" e "moveu" não são a mesma coisa:
  // o Giraffe aceita o update e pode ignorar o campo em certas feições.
  const verificarCotas=async(lista)=>{
    await new Promise(r=>setTimeout(r,700));
    let rs=[];
    try{rs=normSections(giraffeState.get('rawSections'));}catch(_){}
    if(!rs.length){try{rs=normSections(await rpc.invoke('getRawSections',[]));}catch(_){}}
    if(!rs.length){lg('warn','Não foi possível reler o desenho para conferir as cotas.');return;}
    const porId=new Map();
    for(const f of rs){
      const i=fid(f);
      if(i!==null&&i!==undefined) porId.set(String(i),f);
    }
    const divergentes=[];
    let conferidas=0;
    for(const x of lista){
      if(!x.id) continue;
      const f=porId.get(String(x.id));
      if(!f){divergentes.push({x,motivo:'não encontrada no desenho'});continue;}
      conferidas++;
      const p=f.properties||{};
      const cand=[p.baseHeight,p._baseHeight,p.baseElevation,p._baseElevation]
        .map(Number).filter(v=>isFinite(v));
      const bateu=cand.some(v=>Math.abs(v-x.cota)<=0.01);
      if(!bateu) divergentes.push({x,motivo:'cota no desenho: '
        +(cand.length?cand.join(' / '):'ausente')+' · esperada '+x.cota,feat:f});
    }
    if(!divergentes.length){
      lg('ok','Conferência: as '+conferidas+' curvas estão com a cota correta no desenho.');
      return;
    }
    lg('err','Conferência: '+divergentes.length+' curva(s) NÃO assumiram a cota enviada.');
    for(const d of divergentes.slice(0,6)){
      const p=d.feat?.properties||{};
      lg('err','  id '+String(d.x.id).slice(0,8)+' · '+(d.feat?.geometry?.type||'?')
        +' · camada "'+(p.layerId??'?')+'"'
        +(p.SubClasses?(' · '+p.SubClasses):'')
        +' · '+d.motivo);
    }
    if(divergentes.length>6) lg('err','  … e mais '+(divergentes.length-6)+'.');
    lg('warn','Se todas divergentes forem do mesmo tipo ou camada, é aí que está o bloqueio.');
  };

  // O Giraffe recusa MultiLineString tanto em updateRawSections quanto em
  // createRawSection ("geometry type must be Point, LineString or Polygon").
  // A única saída para posicioná-las em 3D é substituí-las por LineStrings
  // simples — uma por trecho — herdando as mesmas properties e a cota.
  // ALTERA O DESENHO, por isso é uma ação explícita do usuário.
  const doQuebrarMulti=async()=>{
    const multis=hits.filter(x=>x.id&&x.feat?.geometry?.type==='MultiLineString');
    if(!multis.length){lg('info','Nenhuma MultiLineString na lista.');return;}
    setBusy('quebrar');setPct(0);
    try{
      const substituicoes=new Map();   // id antigo → novos hits
      let criadas=0,apagadas=0,falhas=0;
      for(let i=0;i<multis.length;i++){
        const x=multis[i];
        const brutas=(x.feat.geometry.coordinates||[]).filter(pt=>pt&&pt.length>=2);
        if(!brutas.length){falhas++;continue;}
        // Recostura antes de separar: preserva o resultado de um "join".
        const partes=unirTrechosContiguos(brutas,0.10);
        if(partes.length<brutas.length)
          lg('info','  id '+String(x.id).slice(0,8)+': '+brutas.length+' trechos → '
            +partes.length+' linha(s) após recosturar os contíguos.');
        else if(brutas.length>1)
          lg('info','  id '+String(x.id).slice(0,8)+': '+brutas.length
            +' trechos realmente soltos, viram '+brutas.length+' linhas.');
        const base={...(x.feat.properties||{})};
        delete base.id;
        const cotaProps={
          baseHeight:x.cota,_baseHeight:x.cota,
          baseElevation:x.cota,_baseElevation:x.cota,
          height:0,kv_cota:x.cota,kv_ordem:x.ord,
        };
        const feats=partes.map(pt=>({
          type:'Feature',
          geometry:{type:'LineString',coordinates:pt.map(c=>[Number(c[0]),Number(c[1])])},
          properties:{...base,layerId:base.layerId||'default',
            stackOrder:base.stackOrder??0,...cotaProps},
        }));
        let novos=null;
        for(const fn of['createRawSections','importRawSections']){
          try{novos=await rpc.invoke(fn,[feats]);if(novos)break;}
          catch(e){lg('warn','  '+fn+' recusou: '+e.message);}
        }
        if(!Array.isArray(novos)||!novos.length){
          falhas++;
          lg('err','  id '+String(x.id).slice(0,8)+': não foi possível criar os trechos.');
          continue;
        }
        criadas+=novos.length;
        const ids=novos.map(f=>f?.properties?.id).filter(Boolean);
        if(ids.length){
          try{
            await rpc.invoke('updateRawSections',
              [ids.map(id=>({properties:{id,...cotaProps}}))]);
          }catch(e){lg('warn','  cota nos novos trechos: '+e.message);}
        }
        // Remove a original — tenta as duas assinaturas conhecidas.
        let removeu=false;
        for(const[fn,arg]of[['deleteRawSections',[[x.id]]],['deleteRawSection',[x.id]]]){
          try{await rpc.invoke(fn,arg);removeu=true;break;}catch(_){}
        }
        if(removeu) apagadas++;
        else lg('warn','  original '+String(x.id).slice(0,8)+' não pôde ser apagada — '
          +'ela ficou duplicada com os novos trechos, apague à mão.');
        substituicoes.set(String(x.id),novos.map((f,j)=>({
          id:f?.properties?.id??null,
          feat:{type:'Feature',geometry:f?.geometry||feats[j].geometry,
            properties:f?.properties||feats[j].properties},
          cota:x.cota,ord:x.ord,dist:x.dist,nInter:0,herdada:x.herdada||false,
        })));
        setPct(Math.round((i+1)/multis.length*100));
      }
      // Atualiza a lista em memória: o TIN e a conferência passam a apontar
      // para os trechos novos, não para a feição que deixou de existir.
      setHits(prev=>{
        const out=[];
        for(const hIt of prev){
          const rep=hIt.id?substituicoes.get(String(hIt.id)):null;
          if(rep) out.push(...rep); else out.push(hIt);
        }
        return out;
      });
      setAplicado(false);
      lg(criadas?'ok':'err','Quebra concluída: '+criadas+' trecho(s) criado(s) · '
        +apagadas+' original(is) removida(s)'+(falhas?(' · '+falhas+' falha(s)'):'')+'.');
      if(criadas) lg('info','Clique em "Aplicar elevação" novamente para posicioná-los em 3D.');
    }catch(e){lg('err','Quebrar MultiLineString: '+e.message);}
    finally{setBusy('');setPct(0);}
  };

  const previewCurvas=async(lista)=>{
    try{await rpc.invoke('removeTempLayer',[CURVAS_ID]);}catch(_){}
    const feats=[];
    for(const it of lista){
      for(const part of linhasOf(it.feat.geometry)){
        feats.push({type:'Feature',
          properties:{cota:it.cota,baseHeight:it.cota,_baseHeight:it.cota,height:0},
          geometry:{type:'LineString',coordinates:part.map(c=>[c[0],c[1],it.cota])}});
      }
    }
    if(!feats.length) return;
    const cotas=lista.map(x=>x.cota);
    const mn=Math.min(...cotas),mx=Math.max(...cotas)||1;
    try{
      await rpc.invoke('addTempLayerGeoJSON',[CURVAS_ID,{type:'FeatureCollection',features:feats},
        {type:'line',paint:{
          'line-color':['interpolate',['linear'],['get','cota'],mn,'#2FAF83',(mn+mx)/2,'#00ACCD',mx,'#F0A030'],
          'line-width':1.8,'line-opacity':0.95}}]);
    }catch(e){lg('warn','Preview de curvas: '+e.message);}
  };

  const limparGuia=async()=>{
    setGuia([]);setHits([]);setAplicado(false);setCap(false);setGuiaSrc('');setCapEv(0);cruzRef.current=null;setSuspeitas([]);
    try{await rpc.invoke('removeTempLayer',[GUIDE_ID]);}catch(_){}
    try{await rpc.invoke('removeTempLayer',[GUIDE_PTS_ID]);}catch(_){}
    lg('info','Linha de corte descartada.');
  };

  // ── Etapa 2: perímetros por uso do solo ──────────────────────
  const[perims,setPerims]=useState({terreno:[],area:[],calcada:[],rua:[]});
  const[exclusivo,setExclusivo]=useState(true);
  const[conforme,setConforme]=useState(false); // malha única × malhas separadas (referência)
  const[unirBordas,setUnirBordas]=useState(true); // duas bordas abertas → faixa
  const[prioridade,setPrioridade]=useState(SUB_USOS);
  const[separarLayers,setSepararLayers]=useState(true);
  const[layerNomes,setLayerNomes]=useState({
    area:'KV_Área Total',terreno:'KV_Terreno',calcada:'KV_Calçada',rua:'KV_Rua'});
  const[coresAplic,setCoresAplic]=useState({...CORES_APLICADAS});
  const perimIdsRef=useRef(new Set());         // ids usados como uso do solo
  const[modoCota,setModoCota]=useState('auto');// método de cota entre curvas
  const[margem,setMargem]=useState(25);        // buffer de suporte do TIN (m)
  const[dens,setDens]=useState(5);             // espaçamento de densificação (m)
  const[bordaM,setBordaM]=useState(2);         // passo base do contorno (m)
  const[adapt,setAdapt]=useState(true);        // refino adaptativo de borda
  const[corrigirPlanos,setCorrigirPlanos]=useState(false);
  const[tolBorda,setTolBorda]=useState(0.05);  // erro de cota tolerado (m)
  const[tins,setTins]=useState(null);
  const[vis,setVis]=useState({terreno:true,area:true,calcada:true,rua:true});
  const[stats,setStats]=useState(null);
  const tinGlobalRef=useRef(null);   // índice do TIN global — base do patch 3D

  const pickPerim=async(k)=>{
    setBusy('pick-'+k);
    const lb=(USOS.find(x=>x.k===k)||{}).lb;
    lg('info',lb+': clique nos elementos no mapa (linhas fechadas ou polígonos).');
    try{
      const ss=await rpc.invoke('pickRawSections',[]);
      if(!ss?.length) throw new Error('Nada selecionado');
      const novos=feicoesParaPoligonos(ss,unirBordas);
      if(novos.descartados) lg('err','⚠ '+novos.descartados+' contorno(s) com área nula foram '
        +'descartados — sinal de anel que cruza a si mesmo e se anula. '
        +'Selecione as bordas de cada trecho separadamente.');
      if(!novos.length){
        const tipos=[...new Set((ss||[]).map(f=>f?.geometry?.type||'?'))].join(', ');
        throw new Error('Nenhum contorno aproveitável na seleção (tipos: '+tipos+')');
      }
      // Guarda os ids: essas linhas são bordas de uso do solo, NÃO curvas de nível.
      for(const i of(novos.idsUsados||[])) perimIdsRef.current.add(i);
      const conflito=hits.filter(x=>x.id&&(novos.idsUsados||[]).includes(String(x.id)));
      if(conflito.length) lg('err','⚠ '+conflito.length+' das linhas selecionadas estão cotadas como CURVA DE NÍVEL. '
        +'Volte à aba Guia e clique em Detectar de novo — elas serão excluídas.');
      const unidas=novos.filter(n=>n.unida);
      if(unidas.length) lg('ok',unidas[0].nLinhas+' bordas abertas unidas numa faixa única.');
      const cruzados=novos.filter(n=>(n.kinks||0)>0);
      if(cruzados.length){
        lg('err','⚠ '+cruzados.length+' contorno(s) com AUTOINTERSEÇÃO ('
          +cruzados.map(n=>n.kinks).join(', ')+' nós). O anel cruza a si mesmo, '
          +'o teste dentro/fora alterna em faixas e a triangulação sai em cunhas.');
        lg('warn','  Selecione as bordas de cada trecho da via separadamente, '
          +'um "+ Adicionar" por trecho.');
      }
      const abertas=novos.filter(n=>!n.unida&&n.gap>0.5);
      if(abertas.length){
        lg('warn',abertas.length+' linha(s) aberta(s) fechada(s) sobre si mesma(s) (vão de '
          +Math.min(...abertas.map(a=>a.gap)).toFixed(1)+' a '+Math.max(...abertas.map(a=>a.gap)).toFixed(1)+' m).');
        lg('warn','Vão grande indica bordas de uma faixa, não contornos fechados. '
          +'Marque "Unir bordas abertas numa faixa única" e selecione as duas bordas juntas.');
      }
      const slivers=novos.filter(n=>n.sliver<0.03);
      if(slivers.length) lg('err','⚠ '+slivers.length+' contorno(s) degenerado(s) — área quase nula para o tamanho '
        +'que ocupam. Provavelmente uma linha fechada sobre si mesma em vez de um contorno real.');
      const feats=novos.map(n=>({type:'Feature',properties:{},geometry:n.geom}));
      setPerims(p=>{
        const atual=p[k]||[];
        const todos=[...atual,...feats];
        let a=0;
        try{a=turf.area(unionOf(todos));}catch(_){}
        lg('ok',lb+': +'+feats.length+' → '+todos.length+' contorno(s) · '
          +a.toLocaleString('pt-BR',{maximumFractionDigits:0})+' m²');
        return{...p,[k]:todos};
      });
    }catch(e){lg('err','Seleção '+lb+': '+e.message);}
    finally{setBusy('');}
  };
  const clearPerim=k=>{
    setPerims(p=>({...p,[k]:[]}));
    perimIdsRef.current=new Set();
    lg('info','Lista de ids de uso do solo reiniciada — redetecte as curvas se necessário.');
    lg('info',(USOS.find(x=>x.k===k)||{}).lb+': seleção limpa.');
  };

  // Zera as cotas que o próprio app gravou no desenho.
  //
  // "Ler cotas existentes do desenho" lê kv_cota / baseHeight — valores que
  // vieram de uma execução ANTERIOR deste app. Se aquela execução errou uma
  // cota, ler de volta reproduz o mesmo erro, idêntico, quantas vezes se
  // repetir. É um laço fechado: corrigir o algoritmo não muda nada enquanto o
  // valor velho continuar gravado nas curvas.
  const doLimparCotasDesenho=async()=>{
    setBusy('limpacotas');
    try{
      let rs=[];
      try{rs=normSections(giraffeState.get('rawSections'));}catch(_){}
      if(!rs.length){try{rs=normSections(await rpc.invoke('getRawSections',[]));}catch(_){}}
      const off=new Set(camadasRef.current.filter(c=>!c.on).map(c=>c.id));
      const alvo=rs.filter(f=>{
        if(!['LineString','MultiLineString'].includes(f?.geometry?.type)) return false;
        if(off.has(camadaDe(f))) return false;
        if(!fid(f)) return false;
        const p=f.properties||{};
        return p.kv_cota!==undefined||Number(p.baseHeight)||Number(p._baseHeight)
          ||Number(p.baseElevation)||Number(p._baseElevation);
      });
      if(!alvo.length){lg('info','Nenhuma curva com cota gravada.');return;}
      lg('info','Zerando a cota de '+alvo.length+' curva(s)...');
      const updates=alvo
        .filter(f=>['Point','LineString','Polygon'].includes(f.geometry.type))
        .map(f=>({properties:{id:fid(f),baseHeight:0,_baseHeight:0,
          baseElevation:0,_baseElevation:0,height:0,kv_cota:null,kv_ordem:null}}));
      await rpc.invoke('updateRawSections',[updates]);
      setHits([]);setSuspeitas([]);setAplicado(false);
      lg('ok','✓ '+updates.length+' curva(s) zeradas. Agora use a LINHA DE CORTE '
        +'para recalcular as cotas do zero.');
    }catch(e){lg('err','Limpar cotas: '+e.message);}
    finally{setBusy('');}
  };

  // Lê cotas já gravadas no desenho (kv_cota / baseHeight)
  const doLerCotas=async()=>{
    setBusy('ler');
    try{
      let rs=[];
      try{rs=normSections(giraffeState.get('rawSections'));}catch(_){}
      if(!rs.length){try{rs=normSections(await rpc.invoke('getRawSections',[]));}catch(_){}}
      const lista=[];
      const offLer=new Set(camadasRef.current.filter(c=>!c.on).map(c=>c.id));
      const pidLer=perimIdsRef.current;
      let zeroPorPadrao=0,eramPerimetro=0;
      for(const f of rs){
        if(!['LineString','MultiLineString'].includes(f?.geometry?.type)) continue;
        if(offLer.has(camadaDe(f))) continue;
        const idf=fid(f);
        // Bordas de rua, calçada e terreno não são curvas de nível.
        if(idf!==null&&idf!==undefined&&pidLer.has(String(idf))){eramPerimetro++;continue;}
        const p=f.properties||{};
        let c=null;
        if(p.kv_cota!==undefined&&p.kv_cota!==null&&isFinite(Number(p.kv_cota))){
          c=Number(p.kv_cota);                       // gravado por este app: vale, mesmo 0
        }else{
          const alt=Number(p.baseHeight??p._baseHeight);
          // baseHeight 0 é o valor PADRÃO de toda linha nunca elevada — bordas de
          // rua, contornos de lote, qualquer desenho. Lê-lo como "curva de cota 0"
          // espalha pontos a zero por cima do terreno alto. Só vale se for != 0.
          if(isFinite(alt)&&alt!==0) c=alt;
          else if(isFinite(alt)&&alt===0){zeroPorPadrao++;continue;}
          else continue;
        }
        lista.push({id:idf,dist:0,nInter:0,feat:f,ord:lista.length+1,cota:c});
      }
      if(eramPerimetro) lg('info',eramPerimetro+' linha(s) ignorada(s) por já serem contorno de uso do solo.');
      if(zeroPorPadrao) lg('warn',zeroPorPadrao+' linha(s) com baseHeight 0 e sem kv_cota foram '
        +'IGNORADAS: zero é o padrão de qualquer linha nunca elevada, não uma cota. '
        +'Se alguma dessas era uma curva de cota 0 de verdade, eleve-a pela linha de corte.');
      if(!lista.length) throw new Error('Nenhuma curva com cota própria no desenho.');
      const offC=new Set(camadasRef.current.filter(c=>!c.on).map(c=>c.id));
      const todasLn=rs.filter(f=>['LineString','MultiLineString'].includes(f?.geometry?.type))
        .filter(f=>!offC.has(camadaDe(f)))
        .filter(f=>{const i=fid(f);return !(i!==null&&i!==undefined&&pidLer.has(String(i)));});
      linhasRef.current=todasLn;
      const pr=propagarCotas(lista,todasLn,tolProp);
      setHits([...lista,...pr.novos]);setAplicado(true);
      const cs=lista.map(x=>x.cota);
      lg('ok',lista.length+' curvas cotadas lidas do desenho · '+Math.min(...cs)+' → '+Math.max(...cs)+' m');
      lg('warn','ATENÇÃO: estas cotas foram gravadas por uma execução anterior deste app. '
        +'Se aquela execução errou alguma cota, o erro volta idêntico agora — corrigir o '
        +'algoritmo não adianta enquanto o valor velho estiver no desenho. '
        +'Para recalcular do zero, use "Zerar cotas gravadas" e depois a linha de corte.');
      if(pr.novos.length) lg('ok','+'+pr.novos.length+' trechos herdaram cota por continuidade.');
      if(pr.restantes) lg('warn',pr.restantes+' linha(s) sem cota ficarão de fora do TIN.');
    }catch(e){lg('err','Leitura de cotas: '+e.message);}
    finally{setBusy('');}
  };

  // ── Etapa 3: TIN por uso do solo ─────────────────────────────
  const doTIN=async()=>{
    if(!hits.length){lg('err','Não há curvas cotadas. Faça a Etapa 1 ou leia as cotas do desenho.');return;}
    const ativos=USOS.filter(u=>perims[u.k]?.length);
    if(!ativos.length){lg('err','Selecione ao menos um perímetro na aba Perímetros.');return;}
    setBusy('tin');setPct(0);setStats(null);
    try{
