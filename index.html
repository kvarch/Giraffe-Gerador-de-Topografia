<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KV Terreno 3D · GeoSampa e Levantamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   MATERIAL DESIGN 3 · TOKENS OFICIAIS KV (LIGHT)
   ══════════════════════════════════════════════════════════════ */
:root, .light {
  --md-sys-color-primary: rgb(0 103 124);
  --md-sys-color-surface-tint: rgb(0 103 124);
  --md-sys-color-on-primary: rgb(255 255 255);
  --md-sys-color-primary-container: rgb(0 172 205);
  --md-sys-color-on-primary-container: rgb(0 58 71);
  --md-sys-color-secondary: rgb(30 30 30);
  --md-sys-color-on-secondary: rgb(255 255 255);
  --md-sys-color-secondary-container: rgb(51 51 51);
  --md-sys-color-on-secondary-container: rgb(156 155 155);
  --md-sys-color-tertiary: rgb(38 39 125);
  --md-sys-color-on-tertiary: rgb(255 255 255);
  --md-sys-color-tertiary-container: rgb(62 64 149);
  --md-sys-color-on-tertiary-container: rgb(178 179 255);
  --md-sys-color-error: rgb(179 33 0);
  --md-sys-color-on-error: rgb(255 255 255);
  --md-sys-color-error-container: rgb(216 57 24);
  --md-sys-color-on-error-container: rgb(255 251 255);
  --md-sys-color-background: rgb(245 250 253);
  --md-sys-color-on-background: rgb(23 28 30);
  --md-sys-color-surface: rgb(249 249 249);
  --md-sys-color-on-surface: rgb(27 27 27);
  --md-sys-color-surface-variant: rgb(224 227 227);
  --md-sys-color-on-surface-variant: rgb(68 71 72);
  --md-sys-color-outline: rgb(116 120 120);
  --md-sys-color-outline-variant: rgb(196 199 199);
  --md-sys-color-shadow: rgb(0 0 0);
  --md-sys-color-scrim: rgb(0 0 0);
  --md-sys-color-inverse-surface: rgb(48 48 48);
  --md-sys-color-inverse-on-surface: rgb(241 241 241);
  --md-sys-color-inverse-primary: rgb(84 214 248);
  --md-sys-color-surface-dim: rgb(218 218 218);
  --md-sys-color-surface-bright: rgb(249 249 249);
  --md-sys-color-surface-container-lowest: rgb(255 255 255);
  --md-sys-color-surface-container-low: rgb(243 243 243);
  --md-sys-color-surface-container: rgb(238 238 238);
  --md-sys-color-surface-container-high: rgb(232 232 232);
  --md-sys-color-surface-container-highest: rgb(226 226 226);
  --md-extended-color-custom-color1-color: rgb(0 108 77);
  --md-extended-color-custom-color1-on-color: rgb(255 255 255);
  --md-extended-color-custom-color1-color-container: rgb(47 175 131);
  --md-extended-color-custom-color1-on-color-container: rgb(0 59 41);
  --kv-logo-pos: block;
  --kv-logo-neg: none;
}
/* ══════════════════════════════════════════════════════════════
   MATERIAL DESIGN 3 · TOKENS OFICIAIS KV (DARK)
   ══════════════════════════════════════════════════════════════ */
.dark {
  --md-sys-color-primary: rgb(84 214 248);
  --md-sys-color-surface-tint: rgb(84 214 248);
  --md-sys-color-on-primary: rgb(0 54 66);
  --md-sys-color-primary-container: rgb(0 172 205);
  --md-sys-color-on-primary-container: rgb(0 58 71);
  --md-sys-color-secondary: rgb(200 198 198);
  --md-sys-color-on-secondary: rgb(48 48 48);
  --md-sys-color-secondary-container: rgb(51 51 51);
  --md-sys-color-on-secondary-container: rgb(156 155 155);
  --md-sys-color-tertiary: rgb(192 193 255);
  --md-sys-color-on-tertiary: rgb(35 36 122);
  --md-sys-color-tertiary-container: rgb(62 64 149);
  --md-sys-color-on-tertiary-container: rgb(178 179 255);
  --md-sys-color-error: rgb(255 180 164);
  --md-sys-color-on-error: rgb(99 14 0);
  --md-sys-color-error-container: rgb(255 86 50);
  --md-sys-color-on-error-container: rgb(38 2 0);
  --md-sys-color-background: rgb(15 20 22);
  --md-sys-color-on-background: rgb(222 227 230);
  --md-sys-color-surface: rgb(19 19 19);
  --md-sys-color-on-surface: rgb(226 226 226);
  --md-sys-color-surface-variant: rgb(68 71 72);
  --md-sys-color-on-surface-variant: rgb(196 199 199);
  --md-sys-color-outline: rgb(142 145 146);
  --md-sys-color-outline-variant: rgb(68 71 72);
  --md-sys-color-inverse-surface: rgb(226 226 226);
  --md-sys-color-inverse-on-surface: rgb(48 48 48);
  --md-sys-color-inverse-primary: rgb(0 103 124);
  --md-sys-color-surface-dim: rgb(19 19 19);
  --md-sys-color-surface-bright: rgb(57 57 57);
  --md-sys-color-surface-container-lowest: rgb(14 14 14);
  --md-sys-color-surface-container-low: rgb(27 27 27);
  --md-sys-color-surface-container: rgb(31 31 31);
  --md-sys-color-surface-container-high: rgb(42 42 42);
  --md-sys-color-surface-container-highest: rgb(53 53 53);
  --md-extended-color-custom-color1-color: rgb(100 220 172);
  --md-extended-color-custom-color1-on-color: rgb(0 56 39);
  --md-extended-color-custom-color1-color-container: rgb(47 175 131);
  --md-extended-color-custom-color1-on-color-container: rgb(0 59 41);
  --kv-logo-pos: none;
  --kv-logo-neg: block;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;width:100%;overflow:hidden;}
body{
  font-family:'Hedley New','Hind',system-ui,-apple-system,sans-serif;
  background-color:var(--md-sys-color-background);
  color:var(--md-sys-color-on-background);
  font-size:13px;line-height:1.45;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--md-sys-color-surface-container-low);}
::-webkit-scrollbar-thumb{background:var(--md-sys-color-outline-variant);border-radius:0;}

:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:2px;}

/* ── Layout ─────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100%;overflow:hidden;}
.app-header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;min-height:64px;
  background-color:var(--md-sys-color-surface-container-lowest);
  border-bottom:1px solid var(--md-sys-color-outline-variant);
  flex-shrink:0;
}
.logo-container{display:flex;flex-direction:column;gap:2px;min-width:0;}
.brand-logo{height:26px;width:auto;display:block;}
.brand-logo.pos{display:var(--kv-logo-pos);}
.brand-logo.neg{display:var(--kv-logo-neg);}
.app-title{
  font-size:11px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;
  color:var(--md-sys-color-primary);margin-top:4px;
}
main{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.app-footer{
  flex-shrink:0;padding:8px 16px;
  border-top:1px solid var(--md-sys-color-outline-variant);
  background-color:var(--md-sys-color-surface-container-lowest);
  font-size:10px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}

/* ── Abas ───────────────────────────────────────────────────── */
.tabs{
  display:flex;flex-shrink:0;
  background-color:var(--md-sys-color-surface-container-low);
  border-bottom:1px solid var(--md-sys-color-outline-variant);
}
.tab{
  flex:1;min-height:48px;min-width:48px;padding:6px 4px;border:0;border-radius:0;
  border-bottom:2px solid transparent;background:transparent;cursor:pointer;
  font-family:inherit;font-size:10px;font-weight:600;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:color .15s,border-color .15s;
}
.tab:hover{color:var(--md-sys-color-on-surface);}
.tab[aria-selected="true"]{
  color:var(--md-sys-color-primary);
  border-bottom-color:var(--md-sys-color-primary);
  background-color:var(--md-sys-color-surface-container-lowest);
}

/* ── Cards ──────────────────────────────────────────────────── */
.card{
  background-color:var(--md-sys-color-surface-container-lowest);
  border:1px solid var(--md-sys-color-outline-variant);
  border-radius:0;box-shadow:none;padding:12px;
}
.card-title{
  font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.hint{font-size:11px;color:var(--md-sys-color-on-surface-variant);line-height:1.5;}

/* ── Botões ─────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:48px;padding:0 14px;border-radius:0;box-shadow:none;
  font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;
  border:1px solid transparent;transition:background-color .15s,color .15s,border-color .15s;
  text-align:center;line-height:1.2;
}
.btn:disabled{opacity:.38;cursor:not-allowed;}
.btn-pri{background-color:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);}
.btn-pri:not(:disabled):hover{background-color:var(--md-sys-color-on-primary-container);color:#fff;}
.btn-out{background-color:transparent;color:var(--md-sys-color-on-surface);border-color:var(--md-sys-color-outline);}
.btn-out:not(:disabled):hover{background-color:var(--md-sys-color-surface-container);}
.btn-ok{background-color:var(--md-extended-color-custom-color1-color-container);color:var(--md-extended-color-custom-color1-on-color-container);}
.btn-ok:not(:disabled):hover{background-color:var(--md-extended-color-custom-color1-color);color:var(--md-extended-color-custom-color1-on-color);}
.btn-err{background-color:transparent;color:var(--md-sys-color-error);border-color:var(--md-sys-color-error);}
.btn-err:not(:disabled):hover{background-color:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);}
.btn-icon{min-width:48px;min-height:48px;padding:0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}

/* ── Campos ─────────────────────────────────────────────────── */
.field-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.field-label{
  font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);flex-shrink:0;width:96px;
}
.fld{
  flex:1;min-height:48px;padding:0 12px;border-radius:0;box-shadow:none;
  background-color:var(--md-sys-color-surface-container-low);
  color:var(--md-sys-color-on-surface);
  border:1px solid var(--md-sys-color-outline);
  font-family:inherit;font-size:13px;outline:none;width:100%;
}
.fld:focus-visible{border-color:var(--md-sys-color-primary);}
.fld-sm{min-height:40px;padding:0 8px;font-size:12px;text-align:right;}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer;}
.chk input{width:20px;height:20px;accent-color:var(--md-sys-color-primary);cursor:pointer;flex-shrink:0;}
.chk span{font-size:12px;color:var(--md-sys-color-on-surface);}

/* ── Segmentado ─────────────────────────────────────────────── */
.seg{display:flex;border:1px solid var(--md-sys-color-outline);border-radius:0;overflow:hidden;}
.seg button{
  flex:1;min-height:48px;border:0;border-radius:0;cursor:pointer;
  background:transparent;color:var(--md-sys-color-on-surface-variant);
  font-family:inherit;font-size:11px;font-weight:500;
  border-left:1px solid var(--md-sys-color-outline-variant);
}
.seg button:first-child{border-left:0;}
.seg button[aria-pressed="true"]{
  background-color:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);font-weight:600;
}

/* ── Tabela de curvas ───────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:11px;}
.tbl th{
  text-align:left;font-size:9px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);
  padding:6px 6px;border-bottom:1px solid var(--md-sys-color-outline-variant);
}
.tbl td{padding:3px 6px;border-bottom:1px solid var(--md-sys-color-outline-variant);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:0;}
.tbl-wrap{max-height:220px;overflow-y:auto;border:1px solid var(--md-sys-color-outline-variant);}
.ord{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:0;flex-shrink:0;
  background-color:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);
  font-size:10px;font-weight:700;
}

/* ── Slots de uso do solo ───────────────────────────────────── */
.slot{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border:1px solid var(--md-sys-color-outline-variant);border-radius:0;
  background-color:var(--md-sys-color-surface-container-low);
}
.slot.on{border-color:var(--md-sys-color-primary);}
.swatch{width:14px;height:14px;flex-shrink:0;border:1px solid var(--md-sys-color-outline);}
.slot-name{font-size:12px;font-weight:600;flex:1;min-width:0;}
.slot-meta{font-size:10px;color:var(--md-sys-color-on-surface-variant);}

/* ── Estados / avisos ───────────────────────────────────────── */
.alert{
  padding:8px 10px;border-radius:0;font-size:11px;line-height:1.45;
  border:1px solid var(--md-sys-color-outline-variant);
}
.alert-ok{
  color:var(--md-extended-color-custom-color1-on-color-container);
  background-color:var(--md-extended-color-custom-color1-color-container);
  border-color:var(--md-extended-color-custom-color1-color);
}
.alert-err{
  color:var(--md-sys-color-on-error-container);
  background-color:var(--md-sys-color-error-container);
  border-color:var(--md-sys-color-error);
}
.alert-info{
  background-color:var(--md-sys-color-surface-container);
  color:var(--md-sys-color-on-surface-variant);
}

/* ── Progresso ──────────────────────────────────────────────── */
.pb{height:3px;background-color:var(--md-sys-color-surface-container-highest);overflow:hidden;margin-top:8px;}
.pf{height:100%;background-color:var(--md-sys-color-primary);transition:width .25s;}

/* ── Log ────────────────────────────────────────────────────── */
.log{
  background-color:var(--md-sys-color-surface-container-low);
  border:1px solid var(--md-sys-color-outline-variant);
  font-family:'Courier New',ui-monospace,monospace;
  font-size:10.5px;line-height:1.55;overflow-y:auto;padding:8px;
  height:150px;white-space:pre-wrap;word-break:break-word;
}
.l-ts{color:var(--md-sys-color-outline);}
.l-ok{color:var(--md-extended-color-custom-color1-color);}
.l-err{color:var(--md-sys-color-error);}
.l-warn{color:rgb(200 140 0);}
.dark .l-warn{color:rgb(250 190 60);}
.l-info{color:var(--md-sys-color-on-surface-variant);}

/* ── Dados / stats ──────────────────────────────────────────── */
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;}
.kv dt{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--md-sys-color-on-surface-variant);}
.kv dd{font-size:12px;font-weight:600;color:var(--md-sys-color-primary);text-align:right;}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}

/* ══════════════════════════════════════════════════════════════
   CASCA · alternância entre os dois módulos
   ══════════════════════════════════════════════════════════════ */
.mods{
  display:flex;flex-shrink:0;
  background-color:var(--md-sys-color-surface-container);
  border-bottom:1px solid var(--md-sys-color-outline-variant);
}
.mod{
  flex:1;min-height:48px;min-width:48px;padding:6px 8px;
  border:0;border-radius:0;border-bottom:3px solid transparent;
  background:transparent;cursor:pointer;font-family:inherit;
  font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:color .15s,border-color .15s,background-color .15s;
}
.mod:hover{color:var(--md-sys-color-on-surface);}
.mod[aria-selected="true"]{
  color:var(--md-sys-color-primary);
  border-bottom-color:var(--md-sys-color-primary);
  background-color:var(--md-sys-color-surface-container-lowest);
}
.mod-host{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;}
.mod-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 12px;flex-shrink:0;
  border-bottom:1px solid var(--md-sys-color-outline-variant);
  background-color:var(--md-sys-color-surface-container-lowest);
}
.mod-title{
  font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ══════════════════════════════════════════════════════════════
   MÓDULO GEOSAMPA · reestilização escopada
   O JS original define classes próprias (.bdg, .chip, .lg, .row2…).
   Aqui elas recebem os tokens KV sem que o script seja alterado.
   ══════════════════════════════════════════════════════════════ */
.geo-scope{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;
  color:var(--md-sys-color-on-surface);background-color:var(--md-sys-color-background);}
.geo-scope>div{flex:1;min-height:0;}

.geo-scope .btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:48px;padding:0 12px;border-radius:0;box-shadow:none;
  font-family:inherit;font-size:12px;font-weight:500;line-height:1.2;
  border:1px solid transparent;cursor:pointer;white-space:normal;text-align:center;
  transition:background-color .15s,color .15s,border-color .15s;
}
.geo-scope .btn:disabled{opacity:.38;cursor:not-allowed;}
.geo-scope .btn-pri{background-color:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);}
.geo-scope .btn-pri:not(:disabled):hover{background-color:var(--md-sys-color-on-primary-container);color:#fff;}
.geo-scope .btn-out{background:transparent;color:var(--md-sys-color-on-surface);
  border-color:var(--md-sys-color-outline);}
.geo-scope .btn-out:not(:disabled):hover{background-color:var(--md-sys-color-surface-container);}
.geo-scope .btn-sm{background:transparent;color:var(--md-sys-color-on-surface-variant);
  border-color:var(--md-sys-color-outline-variant);font-size:11px;}
.geo-scope .btn-sm:not(:disabled):hover{color:var(--md-sys-color-on-surface);
  border-color:var(--md-sys-color-outline);}
.geo-scope .btn-grn{background-color:var(--md-extended-color-custom-color1-color-container);
  color:var(--md-extended-color-custom-color1-on-color-container);border-color:transparent;}
.geo-scope .btn-grn:not(:disabled):hover{background-color:var(--md-extended-color-custom-color1-color);
  color:var(--md-extended-color-custom-color1-on-color);}

.geo-scope .card{
  background-color:var(--md-sys-color-surface-container-lowest);
  border:1px solid var(--md-sys-color-outline-variant);
  border-radius:0;box-shadow:none;padding:10px;
}
.geo-scope .bdg{
  width:22px;height:22px;border-radius:0;flex-shrink:0;
  font-size:10px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;
}
.geo-scope .b-act{background-color:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);}
.geo-scope .b-done{background-color:var(--md-extended-color-custom-color1-color-container);
  color:var(--md-extended-color-custom-color1-on-color-container);font-size:9px;}
.geo-scope .b-idle{background-color:var(--md-sys-color-surface-container-high);
  color:var(--md-sys-color-outline);}

.geo-scope .chip{
  border-radius:0;border:1px solid var(--md-sys-color-outline-variant);
  padding:5px 7px;display:flex;align-items:center;justify-content:space-between;
  background-color:var(--md-sys-color-surface-container-low);
}
.geo-scope .ch-f{border-color:var(--md-sys-color-primary);
  background-color:var(--md-sys-color-surface-container);}
.geo-scope .ch-e{opacity:.45;}
.geo-scope .ch-p{opacity:.55;}

.geo-scope .fld{
  background-color:var(--md-sys-color-surface-container-low);
  border:1px solid var(--md-sys-color-outline);border-radius:0;box-shadow:none;
  padding:0 10px;min-height:48px;color:var(--md-sys-color-on-surface);
  font-family:inherit;font-size:13px;outline:none;
}
.geo-scope .fld:focus-visible{border-color:var(--md-sys-color-primary);}
.geo-scope .fld::placeholder{color:var(--md-sys-color-outline);}

.geo-scope .lg{
  background-color:var(--md-sys-color-surface-container-low);
  border:1px solid var(--md-sys-color-outline-variant);border-radius:0;
  font-family:'Courier New',ui-monospace,monospace;
  font-size:10.5px;line-height:1.55;overflow-y:auto;padding:8px;
  white-space:pre-wrap;word-break:break-word;
}
.geo-scope .lo{color:var(--md-extended-color-custom-color1-color);}
.geo-scope .le{color:var(--md-sys-color-error);}
.geo-scope .lw{color:rgb(200 140 0);}
.dark .geo-scope .lw{color:rgb(250 190 60);}
.geo-scope .li{color:var(--md-sys-color-on-surface-variant);}
.geo-scope .lt{color:var(--md-sys-color-outline);}
.geo-scope .l-info{color:var(--md-sys-color-on-surface-variant);}

.geo-scope .pb{height:3px;border-radius:0;
  background-color:var(--md-sys-color-surface-container-highest);overflow:hidden;margin-top:8px;}
.geo-scope .pf{height:100%;border-radius:0;background-color:var(--md-sys-color-primary);
  transition:width .25s;}

.geo-scope .row2{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;}
.geo-scope .rk{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--md-sys-color-on-surface-variant);padding:1px 0;}
.geo-scope .rv{font-size:12px;font-weight:600;color:var(--md-sys-color-primary);text-align:right;}

.geo-scope .divl{height:1px;background-color:var(--md-sys-color-outline-variant);margin:8px 0;}

.geo-scope input[type=range]{
  flex:1;appearance:none;-webkit-appearance:none;height:3px;border-radius:0;
  background-color:var(--md-sys-color-outline-variant);outline:none;cursor:pointer;
}
.geo-scope input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:0;
  background-color:var(--md-sys-color-primary);
  border:2px solid var(--md-sys-color-surface-container-lowest);cursor:pointer;
}
.geo-scope input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:0;background-color:var(--md-sys-color-primary);
  border:2px solid var(--md-sys-color-surface-container-lowest);cursor:pointer;
}
.geo-scope input[type=range]:disabled{opacity:.38;}
.geo-scope input[type=range]:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:4px;}

</style>

// ══════════════════════════════════════════════════════════════
//  MÓDULO 1 · Terreno GeoSampa
//  Código original preservado. Cada módulo vive no seu próprio escopo
//  porque os dois declaram nomes iguais (buildTIN, getZFromTIN,
//  densifyRing, DEG_LAT…) e colidiriam no escopo do módulo ES.
// ══════════════════════════════════════════════════════════════
const AppGeoSampa=(()=>{
// ══════════════════════════════════════════════════════════════
//  WFS — URL correto (copiado do index.html)
// ══════════════════════════════════════════════════════════════
const WFS_BASE='https://wfs.geosampa.prefeitura.sp.gov.br/geoserver/ows';
let _proxy='';

// ── Constantes geográficas (copiadas do index.html) ────────────
const DEG_LAT=1/111320;
const DEG_LNG=1/(111320*Math.cos(23.5*Math.PI/180));

// BBOX a partir de uma feature GeoJSON (sem turf)
function featureToBBOX(f){
  const pts=[];
  function walk(a,d){if(d===0){pts.push(a);return;}for(const x of a)walk(x,d-1);}
  const D={Point:0,LineString:1,Polygon:2,MultiPoint:1,MultiLineString:2,MultiPolygon:3};
  walk(f.geometry.coordinates,D[f.geometry.type]??2);
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const[x,y]of pts){if(x<minX)minX=x;if(y<minY)minY=y;if(x>maxX)maxX=x;if(y>maxY)maxY=y;}
  return{minX,minY,maxX,maxY};
}

// Expande BBOX em metros usando conversão de graus (copiado do index.html)
function expandBBOX(b,m){
  return{minX:b.minX-m*DEG_LNG,minY:b.minY-m*DEG_LAT,maxX:b.maxX+m*DEG_LNG,maxY:b.maxY+m*DEG_LAT};
}

// Mescla múltiplos polígonos em um só (copiado do index.html)
function mergeToSinglePolygon(features){
  if(!features.length) return null;
  if(features.length===1) return features[0].geometry;
  const polys=features
    .filter(f=>f.geometry&&(f.geometry.type==='Polygon'||f.geometry.type==='MultiPolygon'))
    .flatMap(f=>f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates);
  if(!polys.length) return null;
  if(polys.length===1) return{type:'Polygon',coordinates:polys[0]};
  return{type:'MultiPolygon',coordinates:polys};
}

// Buffer com steps:16 para WKT suave (copiado do index.html)
function turfBufferGeom(geometry,meters){
  try{
    const fc={type:'FeatureCollection',features:[{type:'Feature',geometry,properties:{}}]};
    const buffered=turf.buffer(fc,meters/1000,{units:'kilometers',steps:16});
    if(buffered?.features?.[0]?.geometry) return buffered.features[0].geometry;
  }catch(_){}
  return geometry;
}

function buildProxiedUrl(wfsUrl){
  const b=_proxy.replace(/\/$/,'');
  return b?`${b}?url=${encodeURIComponent(wfsUrl)}`:wfsUrl;
}

function buildWFSUrl(typeId,minX,minY,maxX,maxY,max){
  return`${WFS_BASE}?${new URLSearchParams({
    service:'WFS',version:'1.1.0',request:'GetFeature',
    typeName:typeId,outputFormat:'application/json',
    maxFeatures:String(max),srsName:'EPSG:4326',
    bbox:`${minX},${minY},${maxX},${maxY},EPSG:4326`,
  })}`;
}

// fetchWFS — cópia fiel do index.html (res.text() → JSON.parse)
async function fetchWFS(typeId,minX,minY,maxX,maxY,max,ms){
  const fetchUrl=buildProxiedUrl(buildWFSUrl(typeId,minX,minY,maxX,maxY,max));
  let res;
  try{res=await fetch(fetchUrl,{signal:AbortSignal.timeout(ms||25000)});}
  catch(e){
    if(e.name==='AbortError'||e.name==='TimeoutError') throw Object.assign(new Error('Timeout'),{_kind:'timeout'});
    throw Object.assign(new Error('CORS/rede — proxy configurado?'),{_kind:'cors'});
  }
  if(!res.ok) throw Object.assign(new Error(`HTTP ${res.status}`),{_kind:'http'});
  const text=await res.text();
  let json;
  try{json=JSON.parse(text);}
  catch(_){
    if(text.trim().startsWith('<')) throw Object.assign(new Error('Sem WFS (raster ou HTML)'),{_kind:'nowfs'});
    throw Object.assign(new Error('Resposta inválida'),{_kind:'parse'});
  }
  if(json.exceptions||json.ExceptionReport) throw Object.assign(new Error('WFS exception'),{_kind:'wfsexc'});
  return json;
}

// INTERSECTS com detecção automática de coluna geométrica — cópia do index.html
const _colCache={};
function _guessCols(typeId){
  const n=typeId.replace(/^[^:]+:/,'').toLowerCase();
  const isLine=/curva|linha|logradouro|segmento|via_|calcada|cal.ada|ferr|rio_|corrego|duto|rede_|trilho|limite_|faixa/.test(n);
  const isPt=/ponto|marco|arvore|cotado|equip|poste/.test(n);
  if(isLine)  return['ge_linha',  'ge_poligono','ge_ponto'];
  if(isPt)    return['ge_ponto',  'ge_poligono','ge_linha'];
  return           ['ge_poligono','ge_linha',   'ge_ponto'];
}
async function _fetchCol(typeId,wkt,max,col,ms){
  const fetchUrl=buildProxiedUrl(`${WFS_BASE}?${new URLSearchParams({
    service:'WFS',version:'1.1.0',request:'GetFeature',
    typeName:typeId,outputFormat:'application/json',
    maxFeatures:String(max),srsName:'EPSG:4326',
    CQL_FILTER:`INTERSECTS(${col},${wkt})`,
  })}`);
  let res;
  try{res=await fetch(fetchUrl,{signal:AbortSignal.timeout(ms||20000)});}
  catch(e){
    if(e.name==='AbortError'||e.name==='TimeoutError') throw Object.assign(new Error('Timeout'),{_kind:'timeout'});
    throw Object.assign(new Error('CORS'),{_kind:'cors'});
  }
  if(!res.ok) throw Object.assign(new Error(`HTTP ${res.status}`),{_kind:'http'});
  const text=await res.text();
  let json;
  try{json=JSON.parse(text);}
  catch(_){
    if(text.trim().startsWith('<')) throw Object.assign(new Error('coluna inválida'),{_kind:'wfsexc'});
    throw Object.assign(new Error('parse error'),{_kind:'parse'});
  }
  if(json.exceptions||json.ExceptionReport) throw Object.assign(new Error('coluna inválida'),{_kind:'wfsexc'});
  return json;
}
async function fetchByGeom(typeId,wkt,max,ms){
  if(_colCache[typeId]) return _fetchCol(typeId,wkt,max,_colCache[typeId],ms);
  for(const col of _guessCols(typeId)){
    try{const r=await _fetchCol(typeId,wkt,max,col,ms);_colCache[typeId]=col;return r;}
    catch(e){if(e._kind==='wfsexc') continue; throw e;}
  }
  throw Object.assign(new Error('Sem dados WFS'),{_kind:'nowfs'});
}

// ══════════════════════════════════════════════════════════════
//  UTM Zone 23S — cópia fiel do index.html
// ══════════════════════════════════════════════════════════════
function ll2utm(lng,lat){
  const a=6378137,f=1/298.257223563,b=a*(1-f),e2=(a*a-b*b)/(a*a),ep2=e2/(1-e2),k0=0.9996;
  const lon0=-45*Math.PI/180,latR=lat*Math.PI/180,lonR=lng*Math.PI/180;
  const N=a/Math.sqrt(1-e2*Math.sin(latR)**2),T=Math.tan(latR)**2,C=ep2*Math.cos(latR)**2;
  const A=Math.cos(latR)*(lonR-lon0);
  const M=a*((1-e2/4-3*e2**2/64-5*e2**3/256)*latR-(3*e2/8+3*e2**2/32+45*e2**3/1024)*Math.sin(2*latR)
    +(15*e2**2/256+45*e2**3/1024)*Math.sin(4*latR)-(35*e2**3/3072)*Math.sin(6*latR));
  let x=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T**2+72*C-58*ep2)*A**5/120)+500000;
  let y=k0*(M+N*Math.tan(latR)*(A**2/2+(5-T+9*C+4*C**2)*A**4/24+(61-58*T+T**2+600*C-330*ep2)*A**6/720));
  if(lat<0) y+=10000000;
  return[Math.round(x*100)/100,Math.round(y*100)/100];
}
function geojsonToWKT(geometry){
  const pt=([g,l])=>{const[x,y]=ll2utm(g,l);return`${x} ${y}`;};
  if(geometry.type==='Polygon') return`SRID=31983;POLYGON((${geometry.coordinates[0].map(pt).join(',')}))`;
  if(geometry.type==='MultiPolygon') return`SRID=31983;MULTIPOLYGON(${geometry.coordinates.map(p=>`((${p[0].map(pt).join(',')}))`).join(',')})`;
  return null;
}

// Amostra pontos {lng,lat,elev} das curvas para o TIN
function samplePoints(fcs,maxPtsPerLine=20){
  const pts=[];
  for(const fc of fcs){
    for(const f of(fc?.features||[])){
      const elev=parseFloat(f.properties?.cd_numero_isovalor);
      if(isNaN(elev)) continue;
      const g=f.geometry;
      const lines=g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[];
      for(const ln of lines){
        const step=Math.max(1,Math.floor(ln.length/maxPtsPerLine));
        for(let i=0;i<ln.length;i+=step) pts.push({lng:ln[i][0],lat:ln[i][1],elev});
        const last=ln[ln.length-1];if(last) pts.push({lng:last[0],lat:last[1],elev});
      }
    }
  }
  return pts;
}

// Transforma FCs para GeoJSON 3D (coordenadas [lng,lat,relH]) para layer de curvas
function make3DContourFC(fcs,datum){
  const features=[];
  for(const fc of fcs){
    for(const f of(fc?.features||[])){
      const elev=parseFloat(f.properties?.cd_numero_isovalor);
      if(isNaN(elev)) continue;
      const relH=Math.max(0,elev-datum);
      const add3D=coords=>coords.map(pt=>[pt[0],pt[1],relH]);
      const g=f.geometry;
      let geom3d;
      if(g.type==='LineString') geom3d={type:'LineString',coordinates:add3D(g.coordinates)};
      else if(g.type==='MultiLineString') geom3d={type:'MultiLineString',coordinates:g.coordinates.map(add3D)};
      else continue;
      features.push({type:'Feature',properties:{
        cd_numero_isovalor:f.properties?.cd_numero_isovalor,
        baseHeight:relH,   // posição 3D (nativo Giraffe)
        _baseHeight:relH,  // formato interno Giraffe
        height:0,          // sem extrusão adicional
      },geometry:geom3d});
    }
  }
  return{type:'FeatureCollection',features};
}

// ══════════════════════════════════════════════════════════════
//  TIN via Delaunator
// ══════════════════════════════════════════════════════════════
async function buildTIN(pts,datum){
  const{default:Delaunator}=await import('https://esm.sh/delaunator@5.0.0');
  if(pts.length<4) throw new Error(`Pontos insuficientes para TIN: ${pts.length}`);
  // Diagnóstico dos valores de elevação
  const elevs=pts.map(p=>p.elev);
  const eMin=Math.min(...elevs),eMax=Math.max(...elevs);
  const uniq=new Set(elevs.map(e=>Math.round(e)));
  console.log(`[TIN] ${pts.length} pts | elev ${eMin}–${eMax}m | ${uniq.size} cotas distintas`);

  const SNAP=5e-6;
  const seen=new Map(),cl=[];
  for(const p of pts){
    const k=`${p.lng/SNAP|0},${p.lat/SNAP|0}`;
    if(!seen.has(k)){seen.set(k,true);cl.push(p);}
  }
  if(cl.length<4) throw new Error('Pontos deduplicados insuficientes');
  const d=new Delaunator(cl.flatMap(p=>[p.lng,p.lat]));
  // Limiar adaptativo de aresta
  const samp=[];
  for(let i=0;i<Math.min(d.triangles.length,1200);i+=3){
    const A=cl[d.triangles[i]],B=cl[d.triangles[i+1]];
    samp.push(Math.hypot(A.lng-B.lng,A.lat-B.lat));
  }
  samp.sort((a,b)=>a-b);
  const maxEdge=Math.max((samp[samp.length>>1]||0.001)*7,3e-4);
  const feats=[];
  for(let i=0;i<d.triangles.length;i+=3){
    const A=cl[d.triangles[i]],B=cl[d.triangles[i+1]],C=cl[d.triangles[i+2]];
    if(Math.max(
      Math.hypot(A.lng-B.lng,A.lat-B.lat),
      Math.hypot(B.lng-C.lng,B.lat-C.lat),
      Math.hypot(C.lng-A.lng,C.lat-A.lat)
    )>maxEdge) continue;
    // Alturas relativas (relH = metros acima do ponto mais baixo da área)
    const ha=Math.max(0,A.elev-datum);
    const hb=Math.max(0,B.elev-datum);
    const hc=Math.max(0,C.elev-datum);
    feats.push({
      type:'Feature',
      properties:{avgH:(ha+hb+hc)/3,ha,hb,hc},
      // ALTURA CODIFICADA NA COORDENADA Z: [lng, lat, height]
      // Z viaja com o vértice, imune a reordenações internas do Giraffe
      geometry:{type:'Polygon',
        coordinates:[[[A.lng,A.lat,ha],[B.lng,B.lat,hb],[C.lng,C.lat,hc],[A.lng,A.lat,ha]]]}
    });
  }
  return{type:'FeatureCollection',features:feats};
}

// ══════════════════════════════════════════════════════════════
//  Separação por Uso do Solo — "Drape" sobre TIN existente
//
//  Fluxo:
//   1. Baixar Quadras e Calçadas do GeoSampa
//   2. Criar 3 polígonos 2D limpos: intersect/difference com o buffer
//   3. Para cada polígono 2D, injetar Z em todos os vértices usando
//      o TIN já gerado como superfície de referência (getZFromTIN)
//   4. Triangular os polígonos 3D resultantes com Delaunator
//      + filtro de centróide para excluir triângulos fora do polígono
//
//  Não há clipping 3D, não há re-geração de TIN por sub-área,
//  não há sobreposição — os 3 polígonos 2D são mutuamente exclusivos.
// ══════════════════════════════════════════════════════════════

const QUADRA_LAYER  = 'geoportal:quadra_viaria_editada';
const CALCADA_LAYER = 'geoportal:calcada';
const SPLIT_IDS    = {Quadra:'kv-split-quadra', Calçada:'kv-split-calcada', Rua:'kv-split-rua'};
const SPLIT_COLORS = {Quadra:'#c87137', Calçada:'#7a8fa6', Rua:'#3a3a3a'};

// ── Interpolação Z baricêntrica do TIN ────────────────────────
// Localiza o triângulo do TIN que contém (lng,lat) em 2D e retorna
// a altura relativa Z interpolada pelos pesos baricêntricos.
// Fallback: quando o ponto está fora da cobertura do TIN (ex.: vértices
// do buffer perimetral), usa o vértice TIN mais próximo → evita Z=0.
function getZFromTIN(lng,lat,tinFeatures){
  // Tentativa 1: interpolação baricêntrica exata
  for(const tri of tinFeatures){
    const ring=tri.geometry.coordinates[0];
    const[ax,ay,az=0]=ring[0],[bx,by,bz=0]=ring[1],[cx,cy,cz=0]=ring[2];
    const det=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);
    if(Math.abs(det)<1e-14) continue;
    const w1=((by-cy)*(lng-cx)+(cx-bx)*(lat-cy))/det;
    const w2=((cy-ay)*(lng-cx)+(ax-cx)*(lat-cy))/det;
    const w3=1-w1-w2;
    if(w1>=-1e-3&&w2>=-1e-3&&w3>=-1e-3)
      return Math.max(0,w1*az+w2*bz+w3*cz);
  }
  // Fallback: vértice TIN mais próximo (pontos no perímetro do buffer
  // podem cair fora dos triângulos — sem isso ficam com Z=0)
  let bestZ=0,bestD=Infinity;
  for(const tri of tinFeatures){
    for(const v of tri.geometry.coordinates[0].slice(0,3)){
      const d=Math.hypot(lng-v[0],lat-v[1]);
      if(d<bestD){bestD=d;bestZ=v[2]||0;}
    }
  }
  return bestZ;
}

// ── Adensamento de anel ───────────────────────────────────────
// Insere vértices intermediários a cada stepDeg graus.
// ~5m = 5/111320 ≈ 4.5e-5 graus em SP.
function densifyRing(ring,stepDeg){
  if(!ring||ring.length<3) return ring;
  const out=[];
  for(let i=0;i<ring.length-1;i++){
    const p1=ring[i],p2=ring[i+1];
    out.push(p1);
    const d=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    if(d>stepDeg){
      const n=Math.ceil(d/stepDeg);
      for(let j=1;j<n;j++){
        const t=j/n;
        out.push([p1[0]+t*(p2[0]-p1[0]),p1[1]+t*(p2[1]-p1[1])]);
      }
    }
  }
  out.push(out[0]);
  return out;
}

// ── Drape + Triangulação de um polígono 2D ────────────────────
// Combina dois conjuntos de pontos para o Delaunator:
//   A) Vértices do polígono (anel externo adensado + buracos)
//      → Z interpolado pelo TIN com strictZ (SEM fallback de vértice próximo)
//      → Pontos fora da cobertura do TIN são DESCARTADOS (não adicionados)
//      → Isso evita o bug de "triângulo voando": o fallback retornava o Z
//        do vértice TIN mais próximo, que pode estar em cota completamente
//        diferente da real naquele ponto do perímetro do buffer.
//   B) Pontos de curvas de nível dentro do polígono
//      → Z exato (cp.elev − datum), fonte de verdade do terreno
// O polígono 2D (com buracos) filtra os triângulos pelo centróide.
function drapeFeature(feat,tinFeatures,usage,stepDeg,Delaunator,contourPtsRel=[]){
  if(!feat?.geometry) return[];
  const polys=feat.geometry.type==='Polygon'?[feat.geometry.coordinates]
    :feat.geometry.type==='MultiPolygon'?feat.geometry.coordinates:[];
  const out=[];

  for(const polyCoords of polys){
    if(!polyCoords.length||!polyCoords[0]||polyCoords[0].length<4) continue;

    // safeZ: interpolação baricêntrica do TIN + fallback de vizinho próximo.
    // Diferença de strictZ: em vez de retornar null para pontos fora de qualquer
    // triângulo TIN, usa o vértice TIN mais próximo SE ele estiver dentro de
    // ~55m (6e-4 graus). Isso cobre as lacunas do TIN em áreas planas onde o
    // maxEdge filter removeu triângulos longos entre curvas de nível esparsas.
    // Pontos genuinamente externos (>55m de qualquer vértice TIN) continuam
    // retornando null e sendo descartados — proteção contra triângulos voando.
    const MAX_GAP=6e-4; // ~67m em graus
    const safeZ=(lng,lat)=>{
      // Tentativa 1: interpolação baricêntrica exata dentro de um triângulo
      for(const tri of tinFeatures){
        const r=tri.geometry.coordinates[0];
        const[ax,ay,az=0]=r[0],[bx,by,bz=0]=r[1],[cx,cy,cz=0]=r[2];
        const det=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);
        if(Math.abs(det)<1e-14) continue;
        const w1=((by-cy)*(lng-cx)+(cx-bx)*(lat-cy))/det;
        const w2=((cy-ay)*(lng-cx)+(ax-cx)*(lat-cy))/det;
        const w3=1-w1-w2;
        if(w1>=-1e-3&&w2>=-1e-3&&w3>=-1e-3)
          return Math.max(0,w1*az+w2*bz+w3*cz);
      }
      // Tentativa 2: vértice TIN mais próximo (lacunas em áreas planas)
      // Só usa se o vértice estiver dentro do limiar — protege contra Z errado
      // em pontos muito afastados do TIN (perímetro do buffer em áreas inclinadas)
      let bestZ=null,bestD=Infinity;
      for(const tri of tinFeatures){
        for(const v of tri.geometry.coordinates[0].slice(0,3)){
          const d=Math.hypot(lng-v[0],lat-v[1]);
          if(d<bestD){bestD=d;bestZ=v[2]||0;}
        }
      }
      return bestD<=MAX_GAP?bestZ:null;
    };

    const SNAP=5e-7;
    const seenP=new Map();
    const pts=[];
    const addPt=(lng,lat,z)=>{
      const k=`${lng/SNAP|0},${lat/SNAP|0}`;
      if(seenP.has(k)) return;
      seenP.set(k,true);
      pts.push([lng,lat,Math.max(0,z)]);
    };

    // Polígono 2D (com buracos) — criado primeiro para filtrar pontos de curva
    const poly2D={type:'Feature',geometry:{type:'Polygon',
      coordinates:polyCoords.map(r=>r.map(p=>[p[0],p[1]]))}};

    // A) Anel externo adensado — descarta apenas se safeZ retornar null
    for(const[lng,lat] of densifyRing(polyCoords[0],stepDeg).slice(0,-1)){
      const z=safeZ(lng,lat);
      if(z!==null) addPt(lng,lat,z);
    }

    // A) Anéis internos (buracos) — TAMBÉM adensados com safeZ
    for(let ri=1;ri<polyCoords.length;ri++)
      for(const[lng,lat] of densifyRing(polyCoords[ri],stepDeg).slice(0,-1)){
        const z=safeZ(lng,lat);
        if(z!==null) addPt(lng,lat,z);
      }

    // B) Pontos de curvas de nível dentro do polígono — Z exato, sempre confiável
    for(const cp of contourPtsRel){
      try{
        if(turf.booleanPointInPolygon(turf.point([cp.lng,cp.lat]),poly2D))
          addPt(cp.lng,cp.lat,cp.z);
      }catch(_){}
    }

    if(pts.length<3) continue;

    // Triangulação Delaunay (opera em 2D — Z não afeta a topologia)
    const d=new Delaunator(pts.flatMap(p=>[p[0],p[1]]));

    for(let i=0;i<d.triangles.length;i+=3){
      const A=pts[d.triangles[i]],B=pts[d.triangles[i+1]],C=pts[d.triangles[i+2]];
      const area=(B[0]-A[0])*(C[1]-A[1])-(C[0]-A[0])*(B[1]-A[1]);
      if(Math.abs(area)<1e-14) continue;
      const cx=(A[0]+B[0]+C[0])/3,cy=(A[1]+B[1]+C[1])/3;
      try{if(!turf.booleanPointInPolygon(turf.point([cx,cy]),poly2D)) continue;}
      catch(_){continue;}
      const ha=A[2],hb=B[2],hc=C[2];
      out.push({type:'Feature',
        properties:{avgH:(ha+hb+hc)/3,ha,hb,hc},
        geometry:{type:'Polygon',
          coordinates:[[[A[0],A[1],ha],[B[0],B[1],hb],[C[0],C[1],hc],[A[0],A[1],ha]]]}});
    }
  }
  return out;
}

// ══════════════════════════════════════════════════════════════
//  App
// ══════════════════════════════════════════════════════════════
function AppGeoSampa(){
  const[proxy,setProxy]=useState(()=>{const v=localStorage.getItem('geosampa_proxy')||'';_proxy=v;return v;});
  const[buf,setBuf]=useState(75);
  const[res,setRes]=useState(2); // 1=Normal 2=Alta 3=Máxima
  const[geo,setGeo]=useState(null);   // {geom, bbox:[x0,y0,x1,y1], wkt}
  const[scan,setScan]=useState({});   // {id:'found'|'empty'|'err'}
  const[fcs,setFcs]=useState(null);   // FeatureCollections das curvas fetched
  const[tin,setTin]=useState(null);
  const[stats,setStats]=useState(null);
  const[exag,setExag]=useState(3);    // exageração vertical do preview — mantido no state mas não exposto na UI
  const[phase,setPhase]=useState('idle');
  const[pct,setPct]=useState(0);
  const[logs,setLogs]=useState([]);
  const logEl=useRef(null);
  const[splitFcs,setSplitFcs]=useState(null);
  const[fixBusy,setFixBusy]=useState(false);
  const[splitVis,setSplitVis]=useState({Quadra:true,Calçada:true,Rua:true});
  const[splitBusy,setSplitBusy]=useState(false);

  const sp=v=>{setProxy(v);_proxy=v;localStorage.setItem('geosampa_proxy',v);};
  const lg=(t,m)=>{
    const ts=new Date().toLocaleTimeString('pt-BR',{hour12:false});
    setLogs(p=>[...p,{t,m,ts}].slice(-500));
  };
  useEffect(()=>{if(logEl.current)logEl.current.scrollTop=logEl.current.scrollHeight;},[logs]);

  const phI=p=>PHASES.indexOf(p);
  const busy=['sel','scan','fetch','tin','patch'].includes(phase);

  function bdg(phases){
    const cur=phI(phase);
    if(phases.some(p=>p===phase)) return'bdg b-act';
    if(phases.every(p=>cur>phI(p))) return'bdg b-done';
    return'bdg b-idle';
  }

  // ─── 1. Selecionar ──────────────────────────────────────────
  const doSel=async()=>{
    if(!proxy.trim()){lg('err','Configure o proxy primeiro.');return;}
    setPhase('sel');
    lg('info','Clique em um polígono no mapa...');
    try{
      const ss=await rpc.invoke('pickRawSections',[]);
      if(!ss?.length) throw new Error('Nenhum elemento clicado');
      const poly=ss.find(s=>['Polygon','MultiPolygon'].includes(s.geometry?.type));
      if(!poly) throw new Error('O elemento clicado não é um polígono');
      // Log do primeiro vértice do polígono para confirmar que é o elemento correto
      const firstCoord=poly.geometry.coordinates?.[0]?.[0];
      if(firstCoord) lg('info',`Polígono[0]: lng=${firstCoord[0]?.toFixed(6)} lat=${firstCoord[1]?.toFixed(6)}`);
      // Buffer simples — mesmo padrão que funcionava em V22/V23
      const bfrd=turf.buffer(
        {type:'Feature',geometry:poly.geometry,properties:{}},
        buf,
        {units:'meters'}
      );
      const bfrdGeom=bfrd?.geometry||poly.geometry;
      const[x0,y0,x1,y1]=turf.bbox({type:'Feature',geometry:bfrdGeom,properties:{}});
      const wkt=geojsonToWKT(bfrdGeom);
      // Log diagnóstico — confirma que bbox está sobre o polígono clicado
      lg('info',`Bbox: lng [${x0.toFixed(5)} → ${x1.toFixed(5)}] lat [${y0.toFixed(5)} → ${y1.toFixed(5)}]`);
      lg('info',`WKT gerado: ${wkt?wkt.slice(0,60)+'…':'FALHOU — usando bbox'}`);
      setGeo({geom:poly.geometry,bbox:[x0,y0,x1,y1],wkt});
      setScan({});setFcs(null);setTin(null);setStats(null);
      setPhase('r_scan');
      lg('ok',`Polígono capturado. Buffer ${buf} m aplicado.`);
    }catch(e){lg('err',e.message);setPhase('idle');}
  };

  // ─── 2. Escanear ────────────────────────────────────────────
  const doScan=async()=>{
    if(!geo||busy) return;
    // NÃO limpa fcs/tin/stats aqui — só atualiza scan status
    // fcs e tin só são limpos em doSel (nova seleção de terreno)
    setPhase('scan');setScan({});setPct(0);
    lg('info','Escaneando camadas de curva de nível...');
    const ns={};
    for(let i=0;i<LAYERS.length;i++){
      const L=LAYERS[i];
      lg('info',`Verificando ${L.lb}...`);
      try{
        // Tenta INTERSECTS (fetchByGeom, com detecção de coluna) — mais preciso
        // Se falhar por qualquer motivo, cai no BBOX puro como fallback
        let fc;
        try{
          fc=geo.wkt?await fetchByGeom(L.tn,geo.wkt,1,12000):null;
        }catch(_){fc=null;}
        if(!fc) fc=await fetchWFS(L.tn,...geo.bbox,1,12000);
        const ok=(fc?.features?.length??0)>0;
        ns[L.id]=ok?'found':'empty';
        lg(ok?'ok':'warn',`${L.lb}: ${ok?'✓':'∅ sem dados'}`);
      }catch(e){
        ns[L.id]='err';
        lg('warn',`${L.lb}: ${e.message.slice(0,60)}`);
      }
      setPct(Math.round((i+1)/LAYERS.length*100));
    }
    setScan(ns);
    const found=Object.values(ns).filter(v=>v==='found').length;
    if(!found){lg('err','Nenhuma camada com dados. Tente buffer maior.');setPhase('r_scan');}
    else{lg('ok',`${found} camada(s) com dados.`);setPhase('r_gen');}
  };

  // ─── 3. Buscar dados (usado por Calcular e Download) ─────────
  const doFetch=async(maxF=3000)=>{
    const fnd=LAYERS.filter(L=>scan[L.id]==='found');
    if(!fnd.length) throw new Error('Nenhuma camada com dados para buscar');
    const result=[];
    for(let i=0;i<fnd.length;i++){
      const L=fnd[i];
      lg('info',`Baixando ${L.lb}...`);
      const fc=geo.wkt?await fetchByGeom(L.tn,geo.wkt,maxF,50000):await fetchWFS(L.tn,...geo.bbox,maxF,50000);
      const n=fc?.features?.length??0;
      lg('ok',`${L.lb}: ${n} feições`);
      if(n>0){
        // Diagnóstico: verificar campo cd_numero_isovalor nas primeiras feições
        const sample=fc.features.slice(0,3);
        sample.forEach((f,idx)=>{
          const v=f.properties?.cd_numero_isovalor;
          lg('info',`  feat${idx}: cd_numero_isovalor=${v===undefined?'AUSENTE':v}`);
        });
        result.push(fc);
      }
      setPct(Math.round((i+1)/fnd.length*60));
    }
    return result;
  };

  // ─── 3a. Calcular TIN + Preview ─────────────────────────────
  const doCalc=async()=>{
    if(!geo||!Object.values(scan).some(v=>v==='found')||busy) return;
    setPhase('fetch');setPct(0);setStats(null);setTin(null);
    lg('info','━━ Calculando perfil de terreno ━━');
    try{
      const loadedFcs=await doFetch(3000);
      setFcs(loadedFcs);
      setPhase('tin');
      lg('info','Extraindo pontos de elevação (cd_numero_isovalor)...');
      // Normal=20 | Alta=80 | Máxima=500 pts por segmento de curva
      const ptsPerLine=res===1?20:res===2?80:500;
      lg('info',`Resolução: ${['','Normal','Alta','Máxima'][res]} — até ${ptsPerLine} pts/curva`);
      const ptsAll=samplePoints(loadedFcs,ptsPerLine);
      if(ptsAll.length<8) throw new Error(
        `Apenas ${ptsAll.length} pontos com cd_numero_isovalor. `
        +'Verifique se o campo existe nas feições acima.');

      // ── Clipar pontos ao polígono bufferizado ────────────────────
      // As curvas de nível são linhas longas — sem clip, o TIN cobre
      // muito além da área selecionada criando uma "forma aleatória"
      const bufferFeature=turf.buffer(
        {type:'Feature',geometry:geo.geom,properties:{}},
        buf,{units:'meters'}
      );
      const pts=ptsAll.filter(p=>
        turf.booleanPointInPolygon([p.lng,p.lat],bufferFeature)
      );
      lg('info',`Clip ao buffer ${buf}m: ${ptsAll.length} → ${pts.length} pts dentro da área`);
      if(pts.length<8) throw new Error(
        `Apenas ${pts.length} pontos dentro do buffer. Tente aumentar o buffer.`);

      const elevs=pts.map(p=>p.elev);
      const eMin=Math.min(...elevs),eMax=Math.max(...elevs);
      const datum=eMin;
      lg('ok',`${pts.length} pts | ${eMin}→${eMax} m s.n.m. | datum=${datum} m | desnível=${eMax-eMin} m`);
      if(eMax-eMin<0.1) lg('warn','⚠ Desnível muito pequeno — área possivelmente plana ou campo cd_numero_isovalor igual em todas as curvas');
      setPct(70);
      lg('info','Triangulando TIN (Delaunay)...');
      const tinResult=await buildTIN(pts,datum);
      if(!tinResult.features.length) throw new Error('Nenhum triângulo válido');
      setTin(tinResult);
      lg('ok',`TIN: ${tinResult.features.length} triângulos | ha/hb/hc calculados por vértice`);
      // Preview com exageração
      await _renderPreview(tinResult,eMax-eMin);
      setPct(100);
      setStats({eMin,eMax,dnivel:eMax-eMin,datum,ntri:tinResult.features.length,npts:pts.length});
      lg('ok','Preview visível. Use os botões abaixo para exportar ou fixar patches.');
      setPhase('r_patch');
    }catch(e){
      lg('err',`Erro: ${e.message}`);
      setPhase('r_gen');setPct(0);
    }
  };

  // Preview fill-extrusion com alturas reais (sem exageração)
  const _renderPreview=async(tinResult,dnivel)=>{
    const maxH=dnivel||1;
    const cex=['interpolate',['linear'],['get','avgH'],
      0,'#1a3a28',maxH*.15,'#1d6347',maxH*.35,'#25a265',
      maxH*.55,'#6ec97e',maxH*.75,'#c8e6a0',maxH,'#f0ede2'];
    try{await rpc.invoke('removeTempLayer',[PREVIEW_ID]);}catch(_){}
    await rpc.invoke('addTempLayerGeoJSON',[
      PREVIEW_ID,tinResult,
      {type:'fill-extrusion',paint:{
        'fill-extrusion-color':cex,
        'fill-extrusion-height':['get','avgH'],
        'fill-extrusion-base':0,'fill-extrusion-opacity':0.9,
      }}
    ]);
  };

  // ─── Download curvas como layer ─────────────────────────────
  const doImport=async(mode)=>{
    if(!fcs||busy) return;
    if(!stats) return;
    const {datum,dnivel}=stats;
    lg('info',`Importando curvas — modo ${mode==='temp'?'temporário 3D':mode==='draw'?'camada de desenho':'permanente'}...`);
    try{
      if(mode==='temp'){
        // 3D: coordenadas [lng,lat,relH] + line style
        const fc3d=make3DContourFC(fcs,datum);
        const maxH=dnivel||1;
        const cex=['interpolate',['linear'],['get','baseHeight'],
          0,'#34d399',maxH*.4,'#fb923c',maxH,'#fcd34d'];
        try{await rpc.invoke('removeTempLayer',[CURVAS_TEMP_ID]);}catch(_){}
        await rpc.invoke('addTempLayerGeoJSON',[
          CURVAS_TEMP_ID,fc3d,
          {type:'line',paint:{'line-color':cex,'line-width':1.5,'line-opacity':0.9}}
        ]);
        lg('ok',`Curvas 3D adicionadas como layer temporário (${fc3d.features.length} feições)`);
      } else if(mode==='draw'){
        // Camada de desenho: createRawSections com _baseHeight por cota
        // Mesmo padrão do GeoSampa import (modo editável) + altura 3D
        const drawFeats=fcs.flatMap(fc=>(fc.features||[]).map(f=>{
          const elev=parseFloat(f.properties?.cd_numero_isovalor);
          const relH=isNaN(elev)?0:Math.max(0,elev-datum);
          return{
            type:'Feature',
            geometry:f.geometry,
            properties:{
              ...f.properties,
              id:undefined,
              _source:'GeoSampa',
              _layer:'Curvas de Nível',
              _baseHeight:relH,
              baseHeight:relH,
              height:0,
            }
          };
        }));
        lg('info',`Criando ${drawFeats.length} curvas como raw sections (baseHeight por cota)...`);
        const r=await rpc.invoke('createRawSections',[drawFeats]);
        const n=Array.isArray(r)?r.length:drawFeats.length;
        lg('ok',`✓ ${n} curvas criadas no layer de desenho ativo (baseHeight por elevação)`);
      } else {
        // Permanente: importRawSections → cria raw sections editáveis no layer ativo
        // baseHeight posiciona cada curva na sua cota relativa ao datum
        const rawSections=fcs.flatMap(fc=>(fc.features||[]).map(f=>{
          const elev=parseFloat(f.properties?.cd_numero_isovalor);
          const relH=isNaN(elev)?0:Math.max(0,elev-datum);
          return{
            type:'Feature',
            geometry:f.geometry,
            properties:{
              cd_numero_isovalor:f.properties?.cd_numero_isovalor,
              _baseHeight:relH,
              baseHeight:relH,
              height:0,
            }
          };
        }));
        lg('info',`Importando ${rawSections.length} curvas como raw sections (baseHeight por cota)...`);
        const r=await rpc.invoke('importRawSections',[rawSections]);
        const n=Array.isArray(r)?r.length:rawSections.length;
        lg('ok',`✓ ${n} curvas importadas no layer ativo (baseHeight por elevação)`);
      }
    }catch(e){
      lg('err',`Importação ${mode}: ${e.message}`);
    }
  };

  // ─── Fixar categoria: envia triângulos para a layer ATIVA no Giraffe ───
  // O usuário ativa a camada desejada no painel do Giraffe antes de clicar.
  // createRawSections roteia automaticamente para a layer ativa.
  // Sem layerId, createDrawingLayer ou qualquer automação de camadas.
  const doFixarCat=async(cat)=>{
    if(fixBusy||!hasTin) return;
    const fc=cat==='Terreno'?tin:splitFcs?.[cat];
    if(!fc?.features?.length){lg('warn',`${cat}: sem dados`);return;}
    setFixBusy(true);setPhase('patch');setPct(0);
    try{
      const valid=fc.features.filter(f=>{
        const r=f.geometry.coordinates[0];
        if(!r||r.length<4) return false;
        const[[ax,ay],[bx,by],[cx,cy]]=r;
        return[ax,ay,bx,by,cx,cy].every(Number.isFinite)
          &&Math.abs((bx-ax)*(cy-ay)-(cx-ax)*(by-ay))>1e-12;
      });
      if(!valid.length){lg('warn',`${cat}: sem triângulos válidos`);return;}
      const allH=valid.flatMap(f=>f.geometry.coordinates[0].slice(0,3).map(v=>v[2]||0));
      lg('info',`${cat}: ${valid.length} tri | Z ${Math.min(...allH).toFixed(2)}–${Math.max(...allH).toFixed(2)}m`);
      setPct(10);

      // Features com layerId:'default' (campo obrigatório pelo SDK interno do Giraffe —
      // sem ele o importRawSections falha com 'cleanedSections undefined').
      // O roteamento para a drawing layer correta é feito pelo painel do Giraffe
      // (a layer que o usuário ativou antes de clicar no botão).
      const plain=valid.map(f=>({
        type:'Feature',geometry:f.geometry,
        properties:{stackOrder:0,layerId:'default'}
      }));
      const imported=await rpc.invoke('importRawSections',[plain]);
      if(!Array.isArray(imported)||!imported.length)
        throw new Error(`${cat}: importRawSections sem retorno`);
      lg('ok',`${cat}: ${imported.length} seções criadas`);
      setPct(55);

      // Patch por vértice via TIN completo (evita triângulos planos)
      const updates=imported.map((imp,i)=>{
        const impR=imp.geometry?.coordinates?.[0];
        const patch=(impR&&impR.length>=3
          ?impR.slice(0,3).map(([iLng,iLat])=>
              parseFloat(getZFromTIN(iLng,iLat,tin.features).toFixed(4)))
          :valid[i].geometry.coordinates[0].slice(0,3).map(v=>
              parseFloat((v[2]||0).toFixed(4)))
        );
        return{properties:{id:imp.properties?.id,patch,patchType:'slab'}};
      });
      const vu=updates.filter(u=>u.properties.id);
      await rpc.invoke('updateRawSections',[vu]);
      setPct(100);
      lg('ok',`${cat}: ✓ ${vu.length} patches aplicados`);
      setPhase('done');
    }catch(e){
      lg('err',`Fixar ${cat}: ${e.message}`);
      setPhase('r_patch');setPct(0);
    }finally{setFixBusy(false);}
  };

  // ─── Drape das camadas urbanas sobre o TIN ──────────────────
  // Fluxo:
  //  1. Baixar Quadras + Calçadas → uniões 2D
  //  2. Calcular 3 polígonos 2D mutuamente exclusivos (intersect/diff)
  //  3. drapeFeature: injetar Z em cada vértice via getZFromTIN,
  //     triangular com Delaunator, filtrar por centróide
  //  4. Publicar 3 camadas temporárias separadas
  const doSplit=async()=>{
    if(!tin||busy||splitBusy) return;
    setSplitBusy(true);
    lg('info','━━ Drape das camadas urbanas sobre o TIN ━━');
    try{
      // 1. Fetch
      lg('info',`Buscando ${QUADRA_LAYER.split(':')[1]} e ${CALCADA_LAYER.split(':')[1]}...`);
      const[qRes,cRes]=await Promise.allSettled([
        fetchWFS(QUADRA_LAYER,...geo.bbox,500,30000),
        fetchWFS(CALCADA_LAYER,...geo.bbox,500,30000),
      ]);
      const qFeatsRaw=qRes.status==='fulfilled'?(qRes.value?.features||[]):[];
      const cFeatsRaw=cRes.status==='fulfilled'?(cRes.value?.features||[]):[];
      if(qRes.status==='rejected') lg('warn',`Quadras: ${(qRes.reason?.message||'err').slice(0,60)}`);
      if(cRes.status==='rejected') lg('warn',`Calçadas: ${(cRes.reason?.message||'err').slice(0,60)}`);
      lg('ok',`Quadras: ${qFeatsRaw.length} · Calçadas: ${cFeatsRaw.length}`);

      // 2. Polígono mãe = buffer do terreno selecionado
      const mae=turf.buffer(
        {type:'Feature',geometry:geo.geom,properties:{}},buf,{units:'meters'}
      );

      // 3. Uniões das camadas
      const buildUnion=feats=>{
        const polys=feats.filter(f=>f?.geometry&&
          ['Polygon','MultiPolygon'].includes(f.geometry.type));
        if(!polys.length) return null;
        let r=polys[0];
        for(let i=1;i<polys.length;i++){try{r=turf.union(r,polys[i]);}catch(_){}}
        return r;
      };
      const qUnion=buildUnion(qFeatsRaw);
      const cUnion=buildUnion(cFeatsRaw);

      // 4. Três polígonos 2D mutuamente exclusivos
      //    quadra2D  = buffer ∩ quadras
      //    calcada2D = buffer ∩ calçadas
      //    rua2D     = buffer − quadras − calçadas
      let quadra2D=null,calcada2D=null;
      let rua2D=mae;

      // Ordem de prioridade: Calçada > Quadra > Rua
      // A calçada do GeoSampa se sobrepõe nativamente à quadra.
      // Para que as três áreas sejam mutuamente exclusivas:
      //   quadra2D  = (buffer ∩ quadras) − calçadas   ← subtrai calçada da quadra
      //   calcada2D =  buffer ∩ calçadas               ← calçada intacta
      //   rua2D     =  buffer − quadras − calçadas     ← exclusão final

      if(qUnion){
        try{
          const qRaw=turf.intersect(mae,qUnion);
          // Subtrai a calçada da quadra para eliminar sobreposição
          quadra2D=cUnion&&qRaw?.geometry
            ?turf.difference(qRaw,cUnion)||qRaw
            :qRaw;
          const df=turf.difference(rua2D,qUnion);
          if(df?.geometry) rua2D=df;
        }catch(e){lg('warn',`Quadra 2D: ${e.message.slice(0,60)}`);}
      }
      if(cUnion){
        try{
          calcada2D=turf.intersect(mae,cUnion);
          const df=turf.difference(rua2D,cUnion);
          if(df?.geometry) rua2D=df;
        }catch(e){lg('warn',`Calçada 2D: ${e.message.slice(0,60)}`);}
      }
      lg('ok',`Polígonos 2D (sem sobreposição): Quadra=${quadra2D?.geometry?.type||'∅'} · Calçada=${calcada2D?.geometry?.type||'∅'} · Rua=${rua2D?.geometry?.type||'?'}`);

      // 5. Preparar pontos das curvas com Z relativo ao datum
      //    Esses pontos têm a elevação EXATA de cada curva — são a fonte de
      //    verdade do terreno. Ao passá-los para drapeFeature, o interior de
      //    cada polígono triangula com o relevo real, não apenas interpolação
      //    linear entre os vértices do polígono.
      const datum=stats.datum;
      const ptsPerLine=res===1?20:res===2?80:500;
      // Pontos das curvas para triangulação interna:
      // Usa TODOS os vértices originais (step=1) independente do res.
      // O res controla a densidade do TIN inicial (doCalc), mas aqui
      // queremos máxima fidelidade às curvas de nível para o drape.
      const rawCPts=samplePoints(fcs,Number.MAX_SAFE_INTEGER); // step=1 → todos os pontos
      const contourPtsRel=rawCPts
        .filter(p=>{try{return turf.booleanPointInPolygon([p.lng,p.lat],mae);}catch(_){return false;}})
        .map(p=>({lng:p.lng,lat:p.lat,z:Math.max(0,p.elev-datum)}));
      lg('ok',`${contourPtsRel.length} pontos de curva (resolução ${['','Normal','Alta','Máxima'][res]}) incluídos na triangulação`);

      // 6. Importar Delaunator e fazer drape de cada polígono
      const{default:Delaunator}=await import('https://esm.sh/delaunator@5.0.0');
      const STEP=2/111320; // ~2m em graus (era 5m — reduzido para mais resolução nas bordas)

      const mkFC=feats=>({type:'FeatureCollection',features:feats});

      lg('info','Injetando Z e triangulando Quadra...');
      const qF=quadra2D?drapeFeature(quadra2D,tin.features,'Quadra',STEP,Delaunator,contourPtsRel):[];
      lg('ok',`Quadra: ${qF.length} triângulos`);

      lg('info','Injetando Z e triangulando Calçada...');
      const cF=calcada2D?drapeFeature(calcada2D,tin.features,'Calçada',STEP,Delaunator,contourPtsRel):[];
      lg('ok',`Calçada: ${cF.length} triângulos`);

      lg('info','Injetando Z e triangulando Rua (polígono com buracos)...');
      const rF=drapeFeature(rua2D,tin.features,'Rua',STEP,Delaunator,contourPtsRel);
      lg('ok',`Rua: ${rF.length} triângulos`);

      if(!qF.length&&!cF.length&&!rF.length)
        throw new Error('Nenhum triângulo gerado — verifique as camadas');

      const result={Quadra:mkFC(qF),Calçada:mkFC(cF),Rua:mkFC(rF)};
      const counts=Object.entries(result).map(([k,v])=>`${v.features.length} ${k}`).join(' · ');
      lg('ok',`Total: ${counts}`);

      // 6. Publicar 3 camadas temporárias
      try{await rpc.invoke('removeTempLayer',[PREVIEW_ID]);}catch(_){}
      for(const[cat,fc] of Object.entries(result)){
        const id=SPLIT_IDS[cat];
        try{await rpc.invoke('removeTempLayer',[id]);}catch(_){}
        if(fc.features.length){
          await rpc.invoke('addTempLayerGeoJSON',[id,JSON.parse(JSON.stringify(fc)),{
            type:'fill-extrusion',
            paint:{
              'fill-extrusion-color':SPLIT_COLORS[cat],
              'fill-extrusion-height':['get','avgH'],
              'fill-extrusion-base':0,'fill-extrusion-opacity':0.92,
            }
          }]);
        }
      }
      setSplitFcs(result);
      setSplitVis({Quadra:true,Calçada:true,Rua:true});
      lg('ok','✓ 3 camadas publicadas. Clique nos botões para ocultar/mostrar cada uso.');
    }catch(e){
      lg('err',`Drape: ${e.message}`);
    }finally{
      setSplitBusy(false);
    }
  };

  const toggleSplitLayer=async(cat)=>{
    if(!splitFcs) return;
    const nv={...splitVis,[cat]:!splitVis[cat]};
    setSplitVis(nv);
    const id=SPLIT_IDS[cat];
    if(!nv[cat]){try{await rpc.invoke('removeTempLayer',[id]);}catch(_){}}
    else{
      const fc=splitFcs[cat];
      if(fc?.features?.length){
        try{await rpc.invoke('removeTempLayer',[id]);}catch(_){}
        await rpc.invoke('addTempLayerGeoJSON',[id,JSON.parse(JSON.stringify(fc)),{
          type:'fill-extrusion',
          paint:{
            'fill-extrusion-color':SPLIT_COLORS[cat],
            'fill-extrusion-height':['get','avgH'],
            'fill-extrusion-base':0,'fill-extrusion-opacity':0.92,
          }
        }]);
      }
    }
  };

  // ─── Limpar ─────────────────────────────────────────────────
  const doClear=async()=>{
    try{await rpc.invoke('removeTempLayer',[PREVIEW_ID]);}catch(_){}
    try{await rpc.invoke('removeTempLayer',[CURVAS_TEMP_ID]);}catch(_){}
    for(const id of Object.values(SPLIT_IDS)){
      try{await rpc.invoke('removeTempLayer',[id]);}catch(_){}
    }
    setGeo(null);setScan({});setFcs(null);setTin(null);
    setSplitFcs(null);setSplitVis({Quadra:true,Calçada:true,Rua:true});setSplitBusy(false);
    setPhase('idle');setPct(0);setStats(null);setLogs([]);
  };

  const hasGeo=!!geo;
  const hasFnd=Object.values(scan).some(v=>v==='found');
  const hasFcs=!!fcs;
  const hasTin=!!tin;
  const canScan=hasGeo&&!busy&&['r_scan','r_gen','r_patch','done'].includes(phase);
  const canGen=hasGeo&&hasFnd&&!busy&&['r_gen','r_patch','done'].includes(phase);
  const canImport=hasFcs&&!busy&&['r_patch','done'].includes(phase);
  const canPatch=hasTin&&!busy&&['r_patch','done'].includes(phase);
  const isCalc=['fetch','tin'].includes(phase);

  return h('div',{style:{display:'flex',flexDirection:'column',height:'100%',padding:'9px',gap:'6px',overflow:'hidden'}},

    // Header (logo e título ficam na casca; aqui só a ação de limpar)
    hasGeo&&h('div',{style:{display:'flex',justifyContent:'flex-end'}},
      h('button',{className:'btn btn-sm',onClick:doClear,disabled:busy},'✕ limpar')
    ),

    // Config
    h('div',{className:'card'},
      h('div',{style:{display:'flex',gap:'5px',alignItems:'center',marginBottom:'6px'}},
        h('span',{style:{fontSize:'10px',color:'var(--md-sys-color-on-surface-variant)',width:'36px',flexShrink:0}},'Proxy'),
        h('input',{className:'fld',style:{flex:1},placeholder:'https://…workers.dev',value:proxy,onChange:e=>sp(e.target.value)})
      ),
      h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
        h('span',{style:{fontSize:'10px',color:'var(--md-sys-color-on-surface-variant)',width:'36px',flexShrink:0}},'Buffer'),
        h('input',{type:'range',min:25,max:500,step:25,value:buf,
          disabled:hasGeo,onChange:e=>setBuf(Number(e.target.value))}),
        h('span',{style:{fontSize:'11px',color:'var(--md-sys-color-primary)',fontWeight:600,minWidth:'46px',textAlign:'right'}},`${buf} m`)
      ),
      h('div',{style:{display:'flex',alignItems:'center',gap:'6px'}},
        h('span',{style:{fontSize:'10px',color:'var(--md-sys-color-on-surface-variant)',width:'36px',flexShrink:0}},'Resolução'),
        ...[['Normal',1,'≈20 pts',' — rápido'],['Alta',2,'≈80 pts',' — recomendado'],['Máxima',3,'≈500 pts',' — lento']].map(([label,v,sub])=>
          h('button',{key:v,onClick:()=>setRes(v),disabled:busy,
            style:{
              flex:1,padding:'3px 2px',borderRadius:'0',
              fontSize:'10px',cursor:'pointer',border:'1px solid',
              fontFamily:'inherit',lineHeight:1.3,
              background:res===v?'var(--md-sys-color-primary-container)':'transparent',
              color:res===v?'var(--md-sys-color-primary)':'var(--md-sys-color-on-surface-variant)',
              borderColor:res===v?'var(--md-sys-color-primary)':'var(--md-sys-color-outline-variant)',
              fontWeight:res===v?700:400,
            }},
            h('div',null,label),
            h('div',{style:{fontSize:'8px',opacity:.7}},sub)
          )
        )
      )
    ),

    // Passo 1
    h('div',{className:'card'},
      h('div',{style:{display:'flex',alignItems:'center',gap:'7px',marginBottom:'6px'}},
        h('span',{className:bdg(['idle','sel'])},'1'),
        h('span',{style:{fontSize:'11px',fontWeight:600}},'Selecionar Terreno')
      ),
      hasGeo
        ?h('p',{style:{fontSize:'10px',color:'var(--md-extended-color-custom-color1-color)'}},`✓  Polígono selecionado — buffer ${buf} m`)
        :h('button',{className:'btn btn-pri',style:{width:'100%'},onClick:doSel,disabled:busy||!proxy.trim()},
            phase==='sel'?'⏳ Aguardando clique...':'🖱 Clicar em um polígono no mapa')
    ),

    // Passo 2
    h('div',{className:'card'},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:'7px'}},
          h('span',{className:bdg(['r_scan','scan'])},'2'),
          h('span',{style:{fontSize:'11px',fontWeight:600}},'Escanear Camadas')
        ),
        h('button',{className:'btn btn-out',style:{fontSize:'10px',padding:'3px 9px'},onClick:doScan,disabled:!canScan},
          phase==='scan'?'⏳':'⚡ Escanear')
      ),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'3px',marginBottom:phase==='scan'?'5px':'0'}},
        ...LAYERS.map(L=>{
          const s=scan[L.id];
          return h('div',{key:L.id,className:`chip ${!s?'ch-p':s==='found'?'ch-f':'ch-e'}`},
            h('span',{style:{fontSize:'9px',fontWeight:500,color:s==='found'?L.col:'var(--md-sys-color-outline)'}},L.lb),
            h('span',{style:{fontSize:'9px',color:'var(--md-sys-color-on-surface-variant)'}},!s?'—':s==='found'?'✓':s==='empty'?'∅':'✗')
          );
        })
      ),
      phase==='scan'&&h('div',{className:'pb'},h('div',{className:'pf',style:{width:`${pct}%`}}))
    ),

    // Passo 3 — Terreno + Download
    h('div',{className:'card',style:{flex:'1 1 auto',display:'flex',flexDirection:'column',overflow:'hidden'}},
      // Linha do título
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px',flexShrink:0}},
        h('div',{style:{display:'flex',alignItems:'center',gap:'7px'}},
          h('span',{className:bdg(['r_gen','fetch','tin','r_patch','patch'])},'3'),

const DEG=Math.PI/180;
const M_PER_DEG_LAT=111320;

// ══════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════
//  Utilitários geométricos
// ══════════════════════════════════════════════════════════════

// rawSections chega como array, {features:[]} ou objeto com chaves numéricas.
function normSections(rs){
  if(!rs) return[];
  if(Array.isArray(rs)) return rs.filter(f=>f&&f.geometry);
  if(Array.isArray(rs.features)) return rs.features.filter(f=>f&&f.geometry);
  if(typeof rs==='object') return Object.values(rs).filter(f=>f&&f.geometry);
  return[];
}
function linhasOf(g){
  if(!g) return[];
  if(g.type==='LineString') return[g.coordinates];
  if(g.type==='MultiLineString') return g.coordinates;
  return[];
}
function isPoly(f){return['Polygon','MultiPolygon'].includes(f?.geometry?.type);}
function fid(f){return f?.properties?.id??f?.id??null;}

// Insere vértices intermediários a cada stepDeg graus (adensamento de anel).
function densifyRing(ring,stepDeg){
  if(!ring||ring.length<3) return ring||[];
  const out=[];
  for(let i=0;i<ring.length-1;i++){
    const p1=ring[i],p2=ring[i+1];
    out.push(p1);
    const d=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    if(d>stepDeg){
      const n=Math.ceil(d/stepDeg);
      for(let j=1;j<n;j++){
        const t=j/n;
        out.push([p1[0]+t*(p2[0]-p1[0]),p1[1]+t*(p2[1]-p1[1])]);
      }
    }
  }
  if(out.length) out.push(out[0]);
  return out;
}

function unionOf(feats){
  const polys=(feats||[])
    .filter(isPoly)
    .map(f=>({type:'Feature',properties:{},geometry:f.geometry}));
  if(!polys.length) return null;
  let r=polys[0];
  for(let i=1;i<polys.length;i++){
    try{const u=turf.union(r,polys[i]);if(u&&u.geometry) r=u;}catch(_){}
  }
  return r;
}

// ══════════════════════════════════════════════════════════════
//  Propagação de cotas por continuidade
//
//  Diferença estrutural em relação ao app GeoSampa de referência: lá TODA
//  curva chega com a cota pronta no campo cd_numero_isovalor. Aqui só recebem
//  cota as curvas fisicamente atravessadas pela linha de corte. Uma curva
//  desenhada em vários trechos, ou fora do alcance da guia, fica sem cota e
//  some do TIN — o que abre buracos grandes e joga a interpolação no vizinho
//  mais próximo, produzindo alturas sem lógica.
//
//  Esta função fecha a lacuna: um trecho sem cota cuja extremidade encosta
//  (dentro da tolerância) na extremidade de um trecho já cotado herda a mesma
//  cota. A propagação é transitiva — trecho A cotado → B → C.
// ══════════════════════════════════════════════════════════════
function extremidadesDe(f){
  const out=[];
  for(const p of linhasOf(f?.geometry)){
    if(!p||p.length<2) continue;
    const a=p[0],b=p[p.length-1];
    out.push([Number(a[0]),Number(a[1])],[Number(b[0]),Number(b[1])]);
  }
  return out.filter(c=>isFinite(c[0])&&isFinite(c[1]));
}
function propagarCotas(cotadas,todasLinhas,tolM){
  const ids=new Set(cotadas.map(x=>x.id).filter(v=>v!==null&&v!==undefined).map(String));
  let fila=(todasLinhas||[])
    .filter(f=>{const i=fid(f);return i===null||i===undefined||!ids.has(String(i));})
    .map(f=>({f,ends:extremidadesDe(f)}))
    .filter(o=>o.ends.length);
  if(!fila.length||!cotadas.length) return{novos:[],restantes:fila.length,iter:0};
  const primeira=linhasOf(cotadas[0]?.feat?.geometry)[0];
  const latRef=primeira?.[0]?.[1];
  const kLng=Math.cos((isFinite(latRef)?latRef:-23.5)*DEG);
  const perto=(a,b)=>{
    const dx=(a[0]-b[0])*kLng,dy=a[1]-b[1];
    return Math.hypot(dx,dy)*M_PER_DEG_LAT<=tolM;
  };
  const conhecidos=cotadas.map(x=>({cota:x.cota,ends:extremidadesDe(x.feat)}));
  const novos=[];
  let mudou=true,iter=0;
  while(mudou&&iter++<40){
    mudou=false;
    const resta=[];
    for(const p of fila){
      let cota=null;
      for(const c of conhecidos){
        for(const e1 of p.ends){
          for(const e2 of c.ends){if(perto(e1,e2)){cota=c.cota;break;}}
          if(cota!==null) break;
        }
        if(cota!==null) break;
      }
      if(cota!==null){
        novos.push({id:fid(p.f),feat:p.f,cota,dist:null,nInter:0,herdada:true});
        conhecidos.push({cota,ends:p.ends});
        mudou=true;
      }else resta.push(p);
    }
    fila=resta;
  }
  return{novos,restantes:fila.length,iter};
}

// Encadeia várias linhas abertas num anel único, ligando sempre as pontas
// mais próximas. É o que transforma as DUAS BORDAS de uma calçada ou de uma
// rua na faixa entre elas, em vez de fechar cada borda sobre si mesma e
// produzir dois slivers degenerados.
// Encadeia várias linhas abertas num anel único, ligando sempre as pontas
// mais próximas. É o que transforma as DUAS BORDAS de uma calçada ou de uma
// rua na faixa entre elas, em vez de fechar cada borda sobre si mesma e
// produzir dois slivers degenerados.
function encadearLinhas(linhas){
  const rest=linhas.map(l=>l.slice()).filter(l=>l.length>=2);
  if(!rest.length) return null;
  let chain=rest.shift();
  while(rest.length){
    const tail=chain[chain.length-1];
    let melhor=-1,dMin=Infinity,inverter=false;
    for(let i=0;i<rest.length;i++){
      const L=rest[i];
      const a=L[0],b=L[L.length-1];
      const d0=(tail[0]-a[0])**2+(tail[1]-a[1])**2;
      const d1=(tail[0]-b[0])**2+(tail[1]-b[1])**2;
      if(d0<dMin){dMin=d0;melhor=i;inverter=false;}
      if(d1<dMin){dMin=d1;melhor=i;inverter=true;}
    }
    if(melhor<0) break;
    const L=rest.splice(melhor,1)[0];
    chain=chain.concat(inverter?L.slice().reverse():L);
  }
  const a=chain[0],b=chain[chain.length-1];
  if(Math.abs(a[0]-b[0])>1e-12||Math.abs(a[1]-b[1])>1e-12) chain.push([a[0],a[1]]);
  return chain.length>=4?chain:null;
}

// Conta autointerseções de um anel — sinal direto de encadeamento errado.
function contarKinks(ring){
  try{
    const k=turf.kinks(turf.polygon([ring]));
    return k?.features?.length||0;
  }catch(_){return 0;}
}

// Compacidade isoperimétrica: 4πA/P². Círculo = 1, quadrado = 0,79,
// faixa legítima de 3 × 75 m ≈ 0,12, linha fechada sobre si mesma ≈ 0,01.
// Melhor que a razão com a bbox, que penalizaria uma rua na diagonal.
function razaoSliver(geom){
  try{
    const f={type:'Feature',properties:{},geometry:geom};
    const a=turf.area(f);
    const p=turf.length(turf.polygonToLine(f),{units:'meters'});
    return p>0?(4*Math.PI*a)/(p*p):0;
  }catch(_){return 1;}
}

// ══════════════════════════════════════════════════════════════
//  Coerência das cotas atribuídas
//
//  A cota de cada curva vem da linha de corte (aninhamento) ou é herdada por
//  continuidade. Os dois caminhos podem errar: a guia pode reiniciar a
//  contagem ao sair de um morro, e a herança pode saltar para outra curva
//  cujas pontas apenas passam perto. Uma curva com cota errada não estraga o
//  TIN inteiro — ela é minoria entre milhares de pontos —, mas injeta o valor
//  exato dela em todo lugar onde cruza a rua ou a calçada, e ali abre uma
//  vala.
//
//  O teste é geométrico: a curva vizinha mais próxima de qualquer curva deve
//  estar a UM degrau de cota. Se a vizinha mais próxima estiver muitos
//  degraus acima ou abaixo, a cota desta curva não fecha com o desenho.
// ══════════════════════════════════════════════════════════════
function validarCotas(lista,passo,limiteDegraus){
  const pts=[];
  lista.forEach((it,i)=>{
    for(const ln of linhasOf(it.feat?.geometry)){
      if(!ln||ln.length<2) continue;
      for(const c of densificarLinha(ln,5/M_PER_DEG_LAT)) pts.push({x:c[0],y:c[1],z:it.cota,i});
    }
  });
  if(pts.length<4) return[];
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of pts){
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  }
  const cell=Math.max((maxX-minX)/120,(maxY-minY)/120,2e-6);
  const grid=new Map();
  pts.forEach((p,k)=>{
    const key=Math.floor((p.x-minX)/cell)+':'+Math.floor((p.y-minY)/cell);
    let a=grid.get(key);
    if(!a){a=[];grid.set(key,a);}
    a.push(k);
  });
  const Rmax=Math.min(150,Math.ceil(Math.max(maxX-minX,maxY-minY)/cell)+2);
  // Menor diferença de cota entre este ponto e as TRÊS curvas vizinhas mais
  // próximas. Olhar só a vizinha mais próxima é frágil: se ela também estiver
  // errada, a curva certa é que aparece como culpada. Uma curva bem cotada
  // encosta em alguma vizinha a um degrau; uma curva errada fica longe de
  // todas.
  const vizinhancaDe=(p)=>{
    const i0=Math.floor((p.x-minX)/cell),j0=Math.floor((p.y-minY)/cell);
    const maisProx=new Map();          // curva → distância
    for(let R=0;R<=Rmax;R++){
      const visitar=(ci,cj)=>{
        const a=grid.get(ci+':'+cj);
        if(!a) return;
        for(const k of a){
          const q=pts[k];
          if(q.i===p.i) continue;
          const d=Math.hypot(p.x-q.x,p.y-q.y);
          const cur=maisProx.get(q.i);
          if(cur===undefined||d<cur.d) maisProx.set(q.i,{d,z:q.z});
        }
      };
      if(R===0) visitar(i0,j0);
      else{
        for(let d=-R;d<=R;d++){visitar(i0+d,j0-R);visitar(i0+d,j0+R);}
        for(let d=-R+1;d<=R-1;d++){visitar(i0-R,j0+d);visitar(i0+R,j0+d);}
      }
      if(maisProx.size>=3) break;
    }
    if(!maisProx.size) return null;
    const cand=[...maisProx.values()].sort((a,b)=>a.d-b.d).slice(0,3);
    let menor=Infinity,zPerto=cand[0].z;
    for(const c of cand) menor=Math.min(menor,Math.abs(p.z-c.z));
    return isFinite(menor)?{salto:menor,zViz:zPerto}:null;
  };
  const porCurva=new Map();
  const vizPorCurva=new Map();
  for(const p of pts){
    const r=vizinhancaDe(p);
    if(r===null) continue;
    let a=porCurva.get(p.i);
    if(!a){a=[];porCurva.set(p.i,a);}
    a.push(r.salto/(passo||1));
    let b=vizPorCurva.get(p.i);
    if(!b){b=[];vizPorCurva.set(p.i,b);}
    b.push(r.zViz);
  }
  const lim=limiteDegraus===undefined?2.5:limiteDegraus;
  const suspeitas=[];
  for(const[i,ds]of porCurva){
    if(!ds.length) continue;
    ds.sort((a,b)=>a-b);
    const med=ds[ds.length>>1];
    if(med>lim){
      const vs=(vizPorCurva.get(i)||[]).slice().sort((a,b)=>a-b);
      const zViz=vs.length?vs[vs.length>>1]:null;
      suspeitas.push({i,mediana:med,n:ds.length,cota:lista[i]?.cota,
        id:lista[i]?.id??null,zViz,
        sugerida:zViz===null?null:Number(zViz.toFixed(3))});
    }
  }
  suspeitas.sort((a,b)=>b.mediana-a.mediana);
  return suspeitas;
}

// Converte feições selecionadas em polígonos utilizáveis como perímetro.
