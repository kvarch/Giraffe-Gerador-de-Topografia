      // 1. LIMITE MESTRE — a Área Total contém todas as demais camadas.
      //    Tudo é recortado por ela e o TIN nunca extrapola esse contorno.
      let limite=perims.area?.length?unionOf(perims.area):null;
      let semArea=false;
      if(!limite){
        semArea=true;
        limite=unionOf(SUB_USOS.flatMap(k=>perims[k]||[]));
        if(!limite) throw new Error('Defina o perímetro da Área Total.');
        lg('warn','Área Total não definida — usando a união das demais camadas como limite.');
      }
      let aLim=0;
      try{aLim=turf.area(limite);}catch(_){}
      lg('ok','Limite da área: '+aLim.toLocaleString('pt-BR',{maximumFractionDigits:0})+' m²');

      // 2. Pontos cotados das curvas, recortados ao limite + margem de suporte.
      //    A margem garante que os vértices do PERÍMETRO caiam dentro da
      //    cobertura do TIN e recebam Z por interpolação baricêntrica exata,
      //    em vez do fallback de vizinho mais próximo (que distorce a borda).
      const marg=Math.max(0,Number(margem)||0);
      let limBuf=limite;
      if(marg>0){
        try{const b=turf.buffer(limite,marg,{units:'meters'});if(b?.geometry) limBuf=b;}catch(_){}
      }
      // Densificação MÉTRICA das curvas: insere vértices intermediários a cada
      // `dens` metros. O controle antigo só reduzia a amostragem, então uma
      // curva reta de 2 vértices entregava 2 pontos por mais alta que fosse a
      // densidade escolhida.
      const passoDeg=Math.max(0.5,Number(dens)||5)/M_PER_DEG_LAT;
      // Curvas com cota incoerente envenenam os nós de cruzamento: onde
      // cruzam a rua, injetam a cota errada e abrem uma vala. Fora.
      const susIdx=new Set();
      if(excluirSuspeitas){
        for(const x of validarCotas(hits,passo,2.5)) susIdx.add(x.i);
        if(susIdx.size){
          const det=validarCotas(hits,passo,2.5);
          lg('warn',susIdx.size+' curva(s) com cota incoerente excluída(s) do TIN e dos cruzamentos:');
          for(const x of det.slice(0,10))
            lg('warn','   '+(x.id?String(x.id).slice(0,8):'sem id')+' · cota '+x.cota
              +' m → vizinhas ~'+(x.sugerida===null?'?':x.sugerida)+' m');
          if(det.length>10) lg('warn','   … e mais '+(det.length-10)+'.');
          lg('info','Confira esses ids no desenho antes de refazer qualquer coisa.');
        }
      }
      const usadas=hits.filter((x,i)=>!susIdx.has(i));
      const brutos=[];
      let vertOrig=0;
      for(const it of usadas){
        for(const ln of linhasOf(it.feat.geometry)){
          if(!ln||ln.length<2) continue;
          vertOrig+=ln.length;
          for(const c of densificarLinha(ln,passoDeg)) brutos.push({lng:c[0],lat:c[1],z:it.cota});
        }
      }
      lg('info','Curvas densificadas a cada '+dens+' m: '+vertOrig+' vértices desenhados → '
        +brutos.length+' pontos.');
      const cPts=brutos.filter(p=>{
        try{return turf.booleanPointInPolygon([p.lng,p.lat],limBuf);}catch(_){return false;}
      });
      lg('info','Clip ao limite + '+marg+' m de margem: '+brutos.length+' → '+cPts.length+' pontos');
      if(cPts.length<8) throw new Error('Apenas '+cPts.length+' pontos cotados dentro do limite — aumente a margem ou a densidade.');
      const zs=cPts.map(p=>p.z);
      const zMin=Math.min(...zs),zMax=Math.max(...zs);
      const conflitos=hits.filter(x=>x.id&&perimIdsRef.current.has(String(x.id)));
      if(conflitos.length) throw new Error(conflitos.length+' curva(s) cotada(s) são na verdade contornos de '
        +'Calçada/Rua/Terreno. Volte à aba Guia e clique em Detectar curvas interceptadas de novo.');
      lg('ok',cPts.length+' pontos cotados · Z '+zMin+' → '+zMax+' m');
      setPct(15);

      // 3. TIN global (superfície de referência para o drape)
      const espDeg=estimarEspacamentoEntreCurvas(cPts,200);
      const espM=espDeg*M_PER_DEG_LAT;
      lg('info','Espaçamento medido entre curvas vizinhas: '+espM.toFixed(1)+' m.');
      lg('info','Triangulando TIN global (Delaunay)...');
      const tinG=await buildTIN(cPts,espDeg*3);
      if(!tinG.features.length) throw new Error('TIN global sem triângulos válidos');
      lg('ok','TIN global: '+tinG.features.length+' triângulos');
      const idx=buildTinIndex(tinG.features);
      tinGlobalRef.current=idx;
      // Interpolador por proporção — usado sempre que o TIN não cobrir o ponto
      _INTERP=criarInterpolador(cPts);
      _MODO_COTA=modoCota;
      _CORRIGIR_PLANOS=corrigirPlanos;
      if(idx?.nPlanos){
        const pctP=Math.round(idx.nPlanos/tinG.features.length*100);
        lg('info',idx.nPlanos+' de '+tinG.features.length+' triângulos do TIN ('
          +pctP+'%) têm os três vértices na mesma curva'
          +(corrigirPlanos?' — ignorados na interpolação (modo experimental).':'.'));
      }
      lg('info','Interpolador por proporção pronto: '+(_INTERP?.ncotas||0)+' cotas distintas.');
      setPct(35);

      // 4. Sub-camadas recortadas ao limite e, opcionalmente, entre si
      const ordemPri=prioridade.filter(k=>SUB_USOS.includes(k));
      const clipped={};
      for(const k of ordemPri){
        if(!perims[k]?.length) continue;
        const u=unionOf(perims[k]);
        if(!u) continue;
        let g=u;
        try{const it=turf.intersect(limite,u);g=it?.geometry?it:null;}
        catch(e){lg('warn',k+': interseção com o limite falhou — usando polígono original');}
        if(!g){lg('warn',(USOS.find(x=>x.k===k)||{}).lb+': fora do limite da Área Total — ignorada.');continue;}
        clipped[k]=g;
      }
      if(exclusivo){
        const acum=[];
        for(const k of ordemPri){
          if(!clipped[k]) continue;
          let g=clipped[k];
          const orig=clipped[k];
          for(const prev of acum){
            if(!g) break;
            // difference retorna null quando o resultado é VAZIO — a camada
            // foi totalmente absorvida pela de prioridade maior e é removida.
            try{const df=turf.difference(g,prev);g=df?.geometry?df:null;}catch(_){}
          }
          if(g) clipped[k]=g;
          else{
            delete clipped[k];
            lg('err','⚠ '+(USOS.find(x=>x.k===k)||{}).lb+': totalmente coberta por camada de prioridade maior — REMOVIDA. '
              +'Reordene a prioridade na aba Perímetros para que ela venha antes.');
          }
          acum.push(orig);
        }
        const seq=ordemPri.filter(k=>clipped[k]).map(k=>(USOS.find(x=>x.k===k)||{}).lb);
        if(seq.length) lg('info','Recorte por prioridade: '+seq.join(' › '));
      }
      // 5. Resíduo do limite = Área Total menos tudo o que já foi coberto
      let resid=limite;
      for(const k of ordemPri){
        if(!clipped[k]||!resid) continue;
        try{const df=turf.difference(resid,clipped[k]);resid=df?.geometry?df:null;}catch(_){}
      }
      let aResid=0;
      try{aResid=resid?turf.area(resid):0;}catch(_){}
      const finais={};
      for(const k of ordemPri) if(clipped[k]) finais[k]=clipped[k];
      if(!semArea&&resid&&aResid>Math.max(1,aLim*0.001)) finais.area=resid;
      if(!semArea) lg('info','Resíduo da Área Total: '+aResid.toLocaleString('pt-BR',{maximumFractionDigits:0})+' m²');
      const ordem=USOS.filter(u=>finais[u.k]);
      if(!ordem.length) throw new Error('Nenhum polígono válido após o recorte pelo limite.');
      setPct(45);

      // 6. Drape + triangulação separada por uso
      const STEP=Math.max(0.5,Number(bordaM)||2)/M_PER_DEG_LAT;   // passo base do contorno
      const optsB={adapt,minM:0.5,tolZ:Math.max(0.005,Number(tolBorda)||0.05)};
      const GAP=6e-4;               // ~67 m de tolerância fora do TIN
      // Segmentos de curva cotados, com bbox pré-calculada, para achar os
      // cruzamentos exatos com os contornos de rua/calçada/terreno.
      const curvasSeg=[];
      for(const it of usadas){
        for(const part of linhasOf(it.feat.geometry)){
          const cs=(part||[]).map(c=>[Number(c[0]),Number(c[1])])
            .filter(c=>isFinite(c[0])&&isFinite(c[1]));
          if(cs.length<2) continue;
          let line;
          try{line=turf.lineString(cs);}catch(_){continue;}
          curvasSeg.push({line,bb:bboxDe(cs),cota:it.cota});
        }
      }
      lg('info',curvasSeg.length+' segmentos de curva preparados para cruzamento com os contornos.');
      const res={};
      let cruzTotal=0,exatoAcc=0,bordaAcc=0,propAcc=0,vizAcc=0,foraAcc=0,adaptAcc=0,planoCAcc=0,planoAcc=0;
      if(conforme){
        lg('info','Malha única conforme — todas as camadas na mesma triangulação...');
        const dc=await drapeConforme(finais,ordem.map(u=>u.k),idx,STEP,cPts,GAP,curvasSeg,limite,optsB);
        for(const u of ordem) res[u.k]=dc.res[u.k]||{type:'FeatureCollection',features:[]};
        cruzTotal=dc.nCruz;
        exatoAcc=dc.nExato;propAcc=dc.nProp;vizAcc=dc.nViz;foraAcc=dc.nFora;
        adaptAcc=dc.nAdapt||0;planoCAcc=dc.nPlanoC||0;planoAcc=dc.nPlano||0;
        bordaAcc=dc.nExato+dc.nProp+dc.nViz+dc.nFora+(dc.nPlano||0)+(dc.nPlanoC||0);
        lg('ok',dc.npts.toLocaleString('pt-BR')+' nós no conjunto único · '+dc.nCruz+' cruzamentos com curvas');
        for(const u of ordem)
          lg(res[u.k].features.length?'ok':'warn','   '+u.lb+': '+res[u.k].features.length+' triângulos');
        setPct(85);
      }else{
        let i=0;
        for(const u of ordem){
          i++;
          lg('info','Drape + TIN · '+u.lb+'...');
          const dr=await drapePolygon(finais[u.k],idx,STEP,cPts,GAP,curvasSeg,optsB);
          cruzTotal+=dr.nCruz;
          res[u.k]={type:'FeatureCollection',features:dr.tris};
          exatoAcc+=dr.nExato;propAcc+=dr.nProp;vizAcc+=dr.nViz;foraAcc+=dr.nFora;
          adaptAcc+=dr.nAdapt||0;planoCAcc+=dr.nPlanoC||0;planoAcc+=dr.nPlano||0;
          bordaAcc+=dr.nExato+dr.nProp+dr.nViz+dr.nFora+(dr.nPlano||0)+(dr.nPlanoC||0);
          lg(dr.tris.length?'ok':'warn',u.lb+': '+dr.tris.length+' triângulos · '+dr.nCruz+' nós de cruzamento');
          setPct(45+Math.round(i/ordem.length*40));
        }
        lg('warn','Malhas independentes: pode haver degrau na divisa entre camadas.');
      }
      if(!cruzTotal) lg('warn','Nenhum cruzamento contorno × curva encontrado — as bordas ficam só com Z interpolado.');
      const pctGlobal=bordaAcc?Math.round(exatoAcc/bordaAcc*100):0;
      // Resumo de origem dos vértices que saíram na cota mínima: diz qual
      // caminho produziu cada zero, sem precisar abrir o GeoJSON.
      for(const u of ordem){
        const fsx=res[u.k]?.features||[];
        const cont={};
        for(const f of fsx){
          const src=f.properties?.kv_src||'???';
          const zz=[f.properties.ha,f.properties.hb,f.properties.hc];
          for(let q=0;q<3;q++) if(Math.abs(zz[q]-zMin)<1e-6){
            const c=src[q]||'?';cont[c]=(cont[c]||0)+1;
          }
        }
        const tot=Object.values(cont).reduce((a,b)=>a+b,0);
        if(tot>20) lg('warn','   '+u.lb+': '+tot+' vértices na cota mínima · origem '
          +Object.entries(cont).map(([k,v])=>k+'='+v).join(' ')
          +'  (X=cruzamento com curva · C=ponto de curva interno · B=borda · R=refino)');
      }
      lg('info','Vértices de borda: '+exatoAcc+' baricêntricos · '+propAcc+' por proporção entre curvas · '
        +vizAcc+' por vizinho · '+foraAcc+' descartados'
        +(planoCAcc?(' · '+planoCAcc+' salvos de triângulo plano'):'')
        +(planoAcc?(' · '+planoAcc+' presos em triângulo plano'):'')
        +(adaptAcc?(' · '+adaptAcc+' inseridos pelo refino adaptativo'):'')+'.');
      // Vértices grudados no fundo da escala são o sintoma de cota que não
      // resolveu. Contar por camada mostra onde e quanto.
      for(const u of ordem){
        const fs=res[u.k]?.features||[];
        if(!fs.length) continue;
        const zs=fs.flatMap(f=>f.geometry.coordinates[0].slice(0,3).map(v=>v[2]));
        const noFundo=zs.filter(v=>Math.abs(v-zMin)<1e-6).length;
        const pctF=Math.round(noFundo/zs.length*100);
        if(pctF>=5) lg(pctF>=20?'warn':'info','   '+u.lb+': '+noFundo+' de '+zs.length
          +' vértices ('+pctF+'%) na cota mínima '+zMin+' m.');
      }
      if(propAcc>exatoAcc) lg('info','A maioria caiu na faixa entre curvas — resolvida por proporção de distância, não por degrau.');
      const total=Object.values(res).reduce((s,fc)=>s+fc.features.length,0);
      if(!total) throw new Error('Nenhum triângulo gerado — verifique perímetros e curvas.');

      // 5. Preview com cores distintas por uso
      for(const u of USOS){
        try{await rpc.invoke('removeTempLayer',[u.id]);}catch(_){}
      }
      for(const u of ordem){
        const fc=res[u.k];
        if(!fc?.features?.length) continue;
        await rpc.invoke('addTempLayerGeoJSON',[u.id,JSON.parse(JSON.stringify(fc)),{
          type:'fill-extrusion',
          paint:{
            'fill-extrusion-color':u.cor,
            'fill-extrusion-height':['get','avgH'],
            'fill-extrusion-base':0,
            'fill-extrusion-opacity':0.92,
          }}]);
      }
      setTins(res);
      setVis({terreno:true,area:true,calcada:true,rua:true});
      setStats({zMin,zMax,dnivel:Number((zMax-zMin).toFixed(2)),npts:cPts.length,
        ntriG:tinG.features.length,ntri:total,aLim,semArea,ncruz:cruzTotal,
        pctEx:bordaAcc?Math.round((exatoAcc+propAcc)/bordaAcc*100):0,nprop:propAcc,
        nherd:hits.filter(x=>x.herdada).length,ncot:hits.length});
      setPct(100);
      lg('ok','✓ Preview publicado — '+total+' triângulos em '+ordem.length+' camada(s).');
      setTab(2);
    }catch(e){lg('err','TIN: '+e.message);}
    finally{setBusy('');}
  };

  const toggleVis=async(k)=>{
    if(!tins?.[k]) return;
    const nv={...vis,[k]:!vis[k]};
    setVis(nv);
    const u=USOS.find(x=>x.k===k);
    if(!nv[k]){try{await rpc.invoke('removeTempLayer',[u.id]);}catch(_){}return;}
    try{await rpc.invoke('removeTempLayer',[u.id]);}catch(_){}
    await rpc.invoke('addTempLayerGeoJSON',[u.id,JSON.parse(JSON.stringify(tins[k])),{
      type:'fill-extrusion',
      paint:{'fill-extrusion-color':u.cor,'fill-extrusion-height':['get','avgH'],
        'fill-extrusion-base':0,'fill-extrusion-opacity':0.92}}]);
  };

  // ── Fixar camada no Giraffe (importRawSections + patch slab) ──
  const doFixar=async(k)=>{
    const fc=tins?.[k];
    if(!fc?.features?.length){lg('warn','Sem triângulos para fixar.');return;}
    const u=USOS.find(x=>x.k===k);
    setBusy('fix-'+k);setPct(0);
    try{
      const valid=fc.features.filter(f=>{
        const r=f.geometry.coordinates[0];
        if(!r||r.length<4) return false;
        const[a,b,c]=r;
        return[a[0],a[1],b[0],b[1],c[0],c[1]].every(Number.isFinite)
          &&Math.abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]))>1e-12;
      });
      if(!valid.length) throw new Error('Sem triângulos válidos');
      const allH=valid.flatMap(f=>f.geometry.coordinates[0].slice(0,3).map(v=>v[2]||0));
      lg('info',u.lb+': '+valid.length+' tri | Z '+Math.min(...allH).toFixed(2)+'–'+Math.max(...allH).toFixed(2)+' m');
      // Camada de destino: uma por uso do solo, quando solicitado.
      const alvo=separarLayers?((layerNomes[k]||'').trim()||'default'):'default';
      const cor=(coresAplic[k]||CORES_APLICADAS[k]||'#cccccc');
      const estilo={color:cor,fillOpacity:1,stroke:cor,strokeOpacity:0};
      const secoes=(lid)=>valid.map(f=>({type:'Feature',geometry:f.geometry,
        properties:{stackOrder:0,layerId:lid,kv_uso:u.lb,...estilo}}));
      let imported=null,usada=alvo;
      try{
        imported=await rpc.invoke('importRawSections',[secoes(alvo)]);
      }catch(e){
        if(alvo==='default') throw e;
        lg('warn',u.lb+': camada "'+alvo+'" recusada pelo Giraffe ('+e.message
          +'). Repetindo na camada ativa.');
        usada='default';
        imported=await rpc.invoke('importRawSections',[secoes('default')]);
      }
      if(!Array.isArray(imported)||!imported.length) throw new Error('importRawSections sem retorno');
      const real=imported[0]?.properties?.layerId;
      lg('info',u.lb+': cor '+cor+' · fillOpacity 1 · strokeOpacity 0');
      lg('ok',u.lb+': '+imported.length+' seções criadas em "'
        +(real!==undefined&&real!==null?real:usada)+'"'
        +(real!==undefined&&real!==null&&String(real)!==String(usada)
          ?' (pedido: "'+usada+'")':''));
      setPct(55);

      // Patch por vértice via TIN global — réplica do doFixarCat da referência.
      // O Z é recalculado a partir das COORDENADAS DEVOLVIDAS pelo Giraffe,
      // com getZFromTIN, que nunca devolve null. A versão anterior tentava
      // casar cada seção importada com o triângulo original pelo índice do
      // array; quando a correspondência falhava o patch saía vazio ou zerado
      // e o triângulo despencava para o chão.
      const gIdx=tinGlobalRef.current;
      if(!gIdx) throw new Error('TIN global ausente — gere o TIN antes de aplicar');
      const updates=[];
      let semGeom=0;
      for(let i=0;i<imported.length;i++){
        const imp=imported[i];
        const id=imp?.properties?.id;
        if(!id) continue;
        const impR=imp?.geometry?.coordinates?.[0];
        let patch;
        if(impR&&impR.length>=3){
          patch=impR.slice(0,3).map(c=>Number(getZFromTIN(gIdx,c[0],c[1]).toFixed(4)));
        }else{
          semGeom++;
          const orig=valid[i]?.geometry?.coordinates?.[0];
          if(!orig||orig.length<3) continue;
          patch=orig.slice(0,3).map(c=>Number(Math.max(0,c[2]||0).toFixed(4)));
        }
        if(patch.length!==3||patch.some(v=>!isFinite(v))) continue;
        updates.push({properties:{id,patch,patchType:'slab',...estilo}});
      }
      if(!updates.length) throw new Error('Nenhuma seção importada retornou id e geometria válidos');
      if(semGeom) lg('warn',u.lb+': '+semGeom+' seções voltaram sem geometria — usado o Z do triângulo original.');
      const pAll=updates.flatMap(x=>x.properties.patch);
      const nulos=updates.filter(x=>x.properties.patch.every(v=>v===0)).length;
      lg('info',u.lb+': patch Z '+Math.min(...pAll).toFixed(2)+'–'+Math.max(...pAll).toFixed(2)+' m'
        +(nulos?(' · '+nulos+' triângulos totalmente em zero'):''));
      if(nulos>updates.length*0.1)
        lg('warn',u.lb+': '+Math.round(nulos/updates.length*100)+'% dos triângulos zerados — o TIN não cobre essa área.');

      setPct(100);
      lg('ok','✓ '+u.lb+': '+updates.length+' patches slab aplicados.');

    if(!ks.length){lg('warn','Nenhuma camada para aplicar.');return;}
    lg('info','━━ Aplicando superfície 3D (patch slab) ━━');
    for(const k of ks) await doFixar(k);
    lg('ok','Concluído. O relevo inclinado aparece nas seções do Giraffe, não no preview colorido.');
  };

  // ── Exportação ───────────────────────────────────────────────
  const doGLB=async()=>{
    if(!tins) return;
    setBusy('glb');
    try{
      const layers=USOS.filter(u=>tins[u.k]?.features?.length)
        .map(u=>({name:u.lb,cor:u.cor,features:tins[u.k].features}));
      if(!layers.length) throw new Error('Nenhuma camada com triângulos');
      const all=layers.flatMap(L=>L.features);
      const bb=turf.bbox({type:'FeatureCollection',features:all});
      const origin=[(bb[0]+bb[2])/2,(bb[1]+bb[3])/2];
      const glb=buildGLB(layers,origin);
      saveBlob(glb,'kv-terreno-'+Date.now()+'.glb','model/gltf-binary');
      lg('ok','GLB gerado: '+layers.length+' materiais · '+(glb.byteLength/1024).toFixed(0)+' KB · origem '+origin[0].toFixed(6)+', '+origin[1].toFixed(6));
    }catch(e){lg('err','GLB: '+e.message);}
    finally{setBusy('');}
  };

        window.open(r,'_blank','noopener');
        lg('ok','Cena 3D exportada — URL aberta em nova aba.');
      }else if(typeof r==='string'){
        saveBlob(r,'giraffe-cena-'+Date.now()+'.gltf','model/gltf+json');
        lg('ok','Cena 3D exportada (GLTF).');
      }else if(r instanceof Blob){
        saveBlob(r,'giraffe-cena-'+Date.now()+'.glb','model/gltf-binary');
        lg('ok','Cena 3D exportada (GLB).');
      }else if(r instanceof ArrayBuffer||ArrayBuffer.isView(r)){
        saveBlob(new Uint8Array(r.buffer||r),'giraffe-cena-'+Date.now()+'.glb','model/gltf-binary');
        lg('ok','Cena 3D exportada (GLB).');
      }else{
        saveBlob(JSON.stringify(r),'giraffe-cena-'+Date.now()+'.gltf','model/gltf+json');

        ),
        h('p',{className:'hint',style:{marginBottom:'10px'}},
          'Distância entre pontos gerados AO LONGO de cada curva. Vértices intermediários são interpolados nos segmentos, então uma curva desenhada como reta de dois vértices passa a contribuir com pontos a cada N metros. O limiar de aresta do TIN é ajustado ao espaçamento medido entre curvas vizinhas, para que densificar não faça o filtro apagar os triângulos de ligação.'),
        h('div',{className:'field-row'},
          h('label',{className:'field-label',htmlFor:'f-margem'},'Margem'),
          h('input',{id:'f-margem',className:'fld',type:'number',step:'5',min:'0',max:'300',
            value:margem,disabled:isBusy,onChange:e=>setMargem(Number(e.target.value)||0)}),
          h('span',{className:'slot-meta'},'m')),
        h('p',{className:'hint',style:{marginBottom:'10px'}},
          'Faixa de curvas de nível considerada além do limite da Área Total. Garante que os vértices do perímetro recebam cota por interpolação baricêntrica exata em vez do vizinho mais próximo.'),
        h('div',{className:'field-row'},
          h('span',{className:'field-label',id:'lbl-cota'},'Cota entre curvas'),
          h('div',{className:'seg',style:{flex:1},role:'group','aria-labelledby':'lbl-cota'},
            ...[['TIN + proporção','auto'],['Só proporção','prop']].map(([lb,v])=>
              h('button',{key:v,onClick:()=>setModoCota(v),disabled:isBusy,
                'aria-pressed':modoCota===v?'true':'false'},lb)))),
        h('p',{className:'hint',style:{marginBottom:'10px'}},
          'Vértices que caem na faixa entre duas curvas, sem tocar nenhuma — o caso de uma rua quase paralela às curvas. TIN + proporção usa a interpolação baricêntrica quando existe triângulo e cai na proporção de distância quando não existe. Só proporção calcula sempre pela distância às duas curvas mais próximas: z = z1 + (z2−z1)·d1/(d1+d2).'),
        h('div',{className:'field-row'},
          h('span',{className:'field-label',id:'lbl-borda'},'Passo da borda'),
          h('div',{className:'seg',style:{flex:1},role:'group','aria-labelledby':'lbl-borda'},
            ...[['2 m',2],['5 m',5],['8 m',8]].map(([lb,v])=>
              h('button',{key:v,onClick:()=>setBordaM(v),disabled:isBusy,
                'aria-pressed':bordaM===v?'true':'false'},lb)))),
        h('label',{className:'chk'},
          h('input',{type:'checkbox',checked:adapt,disabled:isBusy,
            onChange:e=>setAdapt(e.target.checked)}),
          h('span',null,'Refino adaptativo do contorno')),
        adapt&&h('div',{className:'field-row'},
          h('label',{className:'field-label',htmlFor:'f-tolb'},'Erro máx.'),
          h('input',{id:'f-tolb',className:'fld',type:'number',step:'0.01',min:'0.005',
            value:tolBorda,disabled:isBusy,
            onChange:e=>setTolBorda(Number(e.target.value)||0.05)}),
          h('span',{className:'slot-meta'},'m')),
        h('p',{className:'hint',style:{marginBottom:'10px'}},
          'Trechos retos de rua e calçada sem vértice entre as curvas eram amostrados no mesmo passo do resto e a cota escorregava justamente na divisa. Com o refino ligado, o passo base pode ser folgado: cada trecho é medido no meio e só ganha pontos enquanto o erro de cota passar do limite. Plano não recebe ponto nenhum; rampa recebe o que precisar, até 0,5 m.'),
        h('label',{className:'chk'},
          h('input',{type:'checkbox',checked:corrigirPlanos,disabled:isBusy,
            onChange:e=>setCorrigirPlanos(e.target.checked)}),
          h('span',null,'Corrigir triângulos planos do TIN (experimental)')),
        h('p',{className:'hint',style:{marginBottom:'10px'}},
          'DESLIGADO por padrão. A ideia era ignorar triângulos com os três vértices na mesma curva e resolver a cota pela proporção de distância. Em teste de campo o resultado PIOROU: numa reentrância, a curva de cota diferente mais próxima em planta nem sempre é a que faz par com a curva local, e a proporção erra. Ligue só para comparar.'),
        h('label',{className:'chk'},
          h('input',{type:'checkbox',checked:conforme,disabled:isBusy,
            onChange:e=>setConforme(e.target.checked)}),
          h('span',null,'Malha única conforme (experimental)')),
        h('p',{className:'hint',style:{marginBottom:'10px'}},
          'Desligado (padrão) reproduz o app de referência: cada uso do solo é triangulado por conta própria. Ligado, triangula tudo junto e separa pelo centróide — a divisa entre Calçada e Rua passa a compartilhar os mesmos vértices, mas é um caminho que a referência não segue.'),
        h('button',{className:'btn btn-pri',style:{width:'100%'},
          onClick:doTIN,disabled:isBusy||!hits.length||!nPerims},
          busy==='tin'?'Triangulando…':'Gerar TIN por uso do solo'),
        busy==='tin'&&h('div',{className:'pb'},h('div',{className:'pf',style:{width:pct+'%'}})),
        !hits.length&&h('div',{className:'alert alert-info',style:{marginTop:'8px'}},
          'Faltam curvas cotadas (aba Guia).'),
        !nPerims&&h('div',{className:'alert alert-info',style:{marginTop:'8px'}},
          'Falta ao menos um perímetro (aba Perímetros).'),

        stats&&h('dl',{className:'kv',style:{marginTop:'12px'}},
          h('dt',null,stats.semArea?'Limite (união)':'Área Total'),
          h('dd',null,stats.aLim.toLocaleString('pt-BR',{maximumFractionDigits:0})+' m²'),
          h('dt',null,'Cota mín / máx'),h('dd',null,stats.zMin+' / '+stats.zMax+' m'),
          h('dt',null,'Desnível'),h('dd',null,stats.dnivel+' m'),
          h('dt',null,'Pontos cotados'),h('dd',null,stats.npts.toLocaleString('pt-BR')),
          h('dt',null,'Triâng. TIN global'),h('dd',null,stats.ntriG.toLocaleString('pt-BR')),
          h('dt',null,'Triâng. por uso'),h('dd',null,stats.ntri.toLocaleString('pt-BR')),
          h('dt',null,'Nós de cruzamento'),h('dd',null,(stats.ncruz||0).toLocaleString('pt-BR')),
          h('dt',null,'Curvas cotadas'),h('dd',null,(stats.ncot||0)+' ('+(stats.nherd||0)+' herdadas)'),
          h('dt',null,'Borda resolvida'),h('dd',null,(stats.pctEx||0)+'%'),
          h('dt',null,'Por proporção'),h('dd',null,(stats.nprop||0).toLocaleString('pt-BR'))),

        tins&&h('div',{style:{marginTop:'12px'}},
          h('h3',{className:'card-title'},h(Icon,{n:'eye'}),'Camadas no mapa'),
          h('div',{className:'alert alert-info',style:{marginBottom:'8px'}},
            'O preview colorido usa camada temporária, que só desenha prismas de topo plano — cada triângulo aparece achatado na sua cota média. A superfície inclinada de verdade só existe depois de aplicar o patch slab nas seções do Giraffe.'),
          h('label',{className:'chk'},
            h('input',{type:'checkbox',checked:separarLayers,disabled:isBusy,
              onChange:e=>setSepararLayers(e.target.checked)}),
            h('span',null,'Criar cada uso do solo em sua própria camada')),
          !separarLayers&&h('div',{className:'field-row',style:{marginBottom:'8px'}},
          h('span',{className:'field-label'},'Cores'),
          ...USOS.filter(u=>tins[u.k]?.features?.length).map(u=>
            h('input',{key:u.k,type:'color',value:coresAplic[u.k]||'#cccccc',disabled:isBusy,
              'aria-label':'Cor de '+u.lb,title:u.lb,
              style:{width:'32px',height:'40px',padding:'0',
                border:'1px solid var(--md-sys-color-outline)',borderRadius:'0',
                background:'transparent',cursor:'pointer'},
              onChange:e=>setCoresAplic(p=>({...p,[u.k]:e.target.value}))}))),
        separarLayers&&h('div',{style:{marginBottom:'8px'}},
            ...USOS.filter(u=>tins[u.k]?.features?.length).map(u=>
              h('div',{key:u.k,className:'field-row',style:{marginBottom:'4px'}},
                h('input',{type:'color',value:coresAplic[u.k]||'#cccccc',disabled:isBusy,
                  'aria-label':'Cor de '+u.lb,
                  style:{width:'32px',height:'40px',padding:'0',border:'1px solid var(--md-sys-color-outline)',
                    borderRadius:'0',background:'transparent',cursor:'pointer',flexShrink:0},
                  onChange:e=>setCoresAplic(p=>({...p,[u.k]:e.target.value}))}),
                h('input',{className:'fld',type:'text',value:layerNomes[u.k]||'',
                  disabled:isBusy,'aria-label':'Nome da camada de '+u.lb,
                  placeholder:'default',
                  onChange:e=>setLayerNomes(p=>({...p,[u.k]:e.target.value}))}))),
            h('p',{className:'hint'},
              'Cor e nome de cada camada. A cor vai nas seções criadas como color, stroke, fillOpacity 1 e strokeOpacity 0. Se o Giraffe recusar um nome de camada, o app repete a criação na camada ativa e avisa no log.')),
          h('button',{className:'btn btn-pri',style:{width:'100%',marginBottom:'8px'},
            onClick:doAplicar3D,disabled:isBusy},
            h(Icon,{n:'pin'}),
            String(busy).startsWith('fix-')?'Aplicando…':'Aplicar superfície 3D no Giraffe'),
          h('div',{style:{display:'flex',flexDirection:'column',gap:'6px'}},
            ...USOS.filter(u=>tins[u.k]?.features?.length).map(u=>
              h('div',{key:u.k,className:'slot on'},
                h('span',{className:'swatch',style:{backgroundColor:u.cor}}),
                h('div',{style:{flex:1,minWidth:0}},
                  h('div',{className:'slot-name'},u.lb),
                  h('div',{className:'slot-meta'},
                    tins[u.k].features.length.toLocaleString('pt-BR')+' triângulos')),
                h('button',{className:'btn btn-out btn-icon',onClick:()=>toggleVis(u.k),
                  'aria-label':(vis[u.k]?'Ocultar ':'Mostrar ')+u.lb,
                  'aria-pressed':vis[u.k]?'true':'false'},
                  h(Icon,{n:vis[u.k]?'eye':'eyeoff',s:16})),
                h('button',{className:'btn btn-out btn-icon',onClick:()=>doFixar(u.k),
                  disabled:isBusy,'aria-label':'Fixar '+u.lb+' na camada ativa do Giraffe',
                  title:'Fixar no Giraffe'},h(Icon,{n:'pin',s:16}))
              ))),
          h('p',{className:'hint',style:{marginTop:'8px'}},
            'Ative a camada de destino no painel do Giraffe antes de aplicar. O alfinete aplica só aquele uso do solo.')
        )
      ),

      // ══ ABA 3 · EXPORTAR ══════════════════════════════════════
      tab===3&&h('section',{className:'card'},
        h('h2',{className:'card-title'},h(Icon,{n:'download'}),'5 · Exportação'),
        !tins&&h('div',{className:'alert alert-info',style:{marginBottom:'10px'}},
          'Gere o TIN antes de exportar.'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:'6px'}},
          h('button',{className:'btn btn-pri',onClick:doGLB,disabled:isBusy||!tins},
            h(Icon,{n:'download'}),busy==='glb'?'Gerando GLB…':'Baixar TIN em GLB'),
          h('button',{className:'btn btn-out',onClick:doGeoJSON,disabled:isBusy||!tins},
            h(Icon,{n:'download'}),'Baixar GeoJSON 3D'),
          h('button',{className:'btn btn-out',onClick:doGltfCena,disabled:isBusy},
            h(Icon,{n:'download'}),busy==='gltf'?'Exportando…':'Exportar cena 3D do Giraffe')),
        h('p',{className:'hint',style:{marginTop:'10px'}},
          'O GLB local usa metros com origem no centro da área (Y para cima), um material por uso do solo. A exportação da cena usa getGltf e inclui todo o modelo visível no Giraffe.')
      ),

      // ─ Log (sempre visível)
      h('section',{className:'card'},
        h('h2',{className:'card-title'},'Log'),
        h('div',{className:'log',ref:logEl,role:'log','aria-live':'polite','aria-label':'Registro de operações'},
          logs.length===0
            ?h('span',{className:'l-info'},'Pronto.')
            :logs.map((l,i)=>h('div',{key:i},
                h('span',{className:'l-ts'},'['+l.ts+'] '),
                h('span',{className:'l-'+l.t},l.m))))
      )
    )
  );
}
return AppLevantamento;
})();

// ══════════════════════════════════════════════════════════════
//  Casca · alterna entre os dois módulos de terreno
// ══════════════════════════════════════════════════════════════
const MODULOS=[
  {k:'geosampa',    lb:'Terreno GeoSampa',    ic:'download'},
  {k:'levantamento',lb:'Terreno Levantamento',ic:'mountain'},
];

function Shell(){
  const[mod,setMod]=useState(()=>localStorage.getItem('kv_terreno_modulo')||'geosampa');
  useEffect(()=>{localStorage.setItem('kv_terreno_modulo',mod);},[mod]);

  const[dark,setDark]=useState(()=>{
    const s=localStorage.getItem('kv_terreno_tema');
    if(s) return s==='dark';
    return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  });
  useEffect(()=>{
    document.documentElement.className=dark?'dark':'light';
    localStorage.setItem('kv_terreno_tema',dark?'dark':'light');
  },[dark]);
  useEffect(()=>{
    if(!window.matchMedia) return;
    const mq=window.matchMedia('(prefers-color-scheme: dark)');
    const fn=e=>{if(!localStorage.getItem('kv_terreno_tema')) setDark(e.matches);};
    try{mq.addEventListener('change',fn);}catch(_){}
    return()=>{try{mq.removeEventListener('change',fn);}catch(_){}};
  },[]);

  return h('div',{className:'app'},

    h('header',{className:'app-header'},
      h('div',{className:'logo-container'},
        h('img',{className:'brand-logo pos',src:LOGO_POS,
          alt:'Königsberger Vannucchi Arquitetos Associados'}),
        h('img',{className:'brand-logo neg',src:LOGO_NEG,
          alt:'Königsberger Vannucchi Arquitetos Associados'}),
        h('p',{className:'app-title'},'Terreno 3D')
      ),
      h('button',{className:'btn btn-out btn-icon',onClick:()=>setDark(d=>!d),
        'aria-label':dark?'Ativar tema claro':'Ativar tema escuro',
        title:dark?'Tema claro':'Tema escuro'},
        h(ShellIcon,{n:dark?'sun':'moon',s:18}))
    ),

    h('nav',{className:'mods',role:'tablist','aria-label':'Módulos de terreno'},
      ...MODULOS.map(m=>h('button',{
        key:m.k,className:'mod',role:'tab',id:'mod-'+m.k,
        'aria-selected':mod===m.k?'true':'false','aria-controls':'painel-'+m.k,
        onClick:()=>setMod(m.k)},
        h(ShellIcon,{n:m.ic,s:16}),h('span',null,m.lb)))
    ),

    // Os dois módulos ficam montados o tempo todo: alternar de aba não pode
    // descartar o estado de uma análise em andamento.
    h('div',{className:'mod-host'},
      h('div',{className:'geo-scope',role:'tabpanel',id:'painel-geosampa',
        'aria-labelledby':'mod-geosampa',hidden:mod!=='geosampa',
        style:{display:mod==='geosampa'?'flex':'none'}},
        h(AppGeoSampa,null)),
      h('div',{role:'tabpanel',id:'painel-levantamento',
        'aria-labelledby':'mod-levantamento',hidden:mod!=='levantamento',
        style:{display:mod==='levantamento'?'flex':'none',flex:1,minHeight:0,
          flexDirection:'column',overflow:'hidden'}},
        h(AppLevantamento,null))
    ),

    h('footer',{className:'app-footer'},
      h('span',null,VERSION),
      h('span',null,'© 2026 Königsberger Vannucchi')
    )
  );
}

createRoot(document.getElementById('root')).render(h(Shell,null));

</script>
</body>
</html>
